# Справжнє GUI-дерево D2; headless джерела SENS не залежать від LCL.
name: Lazarus — графічне двійкове дерево SENS
on:
  pull_request:
    paths:
      - 'gui/binary-tree.lpr'
      - 'gui/binary-tree.lpi'
      - 'scripts/test-lcl-binary-tree.sh'
      - '.github/workflows/lcl-binary-tree.yml'
      - 'src/wsm.binarytree.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.physloc.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.domain.pas'
      - 'src/senst5m.lpr'
      - 'refs/**'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'gui/binary-tree.lpr'
      - 'gui/binary-tree.lpi'
      - 'scripts/test-lcl-binary-tree.sh'
      - '.github/workflows/lcl-binary-tree.yml'
      - 'src/wsm.binarytree.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.physloc.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.domain.pas'
      - 'src/senst5m.lpr'
      - 'refs/**'
      - 'external/sens'
permissions:
  contents: read
jobs:
  lcl-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити справжній Lazarus/LCL GTK2, Free Pascal і Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відтворити pinned двійковий контракт SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати реальний GUI та перевірити дерево під Xvfb
        run: bash ./scripts/test-lcl-binary-tree.sh
