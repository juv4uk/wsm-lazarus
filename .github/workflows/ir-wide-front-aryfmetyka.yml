# G6.107 — одна нативна точка входу для шести перевірених форм.
name: Компілятор — шість фізичних профілів WideIR, D5 ADD та IMUL
on:
  pull_request:
    paths:
      - 'src/wsm.irwidefront.pas'
      - 'scripts/test-irwidefront.pas'
      - 'scripts/test-irwidefront-aryfmetyka.sh'
      - '.github/workflows/ir-wide-front-aryfmetyka.yml'
      - 'src/wsm.irwideaddreg.pas'
      - 'src/wsm.irwidemul.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irwidefront.pas'
      - 'scripts/test-irwidefront.pas'
      - 'scripts/test-irwidefront-aryfmetyka.sh'
      - '.github/workflows/ir-wide-front-aryfmetyka.yml'
      - 'src/wsm.irwideaddreg.pas'
      - 'src/wsm.irwidemul.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  six-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Взяти exact commit
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Взяти незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal 3.2.x і машинні аналізатори
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Довести checked FPC, 21 ELF та 16 старих програм
        run: timeout 900s bash scripts/test-irwidefront-aryfmetyka.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Побудувати незалежний pinned SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 1200s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
      - name: Незалежний SENS oracle для шести профілів
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 900s bash scripts/test-irwidefront-aryfmetyka.sh
      - name: Обмеження досліду
        run: |
          echo 'Шість explicit verified machine profiles, а не загальний компілятор.' >> "$GITHUB_STEP_SUMMARY"
          echo '21 ELF ADD/IMUL, 4 widened D24, 16 старих форм і 24 negative.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Вимірювання енергії/RAPL у цьому зрізі відсутні.' >> "$GITHUB_STEP_SUMMARY"
