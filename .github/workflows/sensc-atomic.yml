# G6.128 — атомарність лише приватного структурного SIR1, без SENS семантики.
name: Компілятор — атомарний структурний SIR1

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  sir1-atomic:
    name: Реальний FPC — SIR1 no-clobber, негативи і регресія
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати точні файли ревізії
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned авторитет
        run: ./scripts/sync-authority.sh
      - name: Перевірити приватне SIR1, гонки та відмови
        shell: bash
        run: bash ./scripts/test-sensc-atomic.sh
      - name: Не послаблювати початкову регресію компілятора
        shell: bash
        run: bash ./scripts/test-compiler.sh
