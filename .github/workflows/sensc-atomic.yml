# G6.128 — атомарність лише приватного структурного SIR1, без SENS семантики.
name: Компілятор — атомарний структурний SIR1

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  sir1-atomic:
    name: Реальний FPC — SIR1 no-clobber, негативи і регресія
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати точні файли ревізії
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Синхронізувати pinned авторитет
        run: ./scripts/sync-authority.sh
      - name: Перевірити приватне SIR1, гонки та відмови
        shell: bash
        run: bash ./scripts/test-sensc-atomic.sh
      - name: Не послаблювати початкову регресію компілятора
        shell: bash
        run: bash ./scripts/test-compiler.sh
