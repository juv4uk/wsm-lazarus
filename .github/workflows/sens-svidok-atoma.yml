# G2.51: фізичний атом із явним D7 або D12+; ніякого нового закону.
name: SENS — фізичний свідок атома D7 та D12+
on:
  pull_request:
    paths:
      - 'src/senssvidokatoma.lpr'
      - 'scripts/test-senssvidokatoma.sh'
      - '.github/workflows/sens-svidok-atoma.yml'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.proektsii.pas'
      - 'src/wsm.physloc.pas'
      - 'external/sens'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-atom:
    name: Free Pascal — явні домени та шість pinned проєкцій
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler
          fpc -iV
      - name: Відновити exact pinned SENS
        run: timeout 300s ./scripts/sync-authority.sh
      - name: Скласти виконуваний файл і виконати фізичні та негативні тести
        run: timeout 600s bash scripts/test-senssvidokatoma.sh
