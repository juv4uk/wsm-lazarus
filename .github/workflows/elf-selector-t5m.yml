# G6.26 — машинні селектори виконуються як справжній Linux ELF64.
name: Машинні D3 селектори — фізична T5M-відповідь
on:
  pull_request:
    paths:
      - 'src/wsm.elfselectort5m.pas'
      - 'scripts/test-elfselectort5m.pas'
      - 'scripts/test-elfselectort5m.sh'
      - '.github/workflows/elf-selector-t5m.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-machine-selector:
    name: FPC та Linux ELF64 — 8 фізичних CONS-селекторів
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Установити FPC та машинний дизасемблер
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler binutils git
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати машинні програми
        run: bash ./scripts/test-elfselectort5m.sh
