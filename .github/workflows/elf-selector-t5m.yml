# G6.26 — машинні селектори виконуються як справжній Linux ELF64.
name: Машинні D3 селектори — фізична T5M-відповідь
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-machine-selector:
    name: FPC та Linux ELF64 — 8 фізичних CONS-селекторів
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      # fp-compiler: обліковується чинним FPC-BUDGET як кешований nightly,
      # а не як зниклий тест після заміни безумовного apt-get.
      - name: Кеш FPC 3.2.2 (спільний між nightly workflow)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Відновити FPC 3.2.2 (теплий кеш або холодний apt)
        run: bash ./scripts/fpc-restore.sh
      - name: Перевірити GNU binutils для доказу машинного ELF64
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v readelf >/dev/null 2>&1 || ! command -v objdump >/dev/null 2>&1; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends binutils
          fi
          command -v readelf >/dev/null
          command -v objdump >/dev/null
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати машинні програми
        run: bash ./scripts/test-elfselectort5m.sh
