# G3.48 — лише механічне exact-width виконання: не новий закон SENS.
name: Core1 — фізичні ширини D7 та D12+
on:
  pull_request:
    paths:
      - 'scripts/test-core1-tochni-shyryny.py'
      - '.github/workflows/core1-tochni-shyryny.yml'
      - 'src/senscore1vykon.lpr'
      - 'src/wsm.core1first.pas'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'scripts/test-core1-tochni-shyryny.py'
      - '.github/workflows/core1-tochni-shyryny.yml'
      - 'src/senscore1vykon.lpr'
      - 'src/wsm.core1first.pas'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  tochni-shyryny:
    name: Реальний FPC і побайтові фізичні свідки
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати поточну реалізацію
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler python3 git
          fpc -iV
      - name: Відновити pinned двійковий авторитет SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити незалежний тестовий кодувальник
        run: python3 -B scripts/test-core1-tochni-shyryny.py --самоперевірка
      - name: Зібрати FPC і перевірити exact-width та відмови
        run: python3 -B scripts/test-core1-tochni-shyryny.py
