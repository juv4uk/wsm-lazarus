# G2.42: pinned reverse projection catalog, ніякого callable dispatch.
name: Free Pascal — точний пошук шести проєкцій
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-projection-search:
    name: FPC · шість проєкцій / міждоменна неоднозначність / відмови
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній компілятор Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відтворити точно закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати CLI і запустити позитиви та негативи
        run: bash ./scripts/test-sensposhuk.sh
