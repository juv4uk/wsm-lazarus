name: Нативна D3 відповідь як фізичний T5M
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-answer:
    name: FPC 3.2.2 — точні T5M відповіді, D2 та heaptrc
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Матеріалізувати pinned SENS Contract 12
        run: ./scripts/sync-authority.sh
      - name: Реальне виконання, зворотне фізичне читання та негативи
        run: |
          bash scripts/test-native-physical-answer.sh
          bash scripts/test-native-quote.sh
          bash scripts/test-native-render.sh
          bash scripts/test-binaryexec.sh
