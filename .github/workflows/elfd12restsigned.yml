# G6.184 — нативна знакова Д6:010100 остача з фізичним D12 stdout.
# На push workflow НЕ запускається; Rust/Zig лише pinned semantic oracle PR.
name: SENS — знакова Д6 остача в машинному ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12restsigned.pas'
      - 'src/sensd12restsigned.lpr'
      - 'scripts/test-elfd12restsigned.sh'
      - '.github/workflows/elfd12restsigned.yml'
      - 'src/wsm.elfd12restpotik.pas'
      - 'src/wsm.elfd12addpotikadaptive.pas'
      - 'src/wsm.elfd12quotadaptive.pas'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити лише FPC 3.2.2 і машинні інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils python3 git
          fpc -iV
      - name: Матеріалізувати pinned SENS Contract 12
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити Bash
        run: bash -n scripts/test-elfd12restsigned.sh
      - name: Дійсна FPC/ELF64/IDIV, D12 18 (знакових 4), 16+4 негативи
        run: timeout 900s bash scripts/test-elfd12restsigned.sh
  oracle:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити тільки FPC та git для фізичних свідків
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler python3 binutils git
      - name: Матеріалізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Побудувати незалежний pinned SENS REPL лише після native SUCCESS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Перевірити 18 pinned Д6 остач; для −2048 — fail-closed
        env:
          SENS_ORACLE_BIN: sens-oracle/target/debug/sens
          REQUIRE_SENS_ORACLE: '1'
        run: timeout 900s bash scripts/test-elfd12restsigned.sh
      - name: Не вигадувати джоулі
        run: echo ENERGY_NOT_MEASURED
