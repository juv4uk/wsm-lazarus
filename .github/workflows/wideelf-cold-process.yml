# G6.159 — окремий холодний запуск кожного вже зібраного native ELF64.
name: SENS — 512 незалежних запусків фізичних ELF64
on:
  pull_request:
    paths:
      - 'scripts/test-wideelf-cold-process.sh'
      - '.github/workflows/wideelf-cold-process.yml'
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine:
    name: FPC 3.2.2 — T5M/WideIR/ELF64 і 512 процесів
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC і машинні інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler binutils git
          fpc -iV
      - name: Отримати pinned джерело законів
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Побудувати та виконати фізичні ELF64 в окремих процесах
        run: timeout 750s bash scripts/test-wideelf-cold-process.sh
      - name: Зазначити межі доказу
        run: echo 'ASLR_NOT_MEASURED; ENERGY_NOT_MEASURED; INDEPENDENT_ORACLE_NOT_CHECKED'
