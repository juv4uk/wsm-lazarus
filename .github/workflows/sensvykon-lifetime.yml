name: Двійковий CLI — звільнення пам'яті після відмови

on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  vykonavets-bez-vytokiv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити реальний Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити ізоляцію нативного ядра від LCL
        run: ./scripts/check-no-lcl.sh
      - name: Перевірити життєвий цикл CLI з heaptrc
        run: bash ./scripts/test-sensvykon-lifetime.sh
