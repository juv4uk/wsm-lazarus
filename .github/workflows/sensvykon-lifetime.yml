name: Двійковий CLI — звільнення пам'яті після відмови

on:
  pull_request:
    paths:
      - 'src/sensvykon.lpr'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.nativeeval.pas'
      - 'scripts/test-sensvykon-lifetime.sh'
      - '.github/workflows/sensvykon-lifetime.yml'
      - 'scripts/sync-authority.sh'
      - 'external/sens'
      - 'refs/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  vykonavets-bez-vytokiv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити реальний Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити ізоляцію нативного ядра від LCL
        run: ./scripts/check-no-lcl.sh
      - name: Перевірити життєвий цикл CLI з heaptrc
        run: bash ./scripts/test-sensvykon-lifetime.sh
