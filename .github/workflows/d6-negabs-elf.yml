# G6.181 — фізичний D6 NEG→ABS, справжній FPC→ELF64.
# PR/manual only; ніяких push/schedule чи важких збірок на push.
name: Компілятор — вкладені D6 NEG і ABS у єдиному ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.ird6negabs.pas'
      - 'src/sensd6negabself.lpr'
      - 'scripts/test-d6negabs-fixtures.pas'
      - 'scripts/test-d6negabs-elf.sh'
      - '.github/workflows/d6-negabs-elf.yml'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Отримати точний HEAD
        uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Встановити мінімальний Free Pascal за потреби
        run: |
          set -euo pipefail
          if ! command -v fpc >/dev/null; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler
          fi
          fpc -iV
      - name: Отримати pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити shell та виконати справжні ELF64
        run: |
          bash -n scripts/test-d6negabs-elf.sh
          timeout 700s bash scripts/test-d6negabs-elf.sh

  oracle:
    # Rust/Zig тільки PR/manual; не запускати на push.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати точний HEAD
        uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Отримати pinned SENS REPL
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC за потреби
        run: |
          set -euo pipefail
          if ! command -v fpc >/dev/null; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler
          fi
      - name: Синхронізувати pinned authority
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Звірити 14 вкладених D6 із pinned SENS
        env:
          REQUIRE_SENS_ORACLE: '1'
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 700s bash scripts/test-d6negabs-elf.sh
      - name: Задокументувати межі доказу
        run: |
          echo 'G6.181: pinned SENS REPL підтверджує лише вкладені D6 NEG→ABS; не довільний compiler.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Енергетичні джоулі/RAPL не вимірювали.' >> "$GITHUB_STEP_SUMMARY"
