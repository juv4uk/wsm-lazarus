name: Потоковий T5M — широкі точні D2-слова
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/wsm.t5madmission.pas'
      - 'scripts/test-t5m-wide-stream.pas'
      - 'scripts/test-t5m-wide-stream.sh'
      - '.github/workflows/t5m-wide-stream.yml'
permissions:
  contents: read
jobs:
  wide-t5m:
    name: FPC 3.2.2 — narrow/wide D2 і негативні свідки
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Завантажити код
        uses: actions/checkout@v4
      - name: Встановити компілятор
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler
          fpc -iV
      - name: Зібрати й фізично перевірити вузький та широкий потоки
        run: bash scripts/test-t5m-wide-stream.sh
