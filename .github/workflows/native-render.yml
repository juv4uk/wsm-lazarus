name: Нативний вивід точних структур D3
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-render:
    name: FPC — довгий фізичний QUOTE, dotted та heaptrc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити FPC (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Під'єднати точно закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Справжнє виконання й регресії
        run: |
          bash scripts/test-native-render.sh
          bash scripts/test-native-quote.sh
          bash scripts/test-binaryexec.sh
