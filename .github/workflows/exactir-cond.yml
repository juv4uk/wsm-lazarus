# G6.37: pinned ExactIR provenance -> виконавчий D3:110 -> Linux ELF64.
name: Довірений ExactIR — справжня машинна умова D3
on:
  pull_request:
    paths:
      - 'src/wsm.exactirtoelf.pas'
      - 'scripts/test-exactir-cond.pas'
      - 'scripts/test-exactir-cond.sh'
      - '.github/workflows/exactir-cond.yml'
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fizychna-mashynna-umova:
    name: FPC 3.2.2 — дев’ять фізичних умов, ELF64 та негативний ExactIR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точний стан репозиторію
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal і ELF-інструменти
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler git binutils
          fpc -iV
      - name: Підготувати ратифікований SENS
        run: ./scripts/sync-authority.sh
      - name: Справжня FPC збірка та Linux x86-64 виконання
        run: bash ./scripts/test-exactir-cond.sh
