# G6.119 — signed D12 НСД D6:010101 в одному багаторазовому фізичному ELF64.
name: Компілятор — динамічний фізичний НСД D12 через x86-64 DIV
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12nsdpotik.pas'
      - 'src/sensd12nsdpotikelf.lpr'
      - 'scripts/test-elfd12nsdpotik.pas'
      - 'scripts/test-elfd12nsdpotik.sh'
      - '.github/workflows/elf-d12-nsd-potik.yml'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfd12nsdpotik.pas'
      - 'src/sensd12nsdpotikelf.lpr'
      - 'scripts/test-elfd12nsdpotik.pas'
      - 'scripts/test-elfd12nsdpotik.sh'
      - '.github/workflows/elf-d12-nsd-potik.yml'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.numericadd.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamichnyi-d12:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати Lazarus/FPC джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS 12.0
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити реальний FPC та інструменти x86-64 ELF
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Матеріалізувати перевірений pinned Contract 12
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS Rust/Zig з незмінного commit
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1500s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Перевірити 78 знакових виконань, 39 SENS-оракулів і 12 фізичних відмов
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-elfd12nsdpotik.sh
          timeout 600s bash scripts/test-elfd12nsdpotik.sh
      - name: Відокремити реальні енергетичні виміри
        run: echo 'ENERGY_NOT_MEASURED — цей gate перевіряє 78 машинних запусків і 39 pinned REPL'
