name: SENS — native ELF64 D6 додати-1
on:
  pull_request:
    paths:
      - '.github/workflows/elf-d6-add1.yml'
      - 'src/wsm.elfd6add1.pas'
      - 'src/sensd6add1-elf.lpr'
      - 'scripts/test-d6add1-elf*'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.domain.pas'
      - 'src/wsm.bind.pas'
      - 'src/wsm.source.pas'
      - 'src/wsm.numericadd.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - '.github/workflows/elf-d6-add1.yml'
      - 'src/wsm.elfd6add1.pas'
      - 'src/sensd6add1-elf.lpr'
      - 'scripts/test-d6add1-elf*'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.domain.pas'
      - 'src/wsm.bind.pas'
      - 'src/wsm.source.pas'
      - 'src/wsm.numericadd.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Встановити FPC та binutils
        run: |
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils
      - name: Матеріалізувати джерело законів
        run: timeout 240s ./scripts/sync-authority.sh
      - name: Зібрати та запустити ELF64
        run: timeout 240s bash ./scripts/test-d6add1-elf.sh
  pinned-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC та git
        run: |
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
      - name: Матеріалізувати джерело законів
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати точний REPL SENS
        run: |
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Порівняти результат ELF з REPL
        run: SENS_ORACLE_BIN="$PWD/sens-oracle/target/debug/sens" timeout 240s bash ./scripts/test-d6add1-elf.sh
