# G6.5: EIR1 — приватне свідчення точного IR; НЕ мова і НЕ codegen.
name: Точний EIR1 — фізичний допуск

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  eir1:
    name: Реальний Free Pascal — точне EIR1 і відмови
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати файли проєкту
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити компілятор Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Завантажити точний pinned SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Побудувати EIR1 та відхилити фізичні підробки
        shell: bash
        run: bash ./scripts/test-exactir-wire.sh
