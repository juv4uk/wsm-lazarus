# G6.5: EIR1 — приватне свідчення точного IR; НЕ мова і НЕ codegen.
name: Точний EIR1 — фізичний допуск

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  eir1:
    name: Реальний Free Pascal — точне EIR1 і відмови
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати файли проєкту
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити компілятор Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Завантажити точний pinned SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Побудувати EIR1 та відхилити фізичні підробки
        shell: bash
        run: bash ./scripts/test-exactir-wire.sh
