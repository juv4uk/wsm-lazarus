# G6.5: EIR1 — приватне свідчення точного IR; НЕ мова і НЕ codegen.
name: Точний EIR1 — фізичний допуск

on:
  pull_request:
    paths:
      - 'src/wsm.exactirwire.pas'
      - 'src/sensexact.lpr'
      - 'scripts/test-exactir-wire.pas'
      - 'scripts/test-exactir-wire.sh'
      - '.github/workflows/exact-ir-wire.yml'
      - 'src/wsm.exactir.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.physloc.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.domain.pas'
      - 'src/wsm.bind.pas'
      - 'refs/**'
      - 'external/sens'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  eir1:
    name: Реальний Free Pascal — точне EIR1 і відмови
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати файли проєкту
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити компілятор Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Завантажити точний pinned SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Побудувати EIR1 та відхилити фізичні підробки
        shell: bash
        run: bash ./scripts/test-exactir-wire.sh
