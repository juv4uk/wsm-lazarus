# G5.23: двійкові фізичні Core4-виклики через приватне host framing.
name: core4-binary-channel
on:
  pull_request:
    paths:
      - 'src/senscore4kanal.lpr'
      - 'scripts/test-core4kanal.pas'
      - 'scripts/test-core4kanal.sh'
      - '.github/workflows/core4-kanal.yml'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-channel-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Перевірити pinned SENS 12.0
        run: bash ./scripts/sync-authority.sh
      - name: Реальний FPC та негативні двійкові кадри
        run: bash ./scripts/test-core4kanal.sh
