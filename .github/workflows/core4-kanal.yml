# G5.23: двійкові фізичні Core4-виклики через приватне host framing.
name: core4-binary-channel
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-channel-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Перевірити pinned SENS 12.0
        run: bash ./scripts/sync-authority.sh
      - name: Реальний FPC та негативні двійкові кадри
        run: bash ./scripts/test-core4kanal.sh
