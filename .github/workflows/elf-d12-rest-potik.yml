# G6.120 — один перевикористовуваний нативний IDIV-ELF зі stdin D12.
name: Компілятор — повторна фізична D6 остача з stdin у ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12restpotik.pas'
      - 'src/sensd12restpotikelf.lpr'
      - 'scripts/test-elfd12restpotik.pas'
      - 'scripts/test-elfd12restpotik.sh'
      - '.github/workflows/elf-d12-rest-potik.yml'
      - 'src/wsm.elfd12potik.pas'
      - 'src/wsm.irwiderest.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfd12restpotik.pas'
      - 'src/sensd12restpotikelf.lpr'
      - 'scripts/test-elfd12restpotik.pas'
      - 'scripts/test-elfd12restpotik.sh'
      - '.github/workflows/elf-d12-rest-potik.yml'
      - 'src/wsm.elfd12potik.pas'
      - 'src/wsm.irwiderest.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    name: Checked FPC → 14×2 справжніх ELF запусків і 20 відмов
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити Free Pascal та інструменти ELF
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git python3
          fpc -iV
      - name: Отримати точний pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Зібрати kernel і виконати фізичні кадри
        run: timeout 300s bash scripts/test-elfd12restpotik.sh
  oracle:
    name: Незалежний pinned SENS REPL — усі 14 фізичних обчислень
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git python3
      - name: Підключити pinned закони SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Перевірити фізичні машинні результати проти SENS
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 300s bash scripts/test-elfd12restpotik.sh
      - name: Межі перевірки
        run: |
          echo 'Host kernel для позитивного D12, 14 входів, signed extension відхиляється.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це не повна .sens програма в stdin, не general compiler і не energy benchmark.' >> "$GITHUB_STEP_SUMMARY"
