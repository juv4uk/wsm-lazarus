# G3.19 — Linux stdin/stdout є тільки фізичним T5M, не текстом/REPL.
name: Двійковий D3-потік — фізичне виконання FPC
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fizychnyi-potik:
    name: FPC 3.2.x — canonical T5M pipe, точні байти й негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити справжній Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити точну pinned версію SENS
        run: ./scripts/sync-authority.sh
      - name: Виконати чинні G3.17 механічні тести і новий фізичний stdin/stdout
        run: bash scripts/test-potikd3.sh
