# G3.19 — Linux stdin/stdout є тільки фізичним T5M, не текстом/REPL.
name: Двійковий D3-потік — фізичне виконання FPC
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fizychnyi-potik:
    name: FPC 3.2.x — canonical T5M pipe, точні байти й негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити точну pinned версію SENS
        run: ./scripts/sync-authority.sh
      - name: Виконати чинні G3.17 механічні тести і новий фізичний stdin/stdout
        run: bash scripts/test-potikd3.sh
