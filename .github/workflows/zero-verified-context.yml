# G6.190 — isolated PR/manual checked FPC + first-new-program measurements.
# No push/schedule, no Rust/Zig/GPU/IDE builds.
name: Перевірений WideIR — перша D5 компіляція без повторних проходів
on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpc-first-new:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Отримати точний PR SHA
        uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити лише Free Pascal
        run: |
          set -euo pipefail
          if ! command -v fpc >/dev/null; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler
          fi
          fpc -iV
      - name: Синхронізувати pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Механічно перевірити оболонки
        run: |
          bash -n scripts/test-zero-context-compiler.sh
          python3 -m py_compile scripts/test-zero-context-compiler.py
      - name: FPC checked, 16 ELF64 і реальний вимір 96+96 перших програм
        env:
          SENS_ZERO_CONTEXT_REPORT: '${{ github.workspace }}/zero-context-results.json'
        run: timeout 1750s bash scripts/test-zero-context-compiler.sh
      - name: Зберегти сирі наносекунди першої компіляції
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d5-zero-verified-first-raw
          path: zero-context-results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Межі доказу
        run: |
          echo 'Тільки pinned D5:01000 signed D12→machine D1, 16 різних фізичних програм.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Незалежний REPL у цьому FPC-only CI: NOT_VERIFIED. Джоулі: NOT_MEASURED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Без мінімального порогу прискорення; сирі perf_counter_ns у артефакті.' >> "$GITHUB_STEP_SUMMARY"
