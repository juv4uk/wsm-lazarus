# G2.50 — коротка та повна українські проєкції не тотожні.
name: Українська укр — точні атоми pinned SENS
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-ukr-atoms:
    name: Справжній FPC — укр, D7 та відмови exact-domain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати нативний SENS
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відтворити pinned SENS Contract 12.0 та доменні таблиці
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити точні атоми укр
        run: bash ./scripts/test-ukratomy.sh
