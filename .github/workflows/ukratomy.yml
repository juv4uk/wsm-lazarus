# G2.50 — коротка та повна українські проєкції не тотожні.
name: Українська укр — точні атоми pinned SENS
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-ukr-atoms:
    name: Справжній FPC — укр, D7 та відмови exact-domain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати нативний SENS
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відтворити pinned SENS Contract 12.0 та доменні таблиці
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити точні атоми укр
        run: bash ./scripts/test-ukratomy.sh
