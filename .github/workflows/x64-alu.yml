# G6.92 — незалежний host x86-64 кодер ALU, без нового SENS закону.
name: Компілятор — машинний ALU x86-64 і фізичний ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.x64alu.pas'
      - 'scripts/test-x64alu.pas'
      - 'scripts/test-x64alu.sh'
      - '.github/workflows/x64-alu.yml'
      - 'src/wsm.x64code.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'external/sens'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x64-alu:
    name: Checked FPC → реальні x86-64 ELF64 → T5M свідки
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Взяти перевірюваний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal та binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler binutils
          fpc -iV
      - name: Зібрати checked FPC, виконати ELF і негативи
        run: timeout 600s bash scripts/test-x64alu.sh
      - name: Чесна межа доказу
        run: |
          echo '8 золотих інструкцій; 3 негативи; 4 реальні ELF64.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Використано pinned T5M, але не перевірено мовну XOR-семантику SENS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Джоулі не виміряно. Для енергії потрібен інструментований host.' >> "$GITHUB_STEP_SUMMARY"
