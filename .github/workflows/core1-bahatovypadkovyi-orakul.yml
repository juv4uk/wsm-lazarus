# G3.47 — багатосвідкове незалежне виконання першого Core1.
name: Core1 — 16 фізичних викликів проти незалежного SENS
on:
  pull_request:
    paths:
      - 'scripts/test-core1-bahatovypadkovyi-orakul.py'
      - 'scripts/test-core1-bahatovypadkovyi-orakul.sh'
      - '.github/workflows/core1-bahatovypadkovyi-orakul.yml'
      - 'src/senscore1vykon.lpr'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'scripts/test-core1-bahatovypadkovyi-orakul.py'
      - 'scripts/test-core1-bahatovypadkovyi-orakul.sh'
      - '.github/workflows/core1-bahatovypadkovyi-orakul.yml'
      - 'src/senscore1vykon.lpr'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  bahatosvidkovyi:
    name: Справжній FPC і 16 незалежних бібліотечних SENS-викликів
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити реальний Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git python3
          fpc -iV
      - name: Матеріалізувати перевірений pinned SENS
        run: ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Справді зібрати незалежний SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Перевірити шістнадцять незалежних Core1-відповідей та негативи
        run: bash scripts/test-core1-bahatovypadkovyi-orakul.sh
