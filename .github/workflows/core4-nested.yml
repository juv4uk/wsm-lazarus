name: SENS — вкладене фізичне виконання Core4
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-nested:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати точний SHA
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Виконати фізичні Core4-форми та стару регресію
        run: bash ./scripts/test-core4-nested.sh
