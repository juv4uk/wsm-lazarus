name: SENS — вкладене фізичне виконання Core4
on:
  pull_request:
    paths:
      - 'src/wsm.core4runtime.pas'
      - 'scripts/test-core4-nested.pas'
      - 'scripts/test-core4-nested.sh'
      - '.github/workflows/core4-nested.yml'
      - 'external/sens'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-nested:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати точний SHA
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Виконати фізичні Core4-форми та стару регресію
        run: bash ./scripts/test-core4-nested.sh
