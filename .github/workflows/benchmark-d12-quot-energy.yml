# G6.176: ручний функціональний parity gate. Ніколи не запускається на push/PR;
# hosted runner не має фізичного RAPL, тому звіт енергії тут не створюється.
name: SENS — ручний parity D12 ділення для енергетичного стенду
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-runtime-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити лише інструменти цього ручного профілю
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler gcc git python3
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Підтвердити pinned Contract 12.0
        run: |
          set -euo pipefail
          timeout 240s bash scripts/sync-authority.sh
          test "$(git -C external/sens rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
      - name: Побудувати незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Перевірити чотири реальні виконавці та відмови
        run: timeout 900s python3 scripts/energy/quot-runtime-benchmark.py --verify
      - name: Зафіксувати, що hosted CI не вимірює джоулі
        run: echo ENERGY_NOT_MEASURED
