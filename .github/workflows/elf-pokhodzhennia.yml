# G6.158 — реальна перевірка походження машинного ELF від канонічного T5M.
name: Компілятор — походження ELF64 від фізичного SENS
on:
  pull_request:
    paths:
      - 'src/senswidefrontelf.lpr'
      - 'scripts/test-elf-pokhodzhennia.sh'
      - '.github/workflows/elf-pokhodzhennia.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/senswidefrontelf.lpr'
      - 'scripts/test-elf-pokhodzhennia.sh'
      - '.github/workflows/elf-pokhodzhennia.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  provenance:
    name: FPC checked, 16 канонічних ELF64 та 9 відмов
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Забрати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Установити Free Pascal та інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl git binutils python3
          fpc -iV
      - name: Отримати ратифікований pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити фізичний компілятор та походження
        run: |
          set -euo pipefail
          bash -n scripts/test-elf-pokhodzhennia.sh
          timeout 480s bash scripts/test-elf-pokhodzhennia.sh
      - name: Межі доказу
        run: |
          echo 'Тільки перевірене повторне pinned WideIR→ELF64 і machine T5M.'
          echo 'Незалежний SENS REPL oracle та енергія тут не вимірюються.'
