# Core1.2 — тільки інтеграційна перевірка пам'яті й лексичного середовища.
name: Core1 — захоплені середовища та спільний GC
on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core1-gc-frame:
    name: Реальні FPC GC-корені та замикання
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити FPC (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Отримати точний pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити спільний GC і лексичні кадри
        run: bash ./scripts/test-gcclosure.sh
