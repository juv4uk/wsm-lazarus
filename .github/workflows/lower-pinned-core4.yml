# G6.130 — виконати СПРАВЖНЄ тіло pinned Core4 у machine code.
name: Компілятор — нативне тіло оригінального фізичного Core4
on:
  pull_request:
    paths:
      - 'src/wsm.lowerpinnedcore4.pas'
      - 'src/senscore4natyv.lpr'
      - 'scripts/test-lowerpinnedcore4.pas'
      - 'scripts/test-lowerpinnedcore4.sh'
      - '.github/workflows/lower-pinned-core4.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.lowerpinnedcore4.pas'
      - 'src/senscore4natyv.lpr'
      - 'scripts/test-lowerpinnedcore4.pas'
      - 'scripts/test-lowerpinnedcore4.sh'
      - '.github/workflows/lower-pinned-core4.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native-core4-body:
    name: Справжній checked FPC, 12 ELF із фізичного Core4, SENS oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Взяти точний Pascal commit
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal і binutils
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils python3 git
          fpc -iV
      - name: Отримати точний pinned SENS
        run: timeout 180s bash scripts/sync-authority.sh
      - name: Checked FPC, 12 реальних native ELF, pinned Core4 runtime
        run: timeout 480s bash scripts/test-lowerpinnedcore4.sh
      - name: Отримати незалежний pinned SENS CLI
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 2700s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
          test -x sens-oracle/target/debug/sens
      - name: Звірка оригінальних фізичних викликів SENS проти ELF
        env:
          REQUIRE_SENS_ORACLE: '1'
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: timeout 480s bash scripts/test-lowerpinnedcore4.sh
      - name: Межі результату
        run: echo 'ENERGY_NOT_MEASURED — тільки перше справжнє pinned Core4 library body, D24, не Core1 чи загальний compiler'
