# G3.17: реальний фізичний FPC CLI; незалежний від GUI/спільних gate.
name: Фізичний пакет D3 — файлове виконання Free Pascal
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpc-paket-d3:
    name: FPC 3.2.x — реальні байти, атомарність, відмови
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити точну закріплену версію SENS
        run: ./scripts/sync-authority.sh
      - name: Виконати існуючі механічні тести D3-пакета
        run: bash scripts/test-d3batch.sh
      - name: Зібрати й запустити фізичний файловий CLI та негативні тести
        run: bash scripts/test-paketd3-cli.sh
