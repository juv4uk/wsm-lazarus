# Реальний FPC доказ впорядкованого індексу фізичних SENS ключів.
name: точний-індекс-D3
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-key-native:
    name: Точний індекс — Free Pascal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити точно закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити логарифмічний фізичний індекс та негативні випадки
        run: bash ./scripts/test-native-key-index.sh
