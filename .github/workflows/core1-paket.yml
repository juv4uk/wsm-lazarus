# G5.66 — той самий pinned Core1 evaluator для FPC-пакета й LCL оглядача.
name: Core1 — фізичний пакет 64 викликів та Lazarus
on:
  pull_request:
    paths:
      - 'src/senscore1paket.lpr'
      - 'scripts/test-core1-paket.pas'
      - 'scripts/test-core1-paket.sh'
      - '.github/workflows/core1-paket.yml'
      - 'src/wsm.core1first.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/senscore1paket.lpr'
      - 'scripts/test-core1-paket.pas'
      - 'scripts/test-core1-paket.sh'
      - '.github/workflows/core1-paket.yml'
      - 'src/wsm.core1first.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  fizychnyi-core1:
    name: FPC 1/3/64 + незалежний SENS + Lazarus GTK2/Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Завантажити точний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS REPL
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити справжні Free Pascal і Lazarus
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler python3 git lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth
          fpc -iV
          lazbuild --version
      - name: Матеріалізувати pinned SENS Contract 12
        run: timeout 120s bash scripts/sync-authority.sh
      - name: Виконати канонічний Core1-пакет справжнім FPC
        run: timeout 210s bash scripts/test-core1-paket.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 600s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
          test -x sens-oracle/target/debug/sens
      - name: Перевірити перше Core1 замикання незалежним SENS REPL
        run: timeout 200s bash scripts/test-core1-first.sh
      - name: Перевірити справжній Lazarus GTK2/Xvfb на фізичному Core1
        run: timeout 300s bash scripts/test-lcl-core1-ogliad.sh
