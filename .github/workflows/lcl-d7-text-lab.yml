# G1.24. Першоджерело — pinned D7 (128), без третього кодека.
name: Lazarus — безколізійна українська Д7-лабораторія

on:
  pull_request:
    paths:
      - 'gui/d7-text-lab.lpr'
      - 'gui/d7-text-lab.lpi'
      - 'scripts/test-lcl-d7-text-lab.sh'
      - '.github/workflows/lcl-d7-text-lab.yml'
  push:
    branches: [main]
    paths:
      - 'gui/d7-text-lab.lpr'
      - 'gui/d7-text-lab.lpi'
      - 'scripts/test-lcl-d7-text-lab.sh'
      - '.github/workflows/lcl-d7-text-lab.yml'
permissions:
  contents: read
jobs:
  d7-realnyi-lazarus:
    name: FPC + Lazarus GTK2/Xvfb — 95 D7, ук/укр, координати, негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Взяти фізичні вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal та Lazarus GTK2/Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відновити ратифіковану D7 із pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Реальні два FPC кодеки, байтова адреса і візуальний selftest
        run: bash scripts/test-lcl-d7-text-lab.sh
