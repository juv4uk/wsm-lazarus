name: Багаторядковий ввід — реальний FPC

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  bufer-riadkiv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Матеріалізувати зафіксовану версію SENS
        run: ./scripts/sync-authority.sh
      - name: Скомпілювати та виконати механічні регресії вводу
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m0.2/lineinput-growth-units build/m0.2/bin
          fpc -B -Mobjfpc -Cr -Co -Ci -gl \
            -Fu"$PWD/src" -FU"$PWD/build/m0.2/lineinput-growth-units" \
            -FE"$PWD/build/m0.2/bin" -otest-lineinput-growth \
            "$PWD/scripts/test-lineinput.pas"
          ./build/m0.2/bin/test-lineinput-growth
