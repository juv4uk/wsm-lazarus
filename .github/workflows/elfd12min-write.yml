# G6.216: тільки вузький PR-шлях, без Rust/Zig та важких збірок.
name: D12 «найменше» — машинний запис T5M
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12min.pas'
      - 'scripts/test-elfd12min-write.sh'
      - '.github/workflows/elfd12min-write.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-d12-min-write:
    name: FPC 3.2.2 / ELF64 / host write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Завантажити репозиторій без великих підмодулів
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити тільки Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          command -v fpc >/dev/null || timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler git
          test "$(fpc -iV)" = "3.2.2"
      - name: Отримати закріплений фізичний SENS
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s bash scripts/sync-authority.sh
      - name: Зібрати та виконати фізичні позитиви й негативи
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/test-elfd12min-write.sh
          timeout 240s bash scripts/test-elfd12min-write.sh | tee /tmp/d12-min-write.log
          grep -Fq 'Д12-НАЙМЕНШЕ-WRITE-ГАРАЗД positives=2 negatives=4 recovery=2' /tmp/d12-min-write.log
      - name: Зафіксувати межу доказу
        run: echo 'Linux host write protected; SENS oracle=NOT-RUN; energy=NOT-MEASURED'
