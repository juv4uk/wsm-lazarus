# G2.26: проєкції не є семантичним dispatch або виконанням SENS.
name: Free Pascal — шість pinned проєкцій
on:
  pull_request:
    paths:
      - 'src/wsm.projections.pas'
      - 'src/sensproekcii.lpr'
      - 'scripts/test-projections.pas'
      - 'scripts/test-projections.sh'
      - '.github/workflows/pinned-projections.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.projections.pas'
      - 'src/sensproekcii.lpr'
      - 'scripts/test-projections.pas'
      - 'scripts/test-projections.sh'
      - '.github/workflows/pinned-projections.yml'
permissions:
  contents: read
jobs:
  pinned-projections:
    name: Шість поверхонь, точні біти D3/D7/D10, негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Отримати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати CLI та перевірити шість проєкцій
        run: bash ./scripts/test-projections.sh
