# G2.27: host CLI повторно використовує вже злитий G2.26 pinned каталог.
name: Free Pascal — headless перегляд шести проєкцій
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-projections-cli:
    name: Пере-використання G2.26 каталогу, D3/D7/D10 і негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Отримати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати CLI і запустити точні позитиви та негативи
        run: bash ./scripts/test-projections.sh
