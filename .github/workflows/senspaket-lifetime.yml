# G5.14 — фактичне очищення пакетного виконавця у Free Pascal.
name: SENS — звільнення пакетного виконавця після помилки
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paket-bez-vytokiv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відтворити pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити FPC heaptrc багатоформового CLI
        run: bash ./scripts/test-senspaket-lifetime.sh
