# G5.14 — фактичне очищення пакетного виконавця у Free Pascal.
name: SENS — звільнення пакетного виконавця після помилки
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paket-bez-vytokiv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити справжній Free Pascal
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Відтворити pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити FPC heaptrc багатоформового CLI
        run: bash ./scripts/test-senspaket-lifetime.sh
