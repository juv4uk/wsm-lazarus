# G6.150 — близнюки навантаження `evenodd` (C, Rust, FPC) + звірка з оракулом.
name: evenodd · близнюки

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      rust:
        description: 'Збирати Rust (важкий тулчейн; за замовчуванням ні)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  twins:
    name: C, Rust, FPC — одне тіло evenodd
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити інструменти
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler gcc
          fpc -iV; gcc --version | head -1
      - name: Rust — лише за явним запитом
        if: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends rustc
          rustc --version
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Звірити близнюки
        run: bash ./scripts/run-evenodd-twins.sh
