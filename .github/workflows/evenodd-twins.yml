# G6.150 — близнюки навантаження `evenodd` (C, Rust, FPC) + звірка з оракулом.
name: evenodd · близнюки

on:
  pull_request:
    paths:
      - '.github/workflows/evenodd-twins.yml'
      - 'scripts/run-evenodd-twins.sh'
      - 'benchmarks/cross-language/evenodd/**'
  push:
    branches: [main]
    paths:
      - 'scripts/run-evenodd-twins.sh'
      - 'benchmarks/cross-language/evenodd/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twins:
    name: C, Rust, FPC — одне тіло evenodd
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити інструменти
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler gcc rustc
          fpc -iV; gcc --version | head -1; rustc --version
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Звірити близнюки
        run: bash ./scripts/run-evenodd-twins.sh
