# G2.52 — незалежний доказ відповідності фізичних exact D7 імен та укр.
name: Core1 — повні фізичні імена D7
on:
  pull_request:
    paths:
      - 'src/senscore1imena.lpr'
      - 'scripts/test-core1-fizychni-imena.sh'
      - '.github/workflows/core1-fizychni-imena.yml'
  push:
    branches: [main]
    paths:
      - 'src/senscore1imena.lpr'
      - 'scripts/test-core1-fizychni-imena.sh'
      - '.github/workflows/core1-fizychni-imena.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  povni-fizychni-imena:
    name: FPC 3.2 — canonical Core1 T5M, D7 та повна проєкція укр
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати нативну систему
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl git
          fpc -iV
      - name: Синхронізувати pinned SENS Contract 12
        run: ./scripts/sync-authority.sh
      - name: Незалежний контроль 96 фізичних DEFINE та точних D7-ключів
        run: bash ./scripts/test-core1-indeks.sh
      - name: Побудувати повні фізичні імена та звірити з укр
        run: bash ./scripts/test-core1-fizychni-imena.sh
      - name: Зберегти фізичні та людські імена навіть після відмови
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core1-povni-fizychni-imena
          path: build/core1-fiz-imena/*.txt
          if-no-files-found: warn
