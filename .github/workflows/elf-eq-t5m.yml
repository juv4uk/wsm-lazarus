# G6.25 — справжній x86-64 ELF друкує канонічний фізичний T5M.
name: Машинна тотожність D3 — фізичний результат T5M
on:
  pull_request:
    paths:
      - 'src/wsm.elfeqt5m.pas'
      - 'scripts/test-elfeqt5m.pas'
      - 'scripts/test-elfeqt5m.sh'
      - '.github/workflows/elf-eq-t5m.yml'
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute-physical-equality:
    name: FPC → ELF64 → фізичний T5M для 4 D1 пар
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal та перевірку ELF
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler binutils git
          fpc -iV
      - name: Синхронізувати ратифікований pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Скомпілювати та реально виконати ELF
        run: bash ./scripts/test-elfeqt5m.sh
