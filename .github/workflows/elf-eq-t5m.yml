# G6.25 — справжній x86-64 ELF друкує канонічний фізичний T5M.
name: Машинна тотожність D3 — фізичний результат T5M
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute-physical-equality:
    name: FPC → ELF64 → фізичний T5M для 4 D1 пар
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Відновити FPC 3.2.2 зі спільного кешу
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити FPC лише за холодного кешу
        run: timeout 600s bash ./scripts/fpc-restore.sh
      - name: Перевірити FPC 3.2.2 та машинні інструменти
        run: |
          set -euo pipefail
          if ! command -v readelf >/dev/null 2>&1 || ! command -v objdump >/dev/null 2>&1; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends binutils
          fi
          test "$(fpc -iV)" = "3.2.2"
      - name: Синхронізувати ратифікований pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Скомпілювати та реально виконати ELF
        run: bash ./scripts/test-elfeqt5m.sh
