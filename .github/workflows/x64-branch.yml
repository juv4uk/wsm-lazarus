# G6.97 — лише механізм host переходів, жодного нового закону SENS.
name: Компілятор — перевірені переходи x86-64 JZ JMP
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fizychni-perekhody:
    name: Checked FPC → машинний rel32 → 2 ELF64 T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точні джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC та binutils
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s  sudo apt-get install -y --no-install-recommends fp-compiler binutils
          fpc -iV
      - name: Зібрати checked FPC, перевірити golden, негативи і ELF
        run: timeout 600s bash scripts/test-x64branch.sh
      - name: Зафіксувати межу результату
        run: |
          echo 'JZ/JMP rel32: 2 golden, 8 негативів, 2 реальні ELF64 із фізичним T5M виводом.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Механізм host codegen; не готовий загальний compiler чи SENS COND.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Енергію не вимірювали.' >> "$GITHUB_STEP_SUMMARY"
