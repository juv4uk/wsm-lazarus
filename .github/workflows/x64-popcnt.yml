# G6.133: хостова ISA, мовний авторитет — тільки pinned SENS 12.0.
name: Компілятор — POPCNT 32/64, GNU oracle, фізичні ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.x64popcnt.pas'
      - 'scripts/test-x64popcnt.pas'
      - 'scripts/test-x64popcnt.sh'
      - '.github/workflows/x64-popcnt.yml'
      - 'src/wsm.x64code.pas'
      - 'src/wsm.x64alu.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'external/sens'
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-popcnt:
    name: Checked FPC — GNU 512 — 3 PIE ELF64 / T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC та binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils
          fpc -iV
      - name: Перевірити 512 інструкцій, нульовий операнд і реальні ELF64
        run: timeout 600s bash scripts/test-x64popcnt.sh
      - name: Вказати межі доказу
        run: |
          echo '512 байтових GNU as oracle, реальний FPC, 3 ELF64 і packed D1 T5M.' >> "$GITHUB_STEP_SUMMARY"
          echo 'POPCNT — лише host ISA-механізм. Жодного SENS закону або SENS REPL parity, енергію не виміряно.' >> "$GITHUB_STEP_SUMMARY"
