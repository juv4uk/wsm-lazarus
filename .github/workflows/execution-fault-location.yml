# Фізичні три-/байтові позиції для реальних помилок двійкового D3.
name: SENS — фізична адреса помилки виконання
on:
  pull_request:
    paths:
      - '.github/workflows/execution-fault-location.yml'
      - 'src/wsm.execfault.pas'
      - 'src/senspomylka.lpr'
      - 'scripts/test-execfault.pas'
      - 'scripts/test-execfault.sh'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.physloc.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'external/sens'
      - 'refs/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-physical-fault:
    name: Фізичний FPC свідок помилки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Перевірити незмінний pinned авторитет SENS
        run: ./scripts/sync-authority.sh
      - name: Скомпілювати і перевірити виконання та фізичну адресу
        run: bash ./scripts/test-execfault.sh
