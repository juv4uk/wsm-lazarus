# Фізичні три-/байтові позиції для реальних помилок двійкового D3.
name: SENS — фізична адреса помилки виконання
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-physical-fault:
    name: Фізичний FPC свідок помилки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Перевірити незмінний pinned авторитет SENS
        run: ./scripts/sync-authority.sh
      - name: Скомпілювати і перевірити виконання та фізичну адресу
        run: bash ./scripts/test-execfault.sh
