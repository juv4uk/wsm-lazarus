# G6.151 — механічна атестація виконаного native ELF, не оцінка мови.
name: Компілятор — незалежний доказ машинного виконання
on:
  pull_request:
    paths:
      - 'scripts/native-elf-evidence.py'
      - 'scripts/test-native-elf-evidence.py'
      - 'scripts/test-native-elf-evidence.sh'
      - '.github/workflows/native-elf-evidence.yml'
      - 'src/sensmashyna.lpr'
      - 'scripts/test-sensmashyna.pas'
      - 'external/sens'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-native:
    name: FPC 3.2.2, фізичний SENS, 3 машинні ELF64 та негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl git binutils
          fpc -iV
      - name: Матеріалізувати pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Машинне виконання та незалежний механічний доказ
        run: |
          set -euo pipefail
          bash -n scripts/test-native-elf-evidence.sh
          timeout 420s bash scripts/test-native-elf-evidence.sh
      - name: Межа доказу
        run: |
          echo 'Перевірено лише виконання вузьких профілів SENS ELF64.'
          echo 'Немає твердження про повний Core1/Core4, незалежний SENS REPL oracle або джоулі.'
