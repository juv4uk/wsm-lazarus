# Окремий фізичний доказ обмеженого виконання двійкової програми SENS.
name: двійкове-виконання
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary-native-fpc:
    name: Двійковий зріз Free Pascal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити точно закріплене джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Скомпілювати та виконати позитивні й негативні тести
        run: bash ./scripts/test-binaryexec.sh
