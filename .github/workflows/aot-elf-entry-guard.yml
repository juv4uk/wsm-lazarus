# G6.207: один дешевий PR-gate; без Rust/Zig, без енерговимірів.
name: Компілятор — точна точка входу ELF64 для AOT
on:
  pull_request:
    paths:
      - 'scripts/benchmark-kompiliatsiia-aot.py'
      - 'scripts/test-benchmark-kompiliatsiia-aot.sh'
      - '.github/workflows/aot-elf-entry-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-elf-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  elf-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Отримати точний вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Перевірити 22 негативи формату ELF без компіляторів
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/benchmark-kompiliatsiia-aot.py
          bash -n scripts/test-benchmark-kompiliatsiia-aot.sh
          python3 scripts/benchmark-kompiliatsiia-aot.py --самотест \
            | grep -Fx 'АВТ-КОМПІЛЯЦІЯ-САМОТЕСТ-ГАРАЗД негативів=22'

      - name: Встановити лише Free Pascal і необхідні ELF-інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler git binutils
          fpc -iV

      - name: Отримати зафіксований фізичний SENS 12.0
        run: timeout 180s bash scripts/sync-authority.sh

      - name: Реальний FPC build та три виконані фізичні ELF64
        run: timeout 420s bash scripts/test-native-elf-evidence.sh

      - name: Межі доказу
        run: |
          echo 'G6.207: host-guard ELF64 має 22 механічні негативи; реальний FPC створює та виконує три фізичні ELF64.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це не повний AOT-бенчмарк, не незалежний SENS REPL oracle, не доказ енергоефективності й не загальний SENS-компілятор.' >> "$GITHUB_STEP_SUMMARY"
