# G3.29 — числа не стають SENS операціями від GUI.
name: Lazarus — огляд фізичних чисел Д12+
on:
  pull_request:
    paths:
      - '.github/workflows/lcl-chysla.yml'
      - 'gui/sens-chysla-okno.lpr'
      - 'gui/sens-chysla-okno.lpi'
      - 'scripts/test-lcl-chysla.sh'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-chysla:
    name: Реальна числова інспекція GTK2/Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити FPC, Lazarus GTK2 і Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Матеріалізувати точний закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити справжній FPC та Lazarus
        run: bash ./scripts/test-lcl-chysla.sh
