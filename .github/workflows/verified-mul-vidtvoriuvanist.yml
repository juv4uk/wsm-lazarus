# G6.201 — тільки FPC/ELF, PR-only або свідомий ручний запуск.
name: Компілятор · відтворюваність фізичного D5 множення

on:
  pull_request:
    paths:
      - 'scripts/test-verifiedmul-vidtvoriuvanist.pas'
      - 'scripts/test-verifiedmul-vidtvoriuvanist.sh'
      - '.github/workflows/verified-mul-vidtvoriuvanist.yml'
      - 'src/wsm.verifiedmul.pas'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Дві FPC збірки, 8 тотожних ELF, 16 виконань
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Free Pascal
        run: |
          set -euo pipefail
          command -v fpc >/dev/null || { sudo apt-get update; sudo apt-get install -y --no-install-recommends fp-compiler; }
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Повний механічний доказ FPC -O1/-O2 і реальний ELF
        run: timeout 600s bash scripts/test-verifiedmul-vidtvoriuvanist.sh
