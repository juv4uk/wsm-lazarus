# Не робить D10 викличним, лише показує pinned фізичну структуру.
name: Lazarus — фізичне дерево D10
on:
  pull_request:
    paths:
      - 'gui/sens-d10-derevo.lpr'
      - 'gui/sens-d10-derevo.lpi'
      - 'scripts/test-lcl-d10-derevo.sh'
      - '.github/workflows/lcl-d10-derevo.yml'
      - 'src/wsm.binarytree.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.proektsii.pas'
      - 'external/sens'
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-d10:
    name: Реальний FPC і Lazarus GTK2 — фізичний D10
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити FPC, Lazarus/GTK2 та Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth
          fpc -iV
          lazbuild --version
      - name: Матеріалізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та перевірити справжнє вікно
        run: bash scripts/test-lcl-d10-derevo.sh
