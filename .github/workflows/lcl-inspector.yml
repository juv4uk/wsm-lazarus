# Незалежні ворота справжнього Lazarus/LCL, GUI не потрапляє до headless src.
name: Lazarus LCL двійковий інспектор
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lazarus-lcl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal, Lazarus/LCL та Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити ізоляцію headless core
        run: ./scripts/check-no-lcl.sh
      - name: Зібрати Lazarus і перевірити LCL віджети під Xvfb
        run: bash ./scripts/test-lcl-inspector.sh
