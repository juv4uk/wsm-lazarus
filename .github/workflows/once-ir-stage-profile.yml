# G6 #848 — лише PR/manual; цей профіль не прискорює production-компілятор.
name: SENS — сирі нанoseкунди етапів T5M та WideIR
on:
  pull_request:
    paths:
      - 'scripts/test-once-ir-stage-profile.pas'
      - 'scripts/test-once-ir-stage-profile.sh'
      - '.github/workflows/once-ir-stage-profile.yml'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-stages:
    name: Checked FPC, 16 physical programs, 16 executable ELF64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати точний PR SHA
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити тільки FPC і механічні інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler binutils git python3
          fpc -iV
      - name: Перевірити pinned Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Виміряти шість фаз та виконати машинні ELF
        env:
          PROFILE_OUT_DIR: ${{ runner.temp }}/once-ir-stage-profile
        run: |
          set -euo pipefail
          bash -n scripts/test-once-ir-stage-profile.sh
          timeout 600s bash scripts/test-once-ir-stage-profile.sh
      - name: Зберегти сирі наносекунди й межі доказів
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiliuvannia-t5m-wideir-etapy
          path: ${{ runner.temp }}/once-ir-stage-profile/*
          if-no-files-found: warn
          retention-days: 14
      - name: Додати обмежений підсумок
        run: |
          echo '16 фізичних T5M, 6 раундів, 576 етапних сирих CLOCK_MONOTONIC ns, 16 реальних ELF64, 2 негативи.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це профілювання вкладених етапів, НЕ новий speedup першої компіляції.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Незалежний SENS REPL oracle=NOT_RUN; енергія=NOT_MEASURED.' >> "$GITHUB_STEP_SUMMARY"
