# G2.24: byte-exact перевірка pinned доменів без O(n^2) повторів.
name: Швидкий byte-exact допуск доменів
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відтворити тільки pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити повний D10 і точність українських імен
        run: bash ./scripts/test-domain-fast.sh
