# G2.24: byte-exact перевірка pinned доменів без O(n^2) повторів.
name: Швидкий byte-exact допуск доменів
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Відтворити тільки pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити повний D10 і точність українських імен
        run: bash ./scripts/test-domain-fast.sh
