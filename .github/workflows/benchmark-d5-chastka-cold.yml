# G6.170 — легке порівняння C/FPC/нативного SENS без Rust і Zig.
# ЖОДНОГО push: на кожний коміт не витрачаємо CPU на бенчмарки.
name: SENS — холодний D5 ELF64 проти C та Free Pascal
on:
  schedule:
    - cron: '21 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d5-chastka-cold-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити лише швидкі Free Pascal, GCC, Python та binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler gcc python3 binutils git
          fpc -iV
          gcc --version | head -n 1
      - name: Матеріалізувати pinned двійковий SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити синтаксис Bash та незалежний механічний selftest
        run: |
          set -euo pipefail
          bash -n scripts/test-benchmark-d5-chastka-cold.sh
          python3 -m py_compile scripts/benchmark-d5-chastka-cold.py
          python3 scripts/benchmark-d5-chastka-cold.py --selftest
      - name: Три справжні CPU-виконавці, 75 позитивів, 54 негативи, 1500 холодних запусків
        run: timeout 1100s bash scripts/test-benchmark-d5-chastka-cold.sh
      - name: Опублікувати тільки фактичний час та SHA (не енергію)
        uses: actions/upload-artifact@v4
        with:
          name: d5-chastka-cold-physical-times
          path: build/m0.2/d5-chastka-cold/виміри.json
          retention-days: 3
          if-no-files-found: error
