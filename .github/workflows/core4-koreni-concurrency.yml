# G4.37: конкуруючі виконання REAL Core4 та безпечна публікація canonical T5M.
name: Core4 — конкурентні фізичні відповіді

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  konkurrentni-fizychni-vidpovidi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точний коміт без руху pinned SENS
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити справжній FPC 3.2.2
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити pinned контракт та перевірити gitlink
        run: bash ./scripts/sync-authority.sh
      - name: Перевірити реальний Core4 та 32 конкурентні фізичні пакети
        run: bash ./scripts/test-core4-koreni-concurrency.sh
