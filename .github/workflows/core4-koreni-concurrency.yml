# G4.37: конкуруючі виконання REAL Core4 та безпечна публікація canonical T5M.
name: Core4 — конкурентні фізичні відповіді

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  konkurrentni-fizychni-vidpovidi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точний коміт без руху pinned SENS
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній FPC 3.2.2 (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити pinned контракт та перевірити gitlink
        run: bash ./scripts/sync-authority.sh
      - name: Перевірити реальний Core4 та 32 конкурентні фізичні пакети
        run: bash ./scripts/test-core4-koreni-concurrency.sh
