# G4.37: конкуруючі виконання REAL Core4 та безпечна публікація canonical T5M.
name: Core4 — конкурентні фізичні відповіді

on:
  pull_request:
    paths:
      - '.github/workflows/core4-koreni-concurrency.yml'
      - 'scripts/test-core4-koreni-concurrency.sh'
      - 'scripts/test-core4multiroot.sh'
      - 'scripts/test-core4multiroot.pas'
      - 'scripts/test-core4vykon-fixtures.pas'
      - 'src/senscore4koreni.lpr'
      - 'src/wsm.core4multiroot.pas'
      - 'src/wsm.core4runtime.pas'
      - 'scripts/check-pin.sh'
      - 'scripts/sync-authority.sh'
      - 'external/sens'
      - 'refs/**'
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  konkurrentni-fizychni-vidpovidi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точний коміт без руху pinned SENS
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити справжній FPC 3.2.2
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Відновити pinned контракт та перевірити gitlink
        run: bash ./scripts/sync-authority.sh
      - name: Перевірити реальний Core4 та 32 конкурентні фізичні пакети
        run: bash ./scripts/test-core4-koreni-concurrency.sh
