# G6.77 — вузький verified D12→D1 machine predicate, незалежний pinned SENS.
name: SENS — нативний D12 нуль? у справжньому ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12zero.pas'
      - 'src/sensd12zeroelf.lpr'
      - 'scripts/test-elfd12zero.pas'
      - 'scripts/test-elfd12zero.sh'
      - '.github/workflows/elf-d12-zero.yml'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfd12zero.pas'
      - 'src/sensd12zeroelf.lpr'
      - 'scripts/test-elfd12zero.pas'
      - 'scripts/test-elfd12zero.sh'
      - '.github/workflows/elf-d12-zero.yml'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій без випадкового submodule HEAD
        uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Встановити справжній FPC та GNU binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Матеріалізувати pinned Contract 12.0
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Зібрати й запустити машинний D12 нуль? та негативи
        run: timeout 300s bash ./scripts/test-elfd12zero.sh
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC та binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
      - name: Підключити pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати справжній незалежний Rust/Zig SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Побайтово звірити 10 ELF з незалежним pinned SENS
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 300s bash ./scripts/test-elfd12zero.sh
      - name: Відмежувати невиміряні джоулі
        run: echo 'ENERGY_NOT_MEASURED — verified machine instructions, not energy'
