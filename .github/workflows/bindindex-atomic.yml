# G2.18 — механічна транзакційність exact-domain індексу ук.
name: SENS — атомарний індекс української проєкції
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-index:
    name: FPC 3.2.2, D1–D10, негативні таблиці, heaptrc
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Отримати тільки pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити транзакційне доменне зв'язування
        run: bash ./scripts/test-bindindex-atomic.sh
