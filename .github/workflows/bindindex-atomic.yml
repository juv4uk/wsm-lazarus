# G2.18 — механічна транзакційність exact-domain індексу ук.
name: SENS — атомарний індекс української проєкції
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-index:
    name: FPC 3.2.2, D1–D10, негативні таблиці, heaptrc
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Отримати тільки pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити транзакційне доменне зв'язування
        run: bash ./scripts/test-bindindex-atomic.sh
