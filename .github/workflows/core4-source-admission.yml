# G4.3: physical Core4 source admission is a permanent, independent gate.
# This checks pinned source bytes, strict Ukrainian UTF-8 AST, verified
# structural SIR1 and fail-closed negative cases; NOT Core4 execution.
name: core4-source-admission

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core4-source-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Lazarus substrate
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Install Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh

      - name: Materialize exact pinned SENS authority
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/sync-authority.sh

      - name: Compile and execute strict pinned Core4 admission tests
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/test-core4source.sh

      - name: Перевірити нативний командний допуск Core4 (лише структурний SIR1)
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/test-core4-cli.sh
