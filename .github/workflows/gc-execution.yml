# Доказ межової інтеграції з чинним GC, НЕ виконання Core1.
name: Core1 — фізичне виконання і корені наявного GC
on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gc-execution:
    name: Справжній FPC з фізичним D3 та штатним GC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати точний pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Виконати фізичний D3 і перевірити корені/цикли GC
        run: bash ./scripts/test-gcexecution.sh
