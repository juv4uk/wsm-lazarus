# G7.9: ізольований інженерний FPC свідок сортування host WSMIMG1.
name: Приватний образ — точне впорядкування
on:
  pull_request:
    paths:
      - 'src/wsm.image.pas'
      - 'scripts/test-image-growth.pas'
      - 'scripts/test-image-growth.sh'
      - '.github/workflows/image-snapshot-growth.yml'
      - 'src/wsm.envframe.pas'
      - 'src/wsm.domain.pas'
      - 'refs/**'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.image.pas'
      - 'scripts/test-image-growth.pas'
      - 'scripts/test-image-growth.sh'
      - '.github/workflows/image-snapshot-growth.yml'
      - 'src/wsm.envframe.pas'
      - 'src/wsm.domain.pas'
      - 'refs/**'
      - 'external/sens'
permissions:
  contents: read
jobs:
  sortable-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Відновити закріплене джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити канонічний лексичний образ і негативи
        run: bash ./scripts/test-image-growth.sh
