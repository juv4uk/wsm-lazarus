# G7.9: ізольований інженерний FPC свідок сортування host WSMIMG1.
name: Приватний образ — точне впорядкування
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sortable-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Відновити закріплене джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити канонічний лексичний образ і негативи
        run: bash ./scripts/test-image-growth.sh
