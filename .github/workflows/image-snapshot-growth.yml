# G7.9: ізольований інженерний FPC свідок сортування host WSMIMG1.
name: Приватний образ — точне впорядкування
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sortable-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити закріплене джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити канонічний лексичний образ і негативи
        run: bash ./scripts/test-image-growth.sh
