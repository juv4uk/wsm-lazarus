# G3.20: людська укр проєкція допущена тільки до чинного фізичного D3.
name: Українська проєкція — фізичне виконання D3
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpc-ukr-d3:
    name: FPC 3.2.x — справжні D3 форми, точні байти й негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити закріплений SENS Contract 12.0
        run: ./scripts/sync-authority.sh
      - name: Перевірити існуюче фізичне D3 пакетне виконання
        run: bash scripts/test-d3batch.sh
      - name: Виконати FPC CLI українського входу та негативні тести
        run: bash scripts/test-ukr-physical-execution.sh
