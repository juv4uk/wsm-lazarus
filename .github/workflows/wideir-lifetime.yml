# G6.17 — окрема перевірка витоків у двійково-первинному широкому IR.
name: Широке IR — точний життєвий цикл пам’яті
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heaptrc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити реальний Free Pascal 3.2.x
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Синхронізувати рівно pinned SENS
        run: bash ./scripts/sync-authority.sh
      - name: Перевірити heaptrc, атомарність і фізичні слова
        run: bash ./scripts/test-wideir-lifetime.sh
