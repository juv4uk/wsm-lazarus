# G6.17 — окрема перевірка витоків у двійково-первинному широкому IR.
name: Широке IR — точний життєвий цикл пам’яті
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heaptrc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити реальний Free Pascal 3.2.x (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати рівно pinned SENS
        run: bash ./scripts/sync-authority.sh
      - name: Перевірити heaptrc, атомарність і фізичні слова
        run: bash ./scripts/test-wideir-lifetime.sh
