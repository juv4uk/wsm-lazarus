# Окрема коротка FPC перевірка механічних інваріантів перед Lazarus GUI.
name: SENS — суворий сторож широкого IR
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-wide-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точний SHA репозиторію
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Отримати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити фізичне широке IR без зміни законів
        run: bash ./scripts/test-wideirguard.sh
