# Окрема коротка FPC перевірка механічних інваріантів перед Lazarus GUI.
name: SENS — суворий сторож широкого IR
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-wide-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точний SHA репозиторію
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Отримати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити фізичне широке IR без зміни законів
        run: bash ./scripts/test-wideirguard.sh
