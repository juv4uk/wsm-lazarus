# G6 / #47: шлях лише для profile PR proof; перед merge зробити manual-only.
name: SENS — матриця заборонених байтів T5M до ELF64
on:
  # Новий FPC installer не запускається на кожний PR за бюджетом #805.
  # Профільний PR FPC CI уже довів усі 39 негативів на незміненому shell.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invalid-t5m-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати проєкт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити тільки Free Pascal
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler git python3 binutils
          test "$(fpc -iV)" = 3.2.2
      - name: Відновити pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Скомпілювати та виконати 39 фізичних негативів
        run: |
          set -euo pipefail
          bash -n scripts/test-widepotikelf-invalid-bytes.sh
          timeout 240s bash scripts/test-widepotikelf-invalid-bytes.sh | tee /tmp/t5m-invalid.log
          grep -Fq 'T5M-INVALID-OK forbidden_values=13 positions=3 rejects=39' /tmp/t5m-invalid.log
      - name: Межа доказу
        run: echo 'Physical transport fail-closed only; SENS semantic oracle=NOT-CHECKED; measured joules=NOT-AVAILABLE'
