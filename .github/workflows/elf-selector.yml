# G6.19 — окреме справжнє машинне виконання D3:100/011.
name: Машинні селектори D3 — справжній ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.elfselector.pas'
      - 'src/sensvybirelf.lpr'
      - 'scripts/test-elfselector.pas'
      - 'scripts/test-elfselector.sh'
      - '.github/workflows/elf-selector.yml'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vykonannia-selektoriv:
    name: FPC і справжні машинні CAR/CDR на Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal і binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler binutils git
          fpc -iV
          readelf --version | head -n1
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати і виконати машинні селектори
        run: bash ./scripts/test-elfselector.sh
