# G5.56 — LCL не додає законів мови і не замінює фізичний .sens.
name: Lazarus — обмежений довгоживучий сеанс Д3
on:
  pull_request:
    paths:
      - '.github/workflows/lcl-seans-d3.yml'
      - 'gui/sens-seans-d3.lpr'
      - 'gui/sens-seans-d3.lpi'
      - 'scripts/test-lcl-seans-d3.sh'
      - 'src/wsm.session.pas'
      - 'src/wsm.sessiond3.pas'
      - 'src/wsm.nativeeval.pas'
      - 'scripts/test-sessiond3.pas'
      - 'external/sens'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl_seans_d3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal та Lazarus/GTK2/Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Отримати закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати справжні FPC та Lazarus і виконати GUI-тести
        run: bash ./scripts/test-lcl-seans-d3.sh
