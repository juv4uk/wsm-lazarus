name: багатоформове-двійкове-виконання
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-batch:
    name: Реальне багатоформове виконання SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Завантажити зафіксовані закони SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати атомарні пакетні тести
        run: bash ./scripts/test-binarybatch.sh
