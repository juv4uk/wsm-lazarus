name: багатоформове-двійкове-виконання
on:
  pull_request:
    paths:
      - 'src/wsm.binarybatch.pas'
      - 'src/senspaket.lpr'
      - 'scripts/test-binarybatch.pas'
      - 'scripts/test-binarybatch.sh'
      - '.github/workflows/binary-batch.yml'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'external/sens'
      - 'refs/**'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-batch:
    name: Реальне багатоформове виконання SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Завантажити зафіксовані закони SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати атомарні пакетні тести
        run: bash ./scripts/test-binarybatch.sh
