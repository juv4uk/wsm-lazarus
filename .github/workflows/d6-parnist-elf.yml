# G6.85 — pinned D6:010000/010001, D12 signed, machine TEST/SETcc → D1.
name: Компілятор — фізична парність D6 через x86-64 TEST
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine-parity:
    name: FPC + 20 ELF64 + machine SETcc + 20 pinned SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal та ELF інструменти
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Матеріалізувати точний pinned SENS
        run: timeout 180s bash scripts/sync-authority.sh
      - name: FPC build, x86-64 TEST/SETcc, фізичні результати, негативи
        run: timeout 360s bash scripts/test-d6-parnist-elf.sh
      - name: Отримати незалежний SENS Contract 12
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний upstream SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 900s cargo build --locked -p sens-cli --bin sens)
      - name: Перевірити 20 D6 результатів в українському SENS REPL
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 360s bash scripts/test-d6-parnist-elf.sh
      - name: Не заявляти невиміряну енергію
        run: echo 'ENERGY_NOT_MEASURED — machine SETcc не є RAPL-заміром'
