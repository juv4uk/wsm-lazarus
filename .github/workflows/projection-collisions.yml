# G2.30: не semantic oracle, а pinned механічна перевірка.
name: Free Pascal — аудит шести проєкцій SENS
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Pinned D1–D10, D7 та негативні свідки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Отримати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати CLI та перевірити 6 проєкцій і негативи
        run: bash ./scripts/test-kolizii.sh
