name: wideir-rost
on:
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-wideir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Взяти код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          command -v fpc >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fp-compiler git
          }
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: timeout 180s bash scripts/sync-authority.sh
      - name: Перевірити точний WideIR та негативи
        run: timeout 300s bash scripts/test-wideir-rost.sh
