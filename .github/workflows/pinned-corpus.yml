name: "SENS — закріплені свідки Lisp/T5M/D12+"
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "Отримати Git-коміт"
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: "Відновити закріплений SENS без зміни gitlink"
        run: ./scripts/sync-authority.sh
      - name: "Виконати справжні кореневі Lisp/T5M і D12+ свідки"
        run: bash ./scripts/test-pinned-corpus.sh
