name: "SENS — закріплені свідки Lisp/T5M/D12+"
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "Отримати Git-коміт"
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: "Встановити Free Pascal"
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: "Відновити закріплений SENS без зміни gitlink"
        run: ./scripts/sync-authority.sh
      - name: "Виконати справжні кореневі Lisp/T5M і D12+ свідки"
        run: bash ./scripts/test-pinned-corpus.sh
