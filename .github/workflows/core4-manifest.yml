# G4.6: точний механічний опис pinned Core4, без виконання.
name: Core4 — структурний фізичний опис
on:
  pull_request:
    paths:
      - 'src/wsm.core4manifest.pas'
      - 'src/senscore4manifest.lpr'
      - 'scripts/test-core4manifest.sh'
      - '.github/workflows/core4-manifest.yml'
      - 'src/wsm.core4source.pas'
      - 'src/wsm.source.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.core4manifest.pas'
      - 'src/senscore4manifest.lpr'
      - 'scripts/test-core4manifest.sh'
      - '.github/workflows/core4-manifest.yml'
      - 'src/wsm.core4source.pas'
      - 'src/wsm.source.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  core4-manifest:
    name: Зібрати FPC і перевірити фізичні позиції Core4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Реально зібрати й виконати позитивні та негативні перевірки
        run: bash ./scripts/test-core4manifest.sh
