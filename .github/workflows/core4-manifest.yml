# G4.6–G4.7: точний структурний Core4 і атомарні вихідні форми.
name: Core4 — структурний фізичний опис
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-manifest:
    name: Зібрати FPC і перевірити фізичні позиції Core4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Реально зібрати й виконати позитивні та негативні перевірки
        run: |
          bash ./scripts/test-core4manifest.sh
          bash ./scripts/test-core4slice.sh
