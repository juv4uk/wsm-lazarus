name: Core1 — точний маршрут D7 до виконання першого замикання
on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-indexed-closure:
    name: Free Pascal — 96 D7 ключів та фізичне перше замикання
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити FPC (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Реальні інтеграційні FPC тести з перевіркою пам'яті
        run: bash ./scripts/test-core1-dispatch.sh
