# G6.154 — перше повноширинне D24 T5M stdout з скомпільованого тіла.
name: Компілятор — повний D24 із фізичного тіла у T5M stdout
on:
  pull_request:
    paths:
      - 'src/wsm.bodyt5mstdout.pas'
      - 'src/sensbodyfileelf.lpr'
      - 'scripts/test-bodyt5mstdout.sh'
      - '.github/workflows/bodyt5mstdout.yml'
      - 'src/wsm.lowerd24.pas'
      - 'external/sens'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d24-full-t5m:
    name: Checked FPC; дев’ять native ELF64; signed D24; незалежний SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Клонувати Free Pascal код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати pinned SENS Contract12
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Установити FPC 3.2.2 і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Матеріалізувати pinned фізичний SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Скласти незалежний SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Виконати фізичні ELF та порівняти 24-бітний T5M
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-bodyt5mstdout.sh
          timeout 600s bash scripts/test-bodyt5mstdout.sh
      - name: Межа доказу
        run: echo 'D24 exact T5M stdout within existing body subset; no general SENS compiler, GC, image, closure or energy proof'
