# Тільки host x86-64 REX, без нової семантики SENS.
name: Компілятор — шістнадцять x86-64 REX регістрів і фізичний ELF
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-rex:
    name: Checked FPC → 832 GNU as vectors → 2 ELF64 PIE
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати перевірюваний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal та GNU binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler binutils
          fpc -iV
      - name: Зібрати FPC, перевірити REX проти асемблера та виконати ELF
        run: timeout 900s bash scripts/test-x64rex.sh
      - name: Чесна межа доказу
        run: |
          echo '832 машинні кодування, чотири golden, дев’ять негативів, два реально виконані ELF64 PIE.' >> "$GITHUB_STEP_SUMMARY"
          echo 'REX — host ISA; T5M походить із pinned SENS; повний компілятор і джоулі тут не доведені.' >> "$GITHUB_STEP_SUMMARY"
