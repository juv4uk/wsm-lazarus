# G6.158 — ВЕРИФІКАЦІЯ меж RAPL + реального FPC/ELF для `fib`.
# На CI перевіряється САМ ПРОТОКОЛ: що без RAPL скрипт чесно
# відмовляється, а з підставленим лічильником проходить шлях і позначає
# симуляцію. Жодних енергетичних чисел CI не публікує: раннери зазвичай
# не мають RAPL, а їхній час шумний.
name: fib · протокол енергії

on:
  schedule:
    - cron: '48 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: FPC 3.2.2 — протокол енергії (без публікації чисел)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          command -v fpc >/dev/null || timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: timeout 180s bash ./scripts/sync-authority.sh
      - name: Перевірка протоколу енергії
        run: |
          set -euo pipefail
          bash -n scripts/run-fib-energy.sh scripts/test-fib-energy.sh
          timeout 300s bash ./scripts/test-fib-energy.sh
