# G6.199 — фізичне D5:10110 множення через одноразовий WideIR.
# Тільки FPC у нічному/ручному запуску; без Rust, Zig чи push/PR додаткових збірок.
name: Множення · одноразовий перевірений контекст

on:
  schedule:
    - cron: '34 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mul:
    name: D5:10110 — реальний IMUL ELF64, D12/D24, негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Free Pascal
        run: |
          set -euo pipefail
          command -v fpc >/dev/null || { sudo apt-get update; sudo apt-get install -y --no-install-recommends fp-compiler; }
          fpc -iV
      - name: Синхронізувати pinned SENS 12.0
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Зібрати й виконати справжні ELF
        run: timeout 240s bash ./scripts/test-verifiedmul.sh
      - name: Відтворюваність -O1/-O2 і 16 машинних фізичних ELF
        run: timeout 600s bash ./scripts/test-verifiedmul-vidtvoriuvanist.sh
