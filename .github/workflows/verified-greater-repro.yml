# G6: фізичний D5:11011 «більше?» — однакові ELF64 між FPC -O1/-O2.
# Тільки нічний розклад/ручний запуск: бюджет #805 — жодного FPC на PR чи push.
name: Компілятор — відтворюваність D5 «більше?» між FPC O1/O2
on:
  schedule:
    - cron: '11 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  greater-repro:
    name: FPC O1/O2 · 16 однакових ELF64 · 32 виконання
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal і машинні перевіряльники
        run: |
          set -euo pipefail
          command -v fpc >/dev/null || {
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler
          }
          fpc -iV
      - name: Матеріалізувати незмінний pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити shell, зібрати двічі й виконати 32 ELF64
        run: |
          set -euo pipefail
          bash -n scripts/test-verified-greater-repro.sh
          timeout 900s bash scripts/test-verified-greater-repro.sh
