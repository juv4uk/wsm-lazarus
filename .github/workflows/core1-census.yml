name: Core1 · census точних D7-допусків

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати чинний SENS pin
        run: ./scripts/sync-authority.sh
      - name: Звірити точні D7 ключі фізичного Core1 з runtime
        run: timeout 360s bash scripts/test-core1-census.sh
