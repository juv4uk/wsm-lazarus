name: Core1 · census точних D7-допусків

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
      - name: Матеріалізувати чинний SENS pin
        run: ./scripts/sync-authority.sh
      - name: Звірити точні D7 ключі фізичного Core1 з runtime
        run: timeout 360s bash scripts/test-core1-census.sh
