# Core1.2 — перше pinned фізичне замикання; наявний D4 evaluator.
name: SENS — перше фізичне замикання Core1
on:
  pull_request:
    paths:
      - 'src/wsm.core1first.pas'
      - 'scripts/test-core1first.pas'
      - 'scripts/test-core1first.sh'
      - '.github/workflows/core1-first.yml'
      - 'src/wsm.core4runtime.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.core1first.pas'
      - 'scripts/test-core1first.pas'
      - 'scripts/test-core1first.sh'
      - '.github/workflows/core1-first.yml'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  physical-closure:
    name: FPC — завантаження та реальний виклик pinned Core1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Завантажити точний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal і Git
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Синхронізувати канонічний SENS без зміни SHA
        run: timeout 300s ./scripts/sync-authority.sh
      - name: Реально зібрати і виконати перше Core1 замикання
        run: timeout 400s bash scripts/test-core1first.sh
