# Core1.2 — перше pinned фізичне замикання; наявний D4 evaluator.
name: SENS — перше фізичне замикання Core1
on:
  pull_request:
    paths:
      - 'src/wsm.core1first.pas'
      - 'scripts/test-core1first.pas'
      - 'scripts/test-core1first.sh'
      - '.github/workflows/core1-first.yml'
      - 'src/wsm.core4runtime.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.core1first.pas'
      - 'scripts/test-core1first.pas'
      - 'scripts/test-core1first.sh'
      - '.github/workflows/core1-first.yml'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  physical-closure:
    name: FPC — завантаження та реальний виклик pinned Core1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Завантажити точний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Отримати незалежний pinned SENS як окреме джерело істини
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Установити Free Pascal і Git
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Синхронізувати канонічний SENS без зміни SHA
        run: timeout 300s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 900s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Реально зібрати замикання й звірити точні байти з SENS
        env:
          SENS_ORACLE: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 400s bash scripts/test-core1first.sh
