# G1.22 — D7 v2 український клавіатурний текст є даними, не D2.
name: Д7 — український текст у точних фізичних W7
on:
  pull_request:
    paths:
      - 'src/wsm.d7tekst.pas'
      - 'src/sensd7tekst.lpr'
      - 'scripts/test-d7tekst.pas'
      - 'scripts/test-d7tekst.sh'
      - '.github/workflows/d7tekst.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.d7tekst.pas'
      - 'src/sensd7tekst.lpr'
      - 'scripts/test-d7tekst.pas'
      - 'scripts/test-d7tekst.sh'
      - '.github/workflows/d7tekst.yml'
permissions:
  contents: read
jobs:
  physical-ukrainian-d7:
    name: FPC — pinned D7 128 координат, 95 символів, binary T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Матеріалізувати тільки pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати FPC і виконати фізичні та негативні тести
        run: bash ./scripts/test-d7tekst.sh
