# G1.22 — D7 v2 український клавіатурний текст є даними, не D2.
name: Д7 — український текст у точних фізичних W7
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-ukrainian-d7:
    name: FPC — pinned D7 128 координат, 95 символів, binary T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити FPC (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати тільки pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати FPC і виконати фізичні та негативні тести
        run: bash ./scripts/test-d7tekst.sh
