# G6.96 — механічна незалежна звірка host-кодера, не закон SENS.
name: Компілятор — x86-64 ALU проти незалежного GNU assembler
on:
  pull_request:
    paths:
      - 'scripts/test-x64alu-as.pas'
      - 'scripts/test-x64alu-as.sh'
      - '.github/workflows/x64-alu-as.yml'
      - 'src/wsm.x64alu.pas'
      - 'src/wsm.x64code.pas'
      - 'external/sens'
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential-alu:
    name: Checked FPC → 384 машинні opcode → незалежний GNU as
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Взяти перевірюваний commit
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC та GNU binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler binutils
          fpc -iV
      - name: Зібрати перевірений код та звірити усі 384 комбінації
        run: timeout 600s bash scripts/test-x64alu-as.sh
      - name: Межа доказу
        run: |
          echo '384/384 побайтових збіги host ALU з GNU as; 5 негативів.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це не SENS compiler semantic parity; енергію не вимірювали.' >> "$GITHUB_STEP_SUMMARY"
