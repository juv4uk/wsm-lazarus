# G6.151 — дві checked FPC збірки, 18 виконуваних ELF64, pinned oracle.
name: SENS — побайтова відтворюваність фізичного Core1 D24 AOT
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-repro:
    name: Дві реальні FPC збірки, ELF64, незмінність .sens, SENS oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати нативну систему
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати точний незалежний SENS Contract 12
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 2c498b35af53c085450eac6f51b87facf7f9aa47
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal і ELF інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          test "$(fpc -iV)" = 3.2.2
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Скласти незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 2c498b35af53c085450eac6f51b87facf7f9aa47
          (cd sens-oracle && timeout 1800s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Відтворити дев'ять фізичних AOT двома компіляторами
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-bodyfile-vidtvoriuvanist.sh
          timeout 900s bash scripts/test-bodyfile-vidtvoriuvanist.sh
      - name: Зафіксувати межу доказу
        run: echo 'Відтворюваність вузького фізичного Core1/D24 AOT; НЕ повний компілятор; енергія НЕ ВИМІРЯНА'
