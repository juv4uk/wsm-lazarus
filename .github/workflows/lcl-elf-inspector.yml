# LCL — механічний огляд машинного ELF, без нового SENS dispatch.
name: Lazarus — машинний ELF64 з фізичного D1
on:
  pull_request:
    paths:
      - 'gui/elf-inspector.lpr'
      - 'gui/elf-inspector.lpi'
      - 'scripts/test-lcl-elf-inspector.sh'
      - '.github/workflows/lcl-elf-inspector.yml'
      - 'src/wsm.elfd1.pas'
      - 'src/senself.lpr'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.nativeeval.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'gui/elf-inspector.lpr'
      - 'gui/elf-inspector.lpi'
      - 'scripts/test-lcl-elf-inspector.sh'
      - '.github/workflows/lcl-elf-inspector.yml'
      - 'src/wsm.elfd1.pas'
      - 'src/senself.lpr'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.nativeeval.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  lcl-mashynnyi-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити FPC, Lazarus GTK2, Xvfb і перевірку ELF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth binutils git
          fpc -iV
          lazbuild --version
      - name: Отримати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Реальний Lazarus Canvas і машинний ELF64
        run: bash ./scripts/test-lcl-elf-inspector.sh
