name: fpc-headless

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  m0-headless:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout witness
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV

      - name: Materialize pinned authority slice
        run: ./scripts/sync-authority.sh

      - name: Run incremental M0 headless gate
        run: ./scripts/test.sh

      - name: Validate independent UTF-8 D2 G1 lexer with real FPC
        run: |
          fpc -B -Mobjfpc -Fu"$PWD/src" -FU"$PWD/build/m0.2/test-units" \
            -FE"$PWD/build/m0.2/bin" -otest-sourcelex scripts/test-sourcelex.pas
          ./build/m0.2/bin/test-sourcelex
