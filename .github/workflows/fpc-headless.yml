name: fpc-headless

on:
  pull_request:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

# Новий коміт у тій самій PR робить старіший PR-head перевірки неактуальними.
# Нічний schedule та явний workflow_dispatch не скасовуються.
# Це економія FPC/runner CPU, а не вимкнення жодного тестового gate.
concurrency:
  group: fpc-headless-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  m0-headless:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout witness
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV

      - name: Materialize pinned authority slice
        run: ./scripts/sync-authority.sh

      - name: Run incremental M0 headless gate
        run: ./scripts/test.sh

      - name: G1.1 strict Ukrainian source reader (pinned Core4 parse only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m0.2/test-units build/m0.2/bin
          fpc -B -Mobjfpc -Fu"$PWD/src" -FU"$PWD/build/m0.2/test-units" \
            -FE"$PWD/build/m0.2/bin" -otest-source "$PWD/scripts/test-source.pas"
          ./build/m0.2/bin/test-source
      
      - name: G1.3 D2 structural AST over physical T5M (no semantic claims)
        shell: bash
        run: bash ./scripts/test-d2source.sh

      - name: G7.4 private lexical image snapshot (mechanics only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m0.2/test-units build/m0.2/bin
          fpc -B -Mobjfpc -Fu"$PWD/src" -FU"$PWD/build/m0.2/test-units" \
            -FE"$PWD/build/m0.2/bin" -otest-image "$PWD/scripts/test-image.pas"
          ./build/m0.2/bin/test-image

      - name: G1.5 exact physical byte-trit D2 diagnostics (mechanical only)
        shell: bash
        run: bash ./scripts/test-physloc.sh

      - name: G1.6 Обмежений фізичний допуск T5M перед D2
        shell: bash
        run: bash ./scripts/test-t5madmission.sh

      - name: Усі verified-контексти — один прохід, побайтовий ELF
        shell: bash
        run: bash ./scripts/test-verified-all.sh

      - name: D12 «найменше» — точний T5M та відмова Linux write
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/test-elfd12min-write.sh
          timeout 240s bash scripts/test-elfd12min-write.sh | tee /tmp/d12-min-write.log
          grep -Fq 'Д12-НАЙМЕНШЕ-WRITE-ГАРАЗД positives=2 negatives=4 recovery=2' /tmp/d12-min-write.log

      - name: D6 «остача» — фізичний запис D12 та відмови Linux
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/test-irwiderest-write.sh
          timeout 240s bash scripts/test-irwiderest-write.sh | tee /tmp/d6-ostacha-write.log
          grep -Fq 'Д6-ОСТАЧА-WRITE-ГАРАЗД positives=2 negatives=4 recovery=2' /tmp/d6-ostacha-write.log
