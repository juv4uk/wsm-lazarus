name: fpc-headless

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  m0-headless:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout witness
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV

      - name: Materialize pinned authority slice
        run: ./scripts/sync-authority.sh

      - name: Run incremental M0 headless gate
        run: ./scripts/test.sh

      - name: G1.1 strict Ukrainian source reader (pinned Core4 parse only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m0.2/test-units build/m0.2/bin
          fpc -B -Mobjfpc -Fu"$PWD/src" -FU"$PWD/build/m0.2/test-units" \
            -FE"$PWD/build/m0.2/bin" -otest-source "$PWD/scripts/test-source.pas"
          ./build/m0.2/bin/test-source
      
      - name: G1.3 D2 structural AST over physical T5M (no semantic claims)
        shell: bash
        run: bash ./scripts/test-d2source.sh

      - name: G7.4 private lexical image snapshot (mechanics only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m0.2/test-units build/m0.2/bin
          fpc -B -Mobjfpc -Fu"$PWD/src" -FU"$PWD/build/m0.2/test-units" \
            -FE"$PWD/build/m0.2/bin" -otest-image "$PWD/scripts/test-image.pas"
          ./build/m0.2/bin/test-image

      - name: G1.5 exact physical byte-trit D2 diagnostics (mechanical only)
        shell: bash
        run: bash ./scripts/test-physloc.sh
