# G6.204 — одноразове перевірочне CI на PR; вилучити до merge,
# щоб НЕ збільшувати постійний FPC-бюджет та не дублювати nightly.
name: G6.204 · доказ MOVZX та виконання нативного D24 fib
on:
  pull_request:
    paths:
      - '.github/workflows/g6-204-timchasove-fpc-fib.yml'
      - 'src/wsm.elffib.pas'
      - 'scripts/test-elffib.pas'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fib-movzx:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Взяти тестований код PR
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC 3.2.2 за потреби
        run: |
          set -euo pipefail
          command -v fpc >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fp-compiler git
          }
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Checked FPC та 10 справжніх рекурсивних ELF64
        run: timeout 750s bash scripts/test-elffib.sh
