# G6.157 — 100 real x86-64 ELF64 from canonical signed physical D12 multiplication.
name: SENS — знакова матриця 100 нативних D12×D12 ELF64
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити Free Pascal та машинні засоби
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler binutils git
          fpc -iV
      - name: Зібрати та виконати 100 справжніх ELF64, перевірити T5M і 12 відмов
        run: timeout 1100s bash scripts/test-d12-d24-mul-matrytsia.sh
      - name: Жодної заяви про фізичне вимірювання енергії
        run: echo ENERGY_NOT_MEASURED
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler binutils git
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS Rust/Zig oracle
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити 100 фізичних ELF з незалежними українськими SENS oracle
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
          REQUIRE_SENS_ORACLE: '1'
        run: timeout 1100s bash scripts/test-d12-d24-mul-matrytsia.sh
