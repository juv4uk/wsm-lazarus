# G2.31. Двійкова тотожність завжди доменна, D7 — лише текстові дані.
name: Аудит D7 — шість pinned проєкцій і міждоменні омоніми
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanichnyi-audyt:
    name: FPC 3.2.2 — фізичний D7, шість проєкцій, негативні підміни
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Отримати точний закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Справжнє збирання та аудит D7
        run: bash ./scripts/test-audyt-d7.sh
