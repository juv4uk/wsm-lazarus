# G3.16 — атомарний нативний фізичний пакет D3 і справжній Lazarus.
name: Нативний пакет D3 — фізичний T5M і Lazarus

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  fpc-atomarnyi:
    name: FPC 3.2.2 — T5M batch і 0 витоків
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити FPC
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Виконати справжні D3 batch та негативні свідки
        run: bash scripts/test-d3batch.sh

  lazarus-paket:
    name: Lazarus GTK2/Xvfb — 4 форми, фізичні результати й відмови
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити FPC, Lazarus, GTK2, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відновити pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Справжня GUI регресія, native D3 і пакет
        run: bash scripts/test-lcl-exactir-batch.sh
