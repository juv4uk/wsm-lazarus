# G1.49: візуальний фізичний admission сучасного Core1, не семантичний REPL.
name: SENS — фізичний Core1 у Lazarus GTK2
on:
  pull_request:
    paths:
      - 'gui/sens-core1-ogliad.lpr'
      - 'gui/sens-core1-ogliad.lpi'
      - 'scripts/test-lcl-core1-ogliad.sh'
      - '.github/workflows/lcl-core1-ogliad.yml'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.physloc.pas'
      - 'src/senscore1dopus.lpr'
      - 'external/sens'
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-core1:
    name: Фізичний Core1, реальні FPC та Lazarus/Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal та Lazarus GTK2
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Отримати закріплений сучасний SENS
        run: ./scripts/sync-authority.sh
      - name: Реальні збірки, кнопка GUI, фізичні позитиви й негативи
        run: bash ./scripts/test-lcl-core1-ogliad.sh
