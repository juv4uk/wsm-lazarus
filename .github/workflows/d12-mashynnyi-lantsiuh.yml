# G6.77 — два справжні машинні етапи; проміжні дані лише T5M.
name: Компілятор — фізичний D12 конвеєр SUB до ADD
on:
  pull_request:
    paths:
      - 'scripts/test-d12-mashynnyi-lantsiuh.sh'
      - '.github/workflows/d12-mashynnyi-lantsiuh.yml'
      - 'src/sensd12sub-elf.lpr'
      - 'src/sensd12elf.lpr'
      - 'src/senschyslo.lpr'
      - 'src/wsm.elfd12sub.pas'
      - 'src/wsm.elfd12add.pas'
      - 'src/wsm.numericsub.pas'
      - 'src/wsm.numericadd.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'scripts/test-d12-mashynnyi-lantsiuh.sh'
      - '.github/workflows/d12-mashynnyi-lantsiuh.yml'
      - 'src/sensd12sub-elf.lpr'
      - 'src/sensd12elf.lpr'
      - 'src/senschyslo.lpr'
      - 'src/wsm.elfd12sub.pas'
      - 'src/wsm.elfd12add.pas'
      - 'src/wsm.numericsub.pas'
      - 'src/wsm.numericadd.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fizychnyi-lantsiuh:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати FPC-джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити справжній Free Pascal та ELF-інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Матеріалізувати pinned Contract 12.0
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig SENS за точним SHA
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Виконати два машинні етапи, 18 pinned oracle і негативи
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-d12-mashynnyi-lantsiuh.sh
          timeout 600s bash scripts/test-d12-mashynnyi-lantsiuh.sh
      - name: Відокремити енерговимірювання
        run: echo 'ENERGY_NOT_MEASURED — перевірені машинні операції не є показниками джоулів'
