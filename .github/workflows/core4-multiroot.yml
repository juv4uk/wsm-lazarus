# G4.34: новий ізольований перевірюваний Core4 шлях, не загальний SENS compiler.
name: Core4 — складені фізичні корені

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core4-physical-roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний PR commit
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній Free Pascal 3.2.2 (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити pinned SENS з перевіреним gitlink
        run: bash ./scripts/sync-authority.sh
      - name: Зібрати FPC та виконати фізичні позитивні й негативні тести
        run: bash ./scripts/test-core4multiroot.sh
      - name: Зберегти повну попередню регресію Core4 runtime
        run: bash ./scripts/test-core4runtime.sh
