# G4.34: новий ізольований перевірюваний Core4 шлях, не загальний SENS compiler.
name: Core4 — складені фізичні корені

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core4-physical-roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний PR commit
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити справжній Free Pascal 3.2.2
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити pinned SENS з перевіреним gitlink
        run: bash ./scripts/sync-authority.sh
      - name: Зібрати FPC та виконати фізичні позитивні й негативні тести
        run: bash ./scripts/test-core4multiroot.sh
      - name: Зберегти повну попередню регресію Core4 runtime
        run: bash ./scripts/test-core4runtime.sh
