# G6.107 — local CALL/RET, nested real ELF, independent GNU as.
name: Компілятор — вкладені локальні CALL/RET x86-64
on:
  pull_request:
    paths:
      - 'src/wsm.x64call.pas'
      - 'scripts/test-x64call.pas'
      - 'scripts/test-x64call.sh'
      - '.github/workflows/x64-call.yml'
      - 'src/wsm.x64stack.pas'
      - 'src/wsm.x64code.pas'
      - 'external/sens'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-calls:
    name: Checked FPC → GNU as → два вкладені ELF64 CALL/RET
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Отримати точний HEAD і pinned SENS
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal і binutils
        run: |
          set -euo pipefail
          sudo timeout 360s apt-get update
          sudo timeout 360s apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Перевірити FPC, GNU as, точні негативи й виконання ELF
        run: timeout 900s bash scripts/test-x64call.sh
      - name: Зазначити межу доказу
        run: |
          echo 'Host-only machine CALL/RET rel32 та захищений fixup; 13 негативів, два nested ELF64 з фізичним D1/T5M.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це не готовий SENS compiler/ABI, Core4 чи вимірювання енергії.' >> "$GITHUB_STEP_SUMMARY"
