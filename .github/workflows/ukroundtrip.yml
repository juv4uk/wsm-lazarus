# G1.8: фізична точність звичайної української .lisp проєкції.
name: українська-звичайна-lisp-проєкція

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reversible-ukrainian:
    name: Звичайний укр .lisp — точний фізичний round-trip FPC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерело
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити точно закріплені таблиці SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Перевірити звичайний український файл і фізичну оборотність
        shell: bash
        run: bash ./scripts/test-ukroundtrip.sh
