# G1.8: фізична точність звичайної української .lisp проєкції.
name: українська-звичайна-lisp-проєкція

on:
  pull_request:
    paths:
      - '.github/workflows/ukroundtrip.yml'
      - 'src/wsm.ukroundtrip.pas'
      - 'src/sensukrlisp.lpr'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.source.pas'
      - 'src/wsm.bind.pas'
      - 'src/wsm.domain.pas'
      - 'src/wsm.binarybind.pas'
      - 'scripts/test-ukroundtrip.pas'
      - 'scripts/test-ukroundtrip.sh'
      - 'docs/uk-roundtrip-boundary.uk.md'
      - 'external/sens'
      - 'refs/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reversible-ukrainian:
    name: Звичайний укр .lisp — точний фізичний round-trip FPC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерело
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити справжній Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Відновити точно закріплені таблиці SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Перевірити звичайний український файл і фізичну оборотність
        shell: bash
        run: bash ./scripts/test-ukroundtrip.sh
