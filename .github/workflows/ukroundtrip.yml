# G1.8: фізична точність звичайної української .lisp проєкції.
name: українська-звичайна-lisp-проєкція

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reversible-ukrainian:
    name: Звичайний укр .lisp — точний фізичний round-trip FPC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерело
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити справжній Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити точно закріплені таблиці SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Перевірити звичайний український файл і фізичну оборотність
        shell: bash
        run: bash ./scripts/test-ukroundtrip.sh
