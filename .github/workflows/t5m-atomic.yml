name: Атомарний фізичний декодер T5M

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  atomic-t5m:
    name: Фактична перевірка FPC двійкового транспорту
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      # fp-compiler: лишається КЕШОВАНИМ FPC workflow у FPC-BUDGET;
      # позначка запобігає зникненню нічних тестів зі статистики.
      - name: Кеш FPC 3.2.2 (спільний між nightly workflow)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Відновити Free Pascal (теплий кеш без apt, холодний apt)
        run: bash ./scripts/fpc-restore.sh

      - name: Зібрати й запустити старі золоті фізичні вектори
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/t5m-atomic/units build/t5m-atomic/bin
          fpc -B -Mobjfpc -Cr -Co -Ci -gl -Fu"$PWD/src" \
            -FU"$PWD/build/t5m-atomic/units" -FE"$PWD/build/t5m-atomic/bin" \
            -otest-t5m "$PWD/scripts/test-t5m.pas"
          ./build/t5m-atomic/bin/test-t5m

      - name: Перевірити пізню відмову, великий буфер і точні D12+ біти
        shell: bash
        run: |
          set -euo pipefail
          fpc -B -Mobjfpc -Cr -Co -Ci -gl -Fu"$PWD/src" \
            -FU"$PWD/build/t5m-atomic/units" -FE"$PWD/build/t5m-atomic/bin" \
            -otest-t5m-atomic "$PWD/scripts/test-t5m-atomic.pas"
          ./build/t5m-atomic/bin/test-t5m-atomic
