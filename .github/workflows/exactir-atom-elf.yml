# G6.30: один фізичний ExactIR admission, два перевірені D3 backend.
name: Спільний ExactIR — реальний атом і цитата ELF
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atom-i-tsytata:
    name: FPC 3.2.2 — provenance, ATOM і цитата у Linux ELF64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати pinned gitlink
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC і binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler git binutils
          fpc -iV
      - name: Синхронізувати точний SENS Contract 12
        run: ./scripts/sync-authority.sh
      - name: Зібрати FPC та виконати усі фізичні ELF
        run: bash ./scripts/test-exactir-atom-elf.sh
