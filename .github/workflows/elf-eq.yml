# G6.13 — x86-64 Linux ELF з машинним CMP/SETE, не Lisp/host echo.
name: Нативна тотожність D3 — справжній ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.elfeq.pas'
      - 'src/senseqelf.lpr'
      - 'scripts/test-elfeq.pas'
      - 'scripts/test-elfeq.sh'
      - '.github/workflows/elf-eq.yml'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfeq.pas'
      - 'src/senseqelf.lpr'
      - 'scripts/test-elfeq.pas'
      - 'scripts/test-elfeq.sh'
      - '.github/workflows/elf-eq.yml'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  elf-equality-native:
    name: Справжній x86-64 CMP/SETE у машинному D3:101
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal і binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
          readelf --version | head -n1
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Скомпілювати і реально виконати машинний ELF
        run: bash ./scripts/test-elfeq.sh
