# Пакетний перегляд вже ратифікованих числових доменів; не SENS eval.
name: SENS — пакетний фізичний перегляд чисел D12+
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chyslopaket:
    name: Пакетні числові фізичні слова FPC
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Матеріалізувати закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити реальну пакетну проєкцію
        run: bash ./scripts/test-chyslopaket.sh
