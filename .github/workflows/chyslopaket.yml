# Пакетний перегляд вже ратифікованих числових доменів; не SENS eval.
name: SENS — пакетний фізичний перегляд чисел D12+
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chyslopaket:
    name: Пакетні числові фізичні слова FPC
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Матеріалізувати закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити реальну пакетну проєкцію
        run: bash ./scripts/test-chyslopaket.sh
