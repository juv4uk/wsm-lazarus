# G6.93 — нативний рекурсивний fib для енергобенчмарків.
# Один точно допущений фізичний D24 `.sens` стає ELF64 ET_EXEC, який
# обчислює fib(n) рекурсією на СПРАВЖНЬОМУ стеку (межа інтерпретатора
# 32 тут не діє) і завершується через exit(low8).
# Вихід звіряється з незалежним оракулом на 10 значеннях n, включно з 35.
# Це НЕ повний компілятор: тіло fib — host-код навантаження, не
# lowering довільного тіла SENS; жодного енергетичного числа тут не
# публікується без близнюків C/Rust/FPC.
name: fib · нативний рекурсивний ELF

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elffib:
    name: FPC 3.2.2 та pinned SENS — нативний fib
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned SENS
        run: |
          set -euo pipefail
          ./scripts/sync-authority.sh
      - name: Збірка та звірка нативного fib
        run: bash ./scripts/test-elffib.sh
