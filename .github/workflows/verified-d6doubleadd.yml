# G6.210 — D6:001110 «подвійне додавання» через одноразовий
# перевірений контекст (восьма хвиля рою).
# Лише FPC; жодних Rust/Zig/GPU. Обов'язковий sync-authority.sh перед
# будь-якою збіркою — інакше pinned SENS не матеріалізовано.
#
# Тригер — ЛИШЕ workflow_dispatch (і ручний запуск зі сторінки Actions).
# Причина: чинний scripts/check-workflow-fpc-budget.sh тримає жорсткі
# бюджети — pull_request для fp-compiler (лише core1-repl.yml,
# fpc-headless.yml і wide-pipe-stdin-memory.yml) і нічні безумовні
# apt-встановлення. Новий pull_request-тригер або новий нічний apt
# зробили б власну перевірку ЧЕРВОНОЮ, а наявні файли не змінюються.
# Сам PR при цьому все одно проходять реальні core1-repl.yml і
# fpc-headless.yml: вони реагують на зміни .github/workflows/** і src/**.
name: Подвійне додавання · одноразовий контекст

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doubleadd:
    name: D6:001110 — побайтовий ELF, реальне виконання, один контекст
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: FPC
        run: |
          set -euo pipefail
          command -v fpc >/dev/null || { sudo apt-get update; sudo apt-get install -y --no-install-recommends fp-compiler; }
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити
        run: bash ./scripts/test-verifiedd6doubleadd.sh
      - name: Виміряти
        run: ./build/vda-bin/test-verifiedd6doubleadd "$PWD/external/sens" --measure
