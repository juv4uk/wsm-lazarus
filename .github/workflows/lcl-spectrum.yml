# Фізична візуалізація статистики exact-domain, не друга семантика SENS.
name: Lazarus — графік двійкових доменів
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-spektr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Lazarus, Free Pascal, GTK2 і Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Отримати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити ізоляцію від headless core
        run: ./scripts/check-no-lcl.sh
      - name: Зібрати й перевірити реальний Canvas під Xvfb
        run: bash ./scripts/test-lcl-spectrum.sh
