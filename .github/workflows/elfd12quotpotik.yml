# G6.161 — два runtime D12 фізичних аргументи, IDIV, перевірений T5M.
name: SENS — динамічна фізична D5 частка у нативному ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12quotpotik.pas'
      - 'src/sensd12quotpotikelf.lpr'
      - 'scripts/test-elfd12quotpotik.pas'
      - 'scripts/test-elfd12quotpotik.sh'
      - '.github/workflows/elfd12quotpotik.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити реальний Free Pascal і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Матеріалізувати pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити Bash test syntax
        run: bash -n scripts/test-elfd12quotpotik.sh
      - name: Перевірити реальні D12 stdin ELF64, 25 CPU IDIV і відмови
        run: timeout 840s bash scripts/test-elfd12quotpotik.sh
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
      - name: Матеріалізувати pinned Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Побудувати незалежний pinned SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити 25 фізичних D12 часток, знаки та стару D5 AOT
        env:
          SENS_ORACLE_BIN: sens-oracle/target/debug/sens
          REQUIRE_SENS_ORACLE: '1'
        run: |
          set -euo pipefail
          timeout 900s bash scripts/test-elfd12quotpotik.sh
          timeout 900s bash scripts/test-irwidequot.sh
      - name: Позначити відсутність фізичного енерговимірювання
        run: echo ENERGY_NOT_MEASURED
