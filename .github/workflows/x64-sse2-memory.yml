# G6.115 — host-only SSE2 MOVDQU для майбутнього verified WideIR.
name: Компілятор — SSE2 MOVDQU до пам'яті з 3584 GNU еталонами
on:
  pull_request:
    paths:
      - 'src/wsm.x64sse2memory.pas'
      - 'scripts/test-x64sse2memory.pas'
      - 'scripts/test-x64sse2memory.sh'
      - '.github/workflows/x64-sse2-memory.yml'
      - 'src/wsm.x64code.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'external/sens'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-sse2:
    name: FPC checked → 3584 GNU as → 2 виконані SSE2 ELF64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Взяти точний коміт для перевірки
        uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити Free Pascal та GNU binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Зібрати та виконати побайтові й негативні тести MOVDQU
        run: timeout 800s bash scripts/test-x64sse2memory.sh
      - name: Зафіксувати межі машинного доказу
        run: |
          echo 'MOVDQU — лише host ISA; 3584 порівняння проти GNU as, два реальні ELF.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Не допущено жодного SENS callable law; енергія не виміряна.' >> "$GITHUB_STEP_SUMMARY"
