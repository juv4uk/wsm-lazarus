# Окрема GTK2/LCL перевірка справжнього фізичного D3+GC, не SENS закон.
name: Lazarus — фізичний runtime D3 і корені GC
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-gc-lcl:
    name: Lazarus GTK2/Xvfb + справжні D1/D3/GC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal, Lazarus GTK2 та Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Отримати точний pinned SENS
        run: bash scripts/sync-authority.sh
      - name: Запустити FPC і справжній GTK2 віджет
        run: bash scripts/test-lcl-gc-vykon.sh
