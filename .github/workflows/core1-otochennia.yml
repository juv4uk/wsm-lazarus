name: Core1 — незалежність фізичних ключів від локалі та українського шляху
on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-d7-environment:
    name: FPC — фізичні D7 ключі, UTF-8 шлях та відмова
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Зібрати FPC та перевірити фізичну інваріантність
        run: timeout 720s bash ./scripts/test-core1-otochennia.sh
