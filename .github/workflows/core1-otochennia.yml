name: Core1 — незалежність фізичних ключів від локалі та українського шляху
on:
  pull_request:
    paths:
      - 'scripts/test-core1-otochennia.sh'
      - '.github/workflows/core1-otochennia.yml'
      - 'src/senscore1indeks.lpr'
      - 'src/wsm.core1index.pas'
      - 'external/sens'
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-d7-environment:
    name: FPC — фізичні D7 ключі, UTF-8 шлях та відмова
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Зібрати FPC та перевірити фізичну інваріантність
        run: timeout 720s bash ./scripts/test-core1-otochennia.sh
