# #47: один тимчасовий PR proof; після зеленого — тільки manual.
name: SENS — один фізичний прохід спільного WideIR до ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.irwidefront.pas'
      - 'scripts/test-widefront-single-t5m.sh'
      - '.github/workflows/widefront-single-t5m.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpc-shared-wideir:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Отримати проєкт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal та машинні утиліти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler git binutils
          test "$(fpc -iV)" = '3.2.2'
      - name: Матеріалізувати pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити справжній спільний компілятор та ELF64
        run: |
          set -euo pipefail
          bash -n scripts/test-widefront-single-t5m.sh
          timeout 360s bash scripts/test-widefront-single-t5m.sh | tee /tmp/one-t5m.log
          grep -Fq 'WIDEFRONT-ONE-DECODE-OK' /tmp/one-t5m.log
      - name: Межа доказу
        run: echo 'Фізичний machine regression; без нового незалежного oracle чи виміряних джоулів.'
