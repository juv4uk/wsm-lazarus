# G6 — легкий PR-only FPC доказ запуску з каталогу Lazarus IDE.
name: Компілятор — незалежний робочий каталог Lazarus
on:
  schedule:
    - cron: '22 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: FPC, pinned T5M, ELF64 з чужого cwd та негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl git binutils
          fpc -iV
      - name: Матеріалізувати pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити справжні ELF і відмови
        run: |
          set -euo pipefail
          bash -n scripts/test-widefront-ide-cwd.sh
          timeout 480s bash scripts/test-widefront-ide-cwd.sh
      - name: Межа доказу
        run: |
          echo 'Тільки механічна придатність CLI до Lazarus IDE з іншого cwd.'
          echo 'Не доведено семантику довільного SENS, незалежний oracle або енергію.'
