name: Нативний ELF64 — фізичний D1 на Linux x86-64
on:
  pull_request:
    paths:
      - 'src/wsm.elfd1.pas'
      - 'src/senself.lpr'
      - 'scripts/test-elfd1.pas'
      - 'scripts/test-elfd1.sh'
      - '.github/workflows/elf-d1.yml'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natyvnyi-elf64:
    name: Справжнє машинне виконання D1 x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal і перевірку ELF
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils
          fpc -iV
          readelf --version | head -n1
      - name: Завантажити тільки pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Компіляція і фактичне виконання нативного ELF64
        run: bash scripts/test-elfd1.sh
