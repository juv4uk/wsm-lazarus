# Справжній Lazarus/LCL інспектор приватного ExactIR.
# UI не містить законів SENS, а headless src лишається незалежним від LCL.
name: Lazarus — дерево точного двійкового IR
on:
  pull_request:
    paths:
      - 'gui/exactir-inspector.lpr'
      - 'gui/exactir-inspector.lpi'
      - 'scripts/test-lcl-exactir.sh'
      - '.github/workflows/lcl-exactir.yml'
      - 'src/wsm.exactir.pas'
      - 'src/wsm.exactirguard.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.physloc.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.domain.pas'
      - 'src/wsm.bind.pas'
      - 'src/senst5m.lpr'
      - 'external/sens'
      - 'refs/**'
  push:
    branches: [main]
    paths:
      - 'gui/exactir-inspector.lpr'
      - 'gui/exactir-inspector.lpi'
      - 'scripts/test-lcl-exactir.sh'
      - '.github/workflows/lcl-exactir.yml'
      - 'src/wsm.exactir.pas'
      - 'src/wsm.exactirguard.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.physloc.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.domain.pas'
      - 'src/wsm.bind.pas'
      - 'src/senst5m.lpr'
      - 'external/sens'
      - 'refs/**'
permissions:
  contents: read
jobs:
  lcl-exactir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal, Lazarus/LCL і Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Матеріалізувати pinned джерело мовних законів
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Зібрати Lazarus та перевірити справжні віджети під Xvfb
        shell: bash
        run: bash ./scripts/test-lcl-exactir.sh
