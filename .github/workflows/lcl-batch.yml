# Новий ізольований візуальний механізм, без зміни законів або headless core.
name: Lazarus — декілька двійкових програм
on:
  pull_request:
    paths:
      - 'gui/sens-batch.lpr'
      - 'gui/sens-batch.lpi'
      - 'gui/wsm.batchpanel.pas'
      - 'scripts/test-lcl-batch.sh'
      - '.github/workflows/lcl-batch.yml'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.t5m.pas'
      - 'scripts/test-binaryexec.sh'
      - 'external/sens'
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-batch:
    name: Дійсне багатофайлове двійкове виконання
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Lazarus, LCL, FPC та Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Перевірити точний авторитет SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати справжню графічну програму
        run: bash ./scripts/test-lcl-batch.sh
