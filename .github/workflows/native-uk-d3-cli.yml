name: Нативне виконання D3 через українську проєкцію

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  zapusk-d3-uk:
    runs-on: ubuntu-24.04
    steps:
      - name: Отримати джерельний код
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити компілятор Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh

      - name: Отримати зафіксований контракт SENS
        run: ./scripts/sync-authority.sh

      - name: Зібрати й виконати український D3 CLI та негативні тести
        run: bash ./scripts/test-sens-uk-d3.sh
