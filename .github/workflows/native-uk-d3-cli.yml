name: Нативне виконання D3 через українську проєкцію

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  zapusk-d3-uk:
    runs-on: ubuntu-24.04
    steps:
      - name: Отримати джерельний код
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити компілятор Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV

      - name: Отримати зафіксований контракт SENS
        run: ./scripts/sync-authority.sh

      - name: Зібрати й виконати український D3 CLI та негативні тести
        run: bash ./scripts/test-sens-uk-d3.sh
