name: Нативне виконання D3 через українську проєкцію

on:
  pull_request:
    paths:
      - 'src/sens_uk_d3.lpr'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.source.pas'
      - 'src/wsm.bind.pas'
      - 'src/wsm.bindindex.pas'
      - 'src/wsm.domain.pas'
      - 'scripts/test-sens-uk-d3.sh'
      - 'scripts/sync-authority.sh'
      - 'refs/**'
      - 'external/sens'
      - '.github/workflows/native-uk-d3-cli.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  zapusk-d3-uk:
    runs-on: ubuntu-24.04
    steps:
      - name: Отримати джерельний код
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Встановити компілятор Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV

      - name: Отримати зафіксований контракт SENS
        run: ./scripts/sync-authority.sh

      - name: Зібрати й виконати український D3 CLI та негативні тести
        run: bash ./scripts/test-sens-uk-d3.sh
