# Core1.3: real FPC compilation and SENS independent REPL for second definition.
name: Друге сучасне Core1 — фізичне замикання та SENS-оракул
on:
  pull_request:
    paths:
      - 'src/wsm.core1third.pas'
      - 'scripts/test-core1-third.pas'
      - 'scripts/test-core1-third.sh'
      - '.github/workflows/core1-third.yml'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.core1third.pas'
      - 'scripts/test-core1-third.pas'
      - 'scripts/test-core1-third.sh'
      - '.github/workflows/core1-third.yml'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  tretye-zamykannia:
    name: FPC 3.2.2 та pinned SENS — друге Core1 визначення
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати механізм Free Pascal
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний SENS із сучасним Core1
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити перевірений FPC
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git python3
          fpc -iV
      - name: Матеріалізувати pinned authority
        run: ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати справжній незалежний SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Перевірити живий Core1 (друге визначення) на фізичному T5M й оракулі
        run: bash scripts/test-core1-third.sh
