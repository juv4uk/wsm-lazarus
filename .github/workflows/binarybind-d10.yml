name: Точне фізичне доменне зв’язування D10
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-d10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код та pinned-посилання
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Матеріалізувати тільки ратифіковане джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й виконати нові та попередні механічні перевірки
        run: bash ./scripts/test-binarybind-d10.sh
