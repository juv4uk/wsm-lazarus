name: Точне фізичне доменне зв’язування D10
on:
  pull_request:
    paths:
      - 'src/wsm.binarybind.pas'
      - 'scripts/test-binarybind-d10.pas'
      - 'scripts/test-binarybind-d10.sh'
      - '.github/workflows/binarybind-d10.yml'
      - 'external/sens'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-d10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код та pinned-посилання
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Матеріалізувати тільки ратифіковане джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й виконати нові та попередні механічні перевірки
        run: bash ./scripts/test-binarybind-d10.sh
