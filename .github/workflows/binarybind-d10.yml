name: Точне фізичне доменне зв’язування D10
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-d10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код та pinned-посилання
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати тільки ратифіковане джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й виконати нові та попередні механічні перевірки
        run: bash ./scripts/test-binarybind-d10.sh
