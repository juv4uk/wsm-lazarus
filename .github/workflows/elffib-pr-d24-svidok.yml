# G6.199 — незалежний PR-свідок справжнього D24 → рекурсивного ELF64.
# Лише легкий FPC, без Rust/Zig, без push і без нічного дублювання.
name: D24 fib · перевірений нативний ELF64

on:
  pull_request:
    paths:
      - '.github/workflows/elffib-pr-d24-svidok.yml'
      - 'scripts/test-elffib.pas'
      - 'scripts/test-elffib.sh'
      - 'src/wsm.elffib.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d24-fib:
    name: D24 — FPC checked, 10 фізичних ELF64, негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          command -v fpc >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fp-compiler git
          }
          fpc -iV
      - name: Синхронізувати pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Побудувати FPC та виконати ELF64 і негативи
        run: timeout 900s bash scripts/test-elffib.sh
