# G6.103 — єдиний закон у pinned SENS; FPC породжує лише ELF механізм.
name: Компілятор — повна фізична D5 множення через WideIR та IMUL
on:
  pull_request:
    paths:
      - 'src/wsm.irwidemul.pas'
      - 'src/senswidemulelf.lpr'
      - 'scripts/test-irwidemul.pas'
      - 'scripts/test-irwidemul.sh'
      - '.github/workflows/ir-wide-mul.yml'
      - 'src/wsm.elfd12mul.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irwidemul.pas'
      - 'src/senswidemulelf.lpr'
      - 'scripts/test-irwidemul.pas'
      - 'scripts/test-irwidemul.sh'
      - '.github/workflows/ir-wide-mul.yml'
      - 'src/wsm.elfd12mul.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  ir-wide-mul:
    name: Checked FPC → canonical D5 WideIR → ELF64 IMUL → pinned SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Перевірити точний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний SENS oracle
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal 3.2.x та binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: FPC/ELF/T5M/негативи до Rust/Zig
        run: timeout 600s bash scripts/test-irwidemul.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 1200s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
      - name: Незалежний SENS oracle на всіх 12 програмах
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 600s bash scripts/test-irwidemul.sh
      - name: Обмеження доказу
        run: |
          echo '12 канонічних фізичних D5 форм → 12 реальних ELF, 4 D24.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це не загальний компілятор; джоулі/RAPL не виміряні.' >> "$GITHUB_STEP_SUMMARY"
