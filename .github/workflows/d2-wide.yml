# G1.10: optional physical D2 admission, no new numeric or callable laws.
name: Структура широких двійкових слів SENS
on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-wide-d2:
    name: Free Pascal — широкі фізичні D2 форми
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned авторитет SENS
        run: ./scripts/sync-authority.sh
      - name: Компілювати та перевірити вузький і широкий D2
        run: bash ./scripts/test-d2wide.sh
