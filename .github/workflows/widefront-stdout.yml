# G6.128 — тільки фізичний verified WideIR, без змін мовних законів.
name: Компілятор — двійковий ELF64 у stdout
on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-stdout:
    name: Checked FPC → 28 дійсних ELF64 → точні T5M відповіді
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати точний перевірюваний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Довести тотожність PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "ПЕРЕВІРЕНИЙ-HEAD: $(git rev-parse HEAD)"
      # fp-compiler: облік нічного профілю в чинному FPC-BUDGET.
      # Позначка означає наявний компіляторний тест, НЕ безумовний apt.
      - name: Відновити FPC 3.2.2 зі спільного кешу
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити FPC за холодного кешу й перевірити ELF-інструменти
        run: |
          set -euo pipefail
          timeout 600s bash ./scripts/fpc-restore.sh
          if ! command -v readelf >/dev/null 2>&1 || ! command -v objdump >/dev/null 2>&1; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends binutils
          fi
          test "$(fpc -iV)" = "3.2.2"
      - name: Скомпілювати та виконати 28 фізичних програм і негативні тести
        run: timeout 1500s bash scripts/test-widefront-stdout.sh
      - name: Зберегти точну межу доказу
        run: |
          echo "Перевірений коміт: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Фізичний .sens → pinned WideIR → ELF64 у stdout. Byte-for-byte із чинним файловим компілятором, 28 запущених ELF, 28 відмов.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Не нова семантика, не довільний компілятор, не REPL, не замір енергії.' >> "$GITHUB_STEP_SUMMARY"
