# G6 — справжній Lazarus/GTK2 інтерфейс до ВЖЕ ПЕРЕВІРЕНОГО WideIR.
# Не змінює мовний авторитет або компіляторні закони.
name: Lazarus — спільний фізичний WideIR компілятор
on:
  pull_request:
    paths:
      - 'gui/sens-wide-compiler.lpr'
      - 'gui/sens-wide-compiler.lpi'
      - 'scripts/test-lcl-wide-compiler.sh'
      - '.github/workflows/lcl-wide-compiler.yml'
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.wideir.pas'
      - 'src/wsm.wideirguard.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'gui/sens-wide-compiler.lpr'
      - 'gui/sens-wide-compiler.lpi'
      - 'scripts/test-lcl-wide-compiler.sh'
      - '.github/workflows/lcl-wide-compiler.yml'
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.wideir.pas'
      - 'src/wsm.wideirguard.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  lcl:
    name: Справжній GTK2/LCL, два pinned native ELF та регресія 8 профілів
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Точний HEAD
        uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Справжні FPC, Lazarus, GTK2 та Xvfb
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 360s sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth binutils git
          fpc -iV
          lazbuild --version
      - name: Взяти тільки pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Зібрати LCL, відтворити й виконати справжні ELF
        run: timeout 1250s bash scripts/test-lcl-wide-compiler.sh
      - name: Чесна межа виконаної перевірки
        run: |
          echo 'LCL викликає вже перевірений спільний фізичний компілятор WideIR; два точні D5/D6 профілі, ELF64, відмови, відновлення та GUI Canvas.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це не загальний компілятор усіх SENS форм, не REPL, не нова семантика, не замір енергії.' >> "$GITHUB_STEP_SUMMARY"
  oracle:
    name: Незалежний pinned SENS REPL для наявних 8 профілів
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Системний FPC та інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
      - name: Pinned authority
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Незалежно зібрати pinned Rust/Zig SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Незалежний REPL oracle 26/26 і виконувані native ELF
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 1000s bash scripts/test-irwidefront-8.sh
