# Задача #712: справжній IDEIntf пакунок + Xvfb/LCL, не мовний runtime.
name: SENS — українська мапа у Lazarus IDE
on:
  pull_request:
    paths:
      - 'ide/sens_ide_map.lpk'
      - 'ide/sens_ide_register.pas'
      - 'ide/sens_ide_window.pas'
      - 'ide/README.uk.md'
      - 'scripts/test-sens-ide-map.lpr'
      - 'scripts/test-sens-ide-map.lpi'
      - 'scripts/test-sens-ide-map.sh'
      - '.github/workflows/lazarus-sens-ide.yml'
      - 'external/sens'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lazarus-ide:
    name: Справжній IDEIntf lazbuild та Lazarus GTK2/Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Отримати точний Git SHA
        uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Встановити Free Pascal та Lazarus IDE/LCL
        run: |
          set -euo pipefail
          timeout 360s sudo apt-get update
          timeout 360s  sudo apt-get install -y fp-compiler git lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 lazarus-ide-3.0 xvfb xauth
          fpc -iV
          lazbuild --version
      - name: Підключити фізичний pinned SENS Contract 12.0
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Зібрати design-time IDE пакунок та натиснути LCL шлях у Xvfb
        run: timeout 500s bash ./scripts/test-sens-ide-map.sh
      - name: Зафіксувати межу перевірки
        run: |
          echo 'IDEIntf пакет lazbuild та вікно LCL перевірено; інсталяція у реальній IDE окремо не автоматизована.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Немає нового SENS закону, runtime, dispatch або виміряних джоулів.' >> "$GITHUB_STEP_SUMMARY"
