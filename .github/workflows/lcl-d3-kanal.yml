# G5.35: фізичний D3 потік у реальному Lazarus, не другий evaluator.
name: Lazarus — постійний фізичний D3-канал
on:
  pull_request:
    paths:
      - 'gui/d3-kanal.*'
      - 'src/wsm.d3wireclient.pas'
      - 'scripts/test-lcl-d3-kanal.sh'
      - '.github/workflows/lcl-d3-kanal.yml'
      - 'src/senspotikd3.lpr'
      - 'external/sens'
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-d3-kanal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal, Lazarus, GTK2 та Xvfb
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler fp-units-fcl fp-units-base lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відновити ратифікований SENS pin
        run: bash ./scripts/sync-authority.sh
      - name: Реальний фізичний D3-канал та графічний тест
        run: bash ./scripts/test-lcl-d3-kanal.sh
