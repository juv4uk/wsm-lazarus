# G6.66 — конкурентний no-clobber для нативних SENS ELF64.
# SENS задає закон, FPC публікує лише перевірені машинні байти.
name: SENS — конкурентна атомарна публікація ELF64
on:
  pull_request:
    paths:
      - 'scripts/test-elf-paralelna-publikatsiia.sh'
      - '.github/workflows/elf-paralelna-publikatsiia.yml'
      - 'src/wsm.elfpublish.pas'
      - 'src/sensmashyna.lpr'
      - 'src/wsm.bind.pas'
      - 'scripts/test-sensmashyna.pas'
  push:
    branches: [main]
    paths:
      - 'scripts/test-elf-paralelna-publikatsiia.sh'
      - '.github/workflows/elf-paralelna-publikatsiia.yml'
      - 'src/wsm.elfpublish.pas'
      - 'src/sensmashyna.lpr'
      - 'src/wsm.bind.pas'
      - 'scripts/test-sensmashyna.pas'
permissions:
  contents: read
jobs:
  paralelna-publikatsiia:
    name: FPC x86-64 ELF, паралельна гонка, незалежний pinned SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати чинний механізм Free Pascal
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC, binutils та системні засоби
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git binutils coreutils
          fpc -iV
      - name: Відновити точний pinned SENS
        run: timeout 180s bash ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати справжній незалежний SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 1200s bash -c 'cd sens-oracle && cargo build --locked --release -p sens-cli --bin sens'
          test -x sens-oracle/target/release/sens
      - name: Зберегти попередні машинні позитиви і негативи
        run: timeout 300s bash ./scripts/test-sensmashyna.sh
      - name: Виконати 16 паралельних FPC компіляцій і незалежний oracle
        run: timeout 240s bash ./scripts/test-elf-paralelna-publikatsiia.sh
