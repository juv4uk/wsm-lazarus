# G5.64 — справжній Lazarus/LCL GTK2 та фізичний FPC файловий клієнт.
name: Lazarus — фізичні файли одного сеансу
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grafichni-fizychni-faily:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити FPC/FCL і Lazarus/GTK2/Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Завантажити закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й виконати справжню Lazarus-програму
        run: bash scripts/test-lcl-fiz-faily.sh
