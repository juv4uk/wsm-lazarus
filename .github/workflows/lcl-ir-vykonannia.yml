# G6.56: EIR1 — приватний guard перед фізичним D3, а не executable IR.
name: Lazarus — перевірений EIR1 і фізичне виконання
on:
  pull_request:
    paths:
      - 'gui/sens-ir-vykonannia.lpr'
      - 'gui/sens-ir-vykonannia.lpi'
      - 'scripts/test-lcl-ir-vykonannia.sh'
      - '.github/workflows/lcl-ir-vykonannia.yml'
      - 'src/sensirvykon.lpr'
      - 'src/sensexact.lpr'
      - 'src/wsm.exactirwire.pas'
      - 'src/wsm.exactirguard.pas'
      - 'src/wsm.proektsii.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'gui/sens-ir-vykonannia.lpr'
      - 'gui/sens-ir-vykonannia.lpi'
      - 'scripts/test-lcl-ir-vykonannia.sh'
      - '.github/workflows/lcl-ir-vykonannia.yml'
      - 'src/sensirvykon.lpr'
      - 'src/sensexact.lpr'
      - 'src/wsm.exactirwire.pas'
      - 'src/wsm.exactirguard.pas'
      - 'src/wsm.proektsii.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  lcl-eir-guard:
    name: Справжній Free Pascal та Lazarus/GTK2 із фізичним EIR1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal/Lazarus GTK2/Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth
          fpc -iV
          lazbuild --version
      - name: Відновити точний pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати живі натискання з негативами
        run: timeout 600s bash scripts/test-lcl-ir-vykonannia.sh
