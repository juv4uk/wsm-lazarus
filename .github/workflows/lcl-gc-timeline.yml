# Ізольована GUI перевірка фізичної пам’яті; без Core4 або SENS dispatch.
name: Lazarus — візуальна історія GC
on:
  pull_request:
    paths:
      - 'gui/gc-inspector.lpr'
      - 'gui/gc-inspector.lpi'
      - 'gui/wsm.gctimeline.pas'
      - 'src/wsm.gc.pas'
      - 'scripts/test-lcl-gc-timeline.sh'
      - '.github/workflows/lcl-gc-timeline.yml'
      - 'scripts/check-pin.sh'
      - 'scripts/check-no-lcl.sh'
      - 'external/sens'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-physical-gc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити справжній Free Pascal і Lazarus LCL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Перевірити точний pin SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити фізичний GC у справжньому LCL вікні
        run: bash ./scripts/test-lcl-gc-timeline.sh
