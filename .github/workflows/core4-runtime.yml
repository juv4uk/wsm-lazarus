# G4.8: перше реальне виконання визначення з canonical Core4 .sens.
name: core4-runtime

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core4-runtime-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати код Lazarus без неявного руху submodule
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh

      - name: Матеріалізувати точний pinned SENS
        run: ./scripts/sync-authority.sh

      - name: Зібрати й виконати Core4 binary зріз з негативними перевірками
        run: bash ./scripts/test-core4runtime.sh
