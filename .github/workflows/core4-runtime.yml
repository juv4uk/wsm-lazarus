# G4.8: перше реальне виконання визначення з canonical Core4 .sens.
name: core4-runtime

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core4-runtime-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати код Lazarus без неявного руху submodule
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV

      - name: Матеріалізувати точний pinned SENS
        run: ./scripts/sync-authority.sh

      - name: Зібрати й виконати Core4 binary зріз з негативними перевірками
        run: bash ./scripts/test-core4runtime.sh
