name: "Явний фізичний аналіз Д10 — FPC"
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d10-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати фізичний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Відновити точно закріплені закони SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити обидва режими та фізичні негативи
        run: bash ./scripts/test-sensbinary-d10.sh
