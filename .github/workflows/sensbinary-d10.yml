name: "Явний фізичний аналіз Д10 — FPC"
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d10-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати фізичний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити точно закріплені закони SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити обидва режими та фізичні негативи
        run: bash ./scripts/test-sensbinary-d10.sh
