# G6.9 — справжня FPC компіляція й виконання x86-64 ELF64.
name: нативний-ELF-пакет-D1

on:
  pull_request:
    paths:
      - '.github/workflows/elf-batch.yml'
      - 'src/wsm.elfbatch.pas'
      - 'src/senselfpaket.lpr'
      - 'src/wsm.elfd1.pas'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.nativeeval.pas'
      - 'src/senspaket.lpr'
      - 'scripts/test-elfbatch.pas'
      - 'scripts/test-elfbatch.sh'
      - 'scripts/check-pin.sh'
      - 'scripts/sync-authority.sh'
      - 'refs/**'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - '.github/workflows/elf-batch.yml'
      - 'src/wsm.elfbatch.pas'
      - 'src/senselfpaket.lpr'
      - 'src/wsm.elfd1.pas'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.binarybind.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.nativeeval.pas'
      - 'src/senspaket.lpr'
      - 'scripts/test-elfbatch.pas'
      - 'scripts/test-elfbatch.sh'
      - 'scripts/check-pin.sh'
      - 'scripts/sync-authority.sh'
      - 'refs/**'
      - 'external/sens'
permissions:
  contents: read

jobs:
  real-native-batch:
    name: Машинний ELF64 — багато фізичних D1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити FPC та readelf
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
          readelf --version | head -1
      - name: Матеріалізувати точний закріплений SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Породити й фізично виконати один ELF для 1024 D1 форм
        shell: bash
        run: bash ./scripts/test-elfbatch.sh
