name: "Фізичне дерево Д10 — реальний Free Pascal"
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-d10-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити компілятор
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити закріплений SENS Contract 12
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити D10 дерево та попередні режими
        run: bash ./scripts/test-sensbinary-d10-tree.sh
