name: "Фізичне дерево Д10 — реальний Free Pascal"
on:
  pull_request:
    paths:
      - 'src/sensbinary.lpr'
      - 'scripts/test-sensbinary-d10-tree.sh'
      - '.github/workflows/sensbinary-d10-tree.yml'
      - 'external/sens'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-d10-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити компілятор
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Відновити закріплений SENS Contract 12
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити D10 дерево та попередні режими
        run: bash ./scripts/test-sensbinary-d10-tree.sh
