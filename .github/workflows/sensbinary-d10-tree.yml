name: "Фізичне дерево Д10 — реальний Free Pascal"
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-d10-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити компілятор (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Відновити закріплений SENS Contract 12
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити D10 дерево та попередні режими
        run: bash ./scripts/test-sensbinary-d10-tree.sh
