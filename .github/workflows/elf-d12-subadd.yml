# G6.83 — фізичні D12 SUB→ADD у тому самому машинному ELF64.
name: Компілятор — один фізичний ELF64 із SUB і ADD
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12subadd.pas'
      - 'src/sensd12subadd-elf.lpr'
      - 'scripts/test-elfd12subadd.sh'
      - '.github/workflows/elf-d12-subadd.yml'
      - 'src/wsm.elfd12sub.pas'
      - 'src/wsm.elfd12add.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.numericsub.pas'
      - 'src/wsm.numericadd.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfd12subadd.pas'
      - 'src/sensd12subadd-elf.lpr'
      - 'scripts/test-elfd12subadd.sh'
      - '.github/workflows/elf-d12-subadd.yml'
      - 'src/wsm.elfd12sub.pas'
      - 'src/wsm.elfd12add.pas'
      - 'src/wsm.numericplane.pas'
      - 'src/wsm.numericsub.pas'
      - 'src/wsm.numericadd.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mashynnyi-subadd:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати джерела Free Pascal
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити справжній FPC 3.2 та binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Матеріалізувати чинний Contract 12
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний реальний SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Виконати машинні SUB і ADD, перевірити фізичний T5M та 12 оракулів
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-elfd12subadd.sh
          timeout 600s bash scripts/test-elfd12subadd.sh
      - name: Не вдавати виміри фізичної енергії
        run: echo 'ENERGY_NOT_MEASURED — код і T5M перевірені, джоулі ні'
