name: Перевірка ідентичності областей GC

on:
  pull_request:
    paths:
      - 'src/wsm.gc.pas'
      - 'scripts/test-gc.pas'
      - '.github/workflows/gc-token-identity.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  toks-gc:
    runs-on: ubuntu-24.04
    steps:
      - name: Отримати файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити компілятор Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler
          fpc -iV
      - name: Справжній FPC — збірка та позитивні й негативні GC-свідки
        run: timeout 180s bash ./scripts/test-gc.sh
