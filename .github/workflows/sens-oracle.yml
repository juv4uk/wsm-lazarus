# G5.76 — справжній FPC D3 stdin-адаптер; це НЕ незалежний SENS oracle.
name: Pascal D3 — точний багаторядковий stdin
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/sens_oracle.lpr'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.source.pas'
      - 'src/wsm.bindindex.pas'
      - 'scripts/test-sens-oracle.sh'
      - '.github/workflows/sens-oracle.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/sens_oracle.lpr'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.source.pas'
      - 'src/wsm.bindindex.pas'
      - 'scripts/test-sens-oracle.sh'
      - '.github/workflows/sens-oracle.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  stdin-d3:
    name: FPC checked, точні укр-форми, пакети stdin, негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати точні джерела і pinned SENS
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Установити Free Pascal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fp-compiler
          fpc -iV
      - name: Перевірити pinned SENS
        run: ./scripts/check-pin.sh
      - name: Зібрати та виконати обмежений Pascal D3 stdin
        run: timeout 600s bash ./scripts/test-sens-oracle.sh
