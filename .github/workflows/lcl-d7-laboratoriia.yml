# G1.24 — справжній український D7 v2 GUI, без нового мовного закону.
name: Lazarus — фізична українська лабораторія D7
on:
  pull_request:
    paths:
      - 'gui/sens-d7-laboratoriia.*'
      - 'scripts/test-lcl-d7-laboratoriia.sh'
      - '.github/workflows/lcl-d7-laboratoriia.yml'
      - 'src/wsm.d7text.pas'
      - 'src/wsm.t5m.pas'
      - 'scripts/test-d7text.*'
      - 'external/sens'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lcl-d7-laboratoriia:
    name: Справжній FPC та Lazarus GTK2/Xvfb із точними D7 даними
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal, Lazarus GTK2 та Xvfb
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відновити pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати FPC і справжні LCL віджети; виконати негативні тести
        run: bash ./scripts/test-lcl-d7-laboratoriia.sh
