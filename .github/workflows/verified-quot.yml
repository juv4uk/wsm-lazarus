# G6.201 — один verified WideIR для pinned D5:10111 без повторного decode.
# Лише нічний/ручний FPC, не встановлювати компілятор на кожен PR/push.
name: Частка · один перевірений контекст
on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quot:
    name: D5:10111 — x86-64 CQO/IDIV, фізичні D12, негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Free Pascal
        run: |
          set -euo pipefail
          command -v fpc >/dev/null || { sudo apt-get update; sudo apt-get install -y --no-install-recommends fp-compiler; }
          fpc -iV
      - name: Pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Реальні ELF64 та негативи
        run: bash scripts/test-verifiedquot.sh
