# G6.120 — повна фізична D5:01010 → pinned WideIR → реальний x64 spill.
name: Компілятор — фізичний D5 WideIR зі стековим spill ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.irwidespilladd.pas'
      - 'src/senswidespilladdelf.lpr'
      - 'scripts/test-irwidespilladd.pas'
      - 'scripts/test-irwidespilladd.sh'
      - '.github/workflows/ir-wide-spill-add.yml'
      - 'src/wsm.irwiderexadd.pas'
      - 'src/wsm.x64spill.pas'
      - 'src/wsm.x64stack.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irwidespilladd.pas'
      - 'src/senswidespilladdelf.lpr'
      - 'scripts/test-irwidespilladd.pas'
      - 'scripts/test-irwidespilladd.sh'
      - '.github/workflows/ir-wide-spill-add.yml'
      - 'src/wsm.irwiderexadd.pas'
      - 'src/wsm.x64spill.pas'
      - 'src/wsm.x64stack.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  ir-wide-spill-add:
    name: Checked FPC → pinned WideIR → spill ELF → GNU as → SENS oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати exact перевірюваний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати pinned незалежний SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC 3.2.2 та GNU binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Довести реальний ELF64 з переповненим регістровим пулом
        run: timeout 700s bash scripts/test-irwidespilladd.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 1200s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
      - name: Довести дев’ять відповідей незалежним pinned SENS
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 700s bash scripts/test-irwidespilladd.sh
      - name: Обмеження доказу
        run: |
          echo '9 фізичних D5 → pinned WideIR → R8..R15 + spill → виконуваний ELF64; GNU as 9 прологів, 15 відмов, oracle=9.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Не повний IR register allocator; не вимірювалися RAPL чи джоулі.' >> "$GITHUB_STEP_SUMMARY"
