# G6.90 — фізична вкладена програма D6:001110 → один real ELF з 2 ADD.
name: Компілятор — вкладене D6 додавання двічі в одному ELF
on:
  pull_request:
    paths:
      - 'src/wsm.ird6doubleadd.pas'
      - 'src/sensd6doubleaddelf.lpr'
      - 'scripts/test-ird6doubleadd.pas'
      - 'scripts/test-ird6doubleadd.sh'
      - '.github/workflows/ir-d6-double-add.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.ird6doubleadd.pas'
      - 'src/sensd6doubleaddelf.lpr'
      - 'scripts/test-ird6doubleadd.pas'
      - 'scripts/test-ird6doubleadd.sh'
      - '.github/workflows/ir-d6-double-add.yml'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-d6-add:
    name: Вкладене фізичне D6 додавання
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати FPC джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC та машинні інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Матеріалізувати Contract 12.0
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Реальні FPC та вкладена фізична машинна програма
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-ird6doubleadd.sh
          timeout 600s bash scripts/test-ird6doubleadd.sh
      - name: Енергію не виміряно
        run: echo 'ENERGY_NOT_MEASURED; verification of correct nested native code only'
