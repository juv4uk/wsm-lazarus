# Core1.5 — фізичні D7-імена всіх DEFINE проти pinned укр-проєкції.
name: Core1 · повні фізичні D7-імена

on:
  pull_request:
    paths:
      - 'src/senscore1imena.lpr'
      - 'scripts/test-core1-imena.sh'
      - '.github/workflows/core1-imena.yml'
      - 'external/sens'
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fizychni-imena:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та перевірити 96 фізичних D7-імен
        run: bash ./scripts/test-core1-imena.sh
