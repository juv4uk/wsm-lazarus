# Core1.5 — фізичні D7-імена всіх DEFINE проти pinned укр-проєкції.
name: Core1 · повні фізичні D7-імена

on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fizychni-imena:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та перевірити 96 фізичних D7-імен
        run: bash ./scripts/test-core1-imena.sh
