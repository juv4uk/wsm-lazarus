# Core1.5 — фізичні D7-імена всіх DEFINE проти pinned укр-проєкції.
name: Core1 · повні фізичні D7-імена

on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fizychni-imena:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та перевірити 96 фізичних D7-імен
        run: bash ./scripts/test-core1-imena.sh
