# G6.151 — pinned фізичний WideIR stdin → ELF64 stdout, справжній FPC.
name: SENS — фізичний WideIR потік з виконанням ELF64
on:
  pull_request:
    paths:
      - 'src/senswidepotikelf.lpr'
      - 'scripts/test-widepotikelf.sh'
      - '.github/workflows/wide-pipe-compiler.yml'
      - 'src/wsm.irwidefront.pas'
      - 'external/sens'
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Встановити Free Pascal та ELF інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler binutils git python3
          fpc -iV
      - name: Завантажити точний pinned Contract 12.0
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Скомпілювати та виконати 16 фізичних ELF64 і 20 негативів
        run: timeout 750s bash ./scripts/test-widepotikelf.sh
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler binutils git python3
      - name: Синхронізувати pinned джерела SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити результати 16 ELF із незалежним SENS REPL
        env:
          REQUIRE_SENS_ORACLE: '1'
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 750s bash ./scripts/test-widepotikelf.sh
      - name: Енергію не вимірювали
        run: echo 'ENERGY_NOT_MEASURED'
