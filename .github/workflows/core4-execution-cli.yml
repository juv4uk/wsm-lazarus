# G4.10: окремий native CLI лише над уже підтриманим двійковим Core4.
name: core4-execution-cli

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core4-cli-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний Git commit без руху submodule
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal 3.2.2
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV

      - name: Відновити pinned SENS 12.0 з точним набором
        run: bash ./scripts/sync-authority.sh

      - name: Справжній FPC build, двійкові виклики Core4 і негативні тести
        run: bash ./scripts/test-core4vykon.sh
