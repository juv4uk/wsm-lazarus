# G4.10: окремий native CLI лише над уже підтриманим двійковим Core4.
name: core4-execution-cli

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core4-cli-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний Git commit без руху submodule
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal 3.2.2 (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh

      - name: Відновити pinned SENS 12.0 з точним набором
        run: bash ./scripts/sync-authority.sh

      - name: Справжній FPC build, двійкові виклики Core4 і негативні тести
        run: bash ./scripts/test-core4vykon.sh
