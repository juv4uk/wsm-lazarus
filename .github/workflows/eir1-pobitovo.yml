# G6.50: справжній FPC на фізичному pinned .sens;
# приватний EIR1 не є мовою або виконуваним компілятором.
name: Побітова цілісність приватного EIR1

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  pobitovo:
    name: Free Pascal — усі одно-бітові підробки EIR1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати pinned SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Перевірити існуючі та побітові негативи
        shell: bash
        run: bash ./scripts/test-eir1-pobitovo.sh
