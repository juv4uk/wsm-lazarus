# G6.50: справжній FPC на фізичному pinned .sens;
# приватний EIR1 не є мовою або виконуваним компілятором.
name: Побітова цілісність приватного EIR1

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  pobitovo:
    name: Free Pascal — усі одно-бітові підробки EIR1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Матеріалізувати pinned SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Перевірити існуючі та побітові негативи
        shell: bash
        run: bash ./scripts/test-eir1-pobitovo.sh
