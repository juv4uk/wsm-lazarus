# G6.50: справжній FPC на фізичному pinned .sens;
# приватний EIR1 не є мовою або виконуваним компілятором.
name: Побітова цілісність приватного EIR1

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  pobitovo:
    name: Free Pascal — усі одно-бітові підробки EIR1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Матеріалізувати pinned SENS
        shell: bash
        run: ./scripts/sync-authority.sh
      - name: Перевірити існуючі та побітові негативи
        shell: bash
        run: bash ./scripts/test-eir1-pobitovo.sh
