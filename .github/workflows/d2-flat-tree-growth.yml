name: Фізичне дерево D2 — похідні пари та Lazarus

on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  fizychne-derevo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати і випробувати фізичне дерево та відсутність витоків
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-pin.sh
          mkdir -p build/m0.2/d2-tree-growth-units build/m0.2/bin
          fpc -B -Mobjfpc -Cr -Co -Ci -gl -gh \
            -Fu"$PWD/src" -FU"$PWD/build/m0.2/d2-tree-growth-units" \
            -FE"$PWD/build/m0.2/bin" -otest-d2-flat-tree \
            "$PWD/scripts/test-binarytree.pas"
          ./build/m0.2/bin/test-d2-flat-tree 2>&1 | tee build/m0.2/d2-tree-growth.log
          grep -q 'ДВІЙКОВЕ-ДЕРЕВО-ГЛИБИНА-ГАРАЗД' build/m0.2/d2-tree-growth.log
          grep -q 'ДВІЙКОВЕ-ДЕРЕВО-ГАРАЗД' build/m0.2/d2-tree-growth.log
          grep -q '0 unfreed memory blocks' build/m0.2/d2-tree-growth.log
          if grep -E '[1-9][0-9]* unfreed memory blocks' build/m0.2/d2-tree-growth.log; then
            echo 'Незвільнені фізичні вузли D2' >&2
            exit 1
          fi

  vizualnyi-lazarus:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити FPC і справжній Lazarus GTK2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Матеріалізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити справжні LCL віджети інспектора
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-no-lcl.sh
          timeout 180s bash ./scripts/test-lcl-inspector.sh
