name: точне-двійкове-ir

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpc-proof:
    name: Зібрати й перевірити двійкове структурне IR
    runs-on: ubuntu-24.04
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Завантажити зафіксоване джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити точний IR і негативні випадки
        run: bash scripts/test-exactir.sh
