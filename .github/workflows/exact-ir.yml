name: точне-двійкове-ir

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fpc-proof:
    name: Зібрати й перевірити двійкове структурне IR
    runs-on: ubuntu-24.04
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Завантажити зафіксоване джерело SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити точний IR і негативні випадки
        run: bash scripts/test-exactir.sh
