name: sessionwire-host-mechanism

on:
  pull_request:
    paths:
      - 'src/wsm.sessionwire.pas'
      - 'scripts/test-sessionwire.pas'
      - 'scripts/test-sessionwire.sh'
      - 'src/wsm.session.pas'
      - 'src/wsm.sessiond3.pas'
      - 'src/wsm.nativeeval.pas'
      - 'scripts/test-sessiond3.pas'
      - 'src/wsm.source.pas'
      - 'src/wsm.envframe.pas'
      - 'src/wsm.domain.pas'
      - '.github/workflows/sessionwire.yml'
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  byte-ingress-mechanism:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Free Pascal 3.2.x
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler
          fpc -iV
      - name: Завантажити точний закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Фізичні перевірки пакування і виконання D3 у сеансі
        run: bash scripts/test-sessionwire.sh
