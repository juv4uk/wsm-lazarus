name: sessionwire-host-mechanism

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  byte-ingress-mechanism:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install Free Pascal 3.2.x
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler
          fpc -iV
      - name: Завантажити точний закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Фізичні перевірки пакування і виконання D3 у сеансі
        run: bash scripts/test-sessionwire.sh
