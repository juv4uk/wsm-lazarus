# G6.160: усі фізичні кадри — самостійні canonical T5M програми.
name: Компілятор — багатокадровий фізичний WideIR у ELF64

on:
  pull_request:
    paths:
      - 'src/senswidekadrovyelf.lpr'
      - 'scripts/test-widekadrovyelf.py'
      - 'scripts/test-widekadrovyelf.sh'
      - '.github/workflows/wide-kadrovy-elf.yml'
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kadrovy-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати точний коміт компілятора
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Отримати незалежний pinned SENS oracle
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false

      - name: Встановити FPC та машинні інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          command -v fpc >/dev/null || timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler fp-units-fcl binutils git python3
          fpc -iV

      - name: Матеріалізувати точний pinned authority
        run: |
          set -euo pipefail
          timeout 240s bash scripts/sync-authority.sh
          test "$(git -C external/sens rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788

      - name: Перевірити FPC, 16 ELF, 12 відмов і відновлення
        run: |
          set -euo pipefail
          bash -n scripts/test-widekadrovyelf.sh
          python3 -m py_compile scripts/test-widekadrovyelf.py
          timeout 600s bash scripts/test-widekadrovyelf.sh

      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig

      - name: Зібрати незалежний SENS CLI pinned SHA
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens

      - name: Вимагати незалежні 16 SENS oracle відповідей
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          timeout 900s bash scripts/test-widekadrovyelf.sh

      - name: Уточнити межі доказу
        run: |
          echo 'G6.160: 16 canonical фізичних .sens програм, 16 ELF64 PIE з exact T5M stdout, 12 негативів, байтова тотожність з одиночним WideIR і 16 незалежних pinned SENS oracle результатів.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це host LE32-кадрування пакета й компілятор, а НЕ новий SENS домен, загальний Core1/Core4 чи готовий runtime. Апаратну енергію тут не вимірювали.' >> "$GITHUB_STEP_SUMMARY"
