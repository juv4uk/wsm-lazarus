# Числова ширина D12+ — тільки фізичні слова T5M, без арифметики.
name: Широкі слова D12+ — фізичні координати
on:
  pull_request:
    paths:
      - 'src/wsm.widespan.pas'
      - 'src/sensshyryna.lpr'
      - 'scripts/test-widespan.pas'
      - 'scripts/test-widespan.sh'
      - '.github/workflows/widespan.yml'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.physloc.pas'
      - 'src/wsm.d2source.pas'
      - 'src/senst5m.lpr'
      - 'external/sens'
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widereader:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Отримати вихідні файли
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler
          fpc -iV
      - name: Завантажити закріплені мовні джерела SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити фізичні D12+ свідчення
        run: bash ./scripts/test-widespan.sh
