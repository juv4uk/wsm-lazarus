name: "Двійкові голови — FPC діагностика"
on:
  pull_request:
    paths:
      - "src/sensholovy.lpr"
      - "src/wsm.binaryheads.pas"
      - "src/wsm.binarytree.pas"
      - "src/wsm.binarybind.pas"
      - "src/wsm.ukroundtrip.pas"
      - "src/wsm.t5m.pas"
      - "scripts/test-sensholovy.sh"
      - ".github/workflows/sensholovy.yml"
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holovy:
    runs-on: ubuntu-24.04
    steps:
      - name: "Отримати код"
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: "Установити справжній Free Pascal"
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: "Підготувати закріплені закони SENS"
        run: ./scripts/sync-authority.sh
      - name: "Перевірити двійкові голови й український вивід"
        run: bash ./scripts/test-sensholovy.sh
