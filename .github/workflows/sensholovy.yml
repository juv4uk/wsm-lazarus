name: "Двійкові голови — FPC діагностика"
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holovy:
    runs-on: ubuntu-24.04
    steps:
      - name: "Отримати код"
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити справжній Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: "Підготувати закріплені закони SENS"
        run: ./scripts/sync-authority.sh
      - name: "Перевірити двійкові голови й український вивід"
        run: bash ./scripts/test-sensholovy.sh
