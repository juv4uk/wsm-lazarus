# Фізичний компаратор двох канонічних .sens, не семантика SENS.
name: Два .sens — точна фізична різниця FPC і Lazarus
on:
  pull_request:
    paths:
      - 'src/wsm.t5mdiff.pas'
      - 'src/sensriznytsia.lpr'
      - 'gui/sens-riznytsia.lpr'
      - 'gui/sens-riznytsia.lpi'
      - 'scripts/test-t5mdiff.pas'
      - 'scripts/test-t5mdiff.sh'
      - '.github/workflows/t5m-diff.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.t5mdiff.pas'
      - 'src/sensriznytsia.lpr'
      - 'gui/sens-riznytsia.lpr'
      - 'gui/sens-riznytsia.lpi'
      - 'scripts/test-t5mdiff.pas'
      - 'scripts/test-t5mdiff.sh'
      - '.github/workflows/t5m-diff.yml'
permissions:
  contents: read
jobs:
  real-fpc-lazarus:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal, Lazarus та віртуальний дисплей
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Запустити фізичні позитиви, негативи та LCL
        run: bash ./scripts/test-t5mdiff.sh
