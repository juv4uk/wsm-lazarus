# G6.75 — D12 signed CMP/SETL; фізичний D1 та незалежний pinned SENS.
name: SENS — машинне D12 порівняння менше через x86-64 ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12less.pas'
      - 'src/sensd12mensheelf.lpr'
      - 'scripts/test-elfd12menshe-fixtures.pas'
      - 'scripts/test-elfd12menshe.sh'
      - '.github/workflows/elf-d12-menshe.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfd12less.pas'
      - 'src/sensd12mensheelf.lpr'
      - 'scripts/test-elfd12menshe-fixtures.pas'
      - 'scripts/test-elfd12menshe.sh'
      - '.github/workflows/elf-d12-menshe.yml'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tochnyi-mashynnyi-predykat:
    name: FPC checked, 14 ELF64, 14 pinned SENS REPL, 8 негативів
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Справжній FPC та машинний дизасемблер
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Перевірити pinned authority
        run: timeout 180s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2700s cargo build --locked --release -p sens-cli --bin sens)
          test -x sens-oracle/target/release/sens
      - name: Зібрати FPC, виконати CMP/SETL ELF та незалежні негативи
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/release/sens
        run: timeout 900s bash scripts/test-elfd12menshe.sh
