name: SENS — фізичні синтаксичні голови D2 та D10
on:
  pull_request:
    paths:
      - 'src/sensbinary.lpr'
      - 'src/wsm.binarytree.pas'
      - 'src/wsm.binaryheads.pas'
      - 'src/wsm.proektsii.pas'
      - 'scripts/test-sensbinary-heads.sh'
      - '.github/workflows/sensbinary-heads.yml'
      - 'external/sens'
      - 'refs/**'
  push:
    branches: [main]
    paths:
      - 'src/sensbinary.lpr'
      - 'src/wsm.binarytree.pas'
      - 'src/wsm.binaryheads.pas'
      - 'src/wsm.proektsii.pas'
      - 'scripts/test-sensbinary-heads.sh'
      - '.github/workflows/sensbinary-heads.yml'
      - 'external/sens'
      - 'refs/**'
permissions:
  contents: read
jobs:
  fizychni-holovy:
    name: Реальний Free Pascal, D2/D10 та негативні свідки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Матеріалізувати pinned закони SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити фізичні голови D2/D10
        run: bash ./scripts/test-sensbinary-heads.sh
