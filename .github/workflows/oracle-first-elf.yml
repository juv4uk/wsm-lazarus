# G6.147 — SENS сам підтверджує викличність до будь-якого FPC ELF64.
name: Компілятор — незалежний мовний допуск перед нативним ELF64
on:
  pull_request:
    paths:
      - 'scripts/sens-oracle-first-elf.sh'
      - 'scripts/test-oracle-first-elf.pas'
      - 'scripts/test-oracle-first-elf.sh'
      - '.github/workflows/oracle-first-elf.yml'
      - 'src/senswidefrontelf.lpr'
      - 'src/wsm.irwidefront.pas'
      - 'external/sens'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle_first:
    name: pinned SENS → checked FPC → 34 ELF64 → 2 no-callables
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Перевірити точний Git SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Перевірити Bash синтаксис перед дорогою збіркою oracle
        run: |
          set -euo pipefail
          bash -n scripts/sens-oracle-first-elf.sh
          bash -n scripts/test-oracle-first-elf.sh
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal та ELF інструменти
        run: |
          set -euo pipefail
          timeout 360s sudo apt-get update
          timeout 360s  sudo apt-get install -y --no-install-recommends fp-compiler binutils git python3
          fpc -iV
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати pinned незалежний SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Перевірити 34 викличні D5, два заборонені D6 та no-clobber
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 1200s bash scripts/test-oracle-first-elf.sh
      - name: Зберегти чесну межу доказу
        run: |
          echo 'Це host oracle-first профіль для перевірки права виконати фізичну .sens форму; власного SENS закону чи evaluator немає.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Генерує ELF існуючий компілятор; незалежний SENS CLI потрібен у момент збірки, але не потрібен виконуваному ELF. Результат 34 позитивів D5, 2 семантичні D6 відмови.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це НЕ загальний компілятор, REPL, Core1/Core4 чи енергетичний вимір. Джоулі НЕ вимірювалися.' >> "$GITHUB_STEP_SUMMARY"
