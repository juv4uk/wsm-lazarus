# G8.4 — справжній Lazarus IDEIntf/LCL інспектор фізичного WideIR.
name: Lazarus IDE — дерево перевіреного фізичного WideIR
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ide-wideir-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Отримати точно перевірювані джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Перевірити ощадливий PR/manual CI до інсталяції Lazarus
        run: python3 scripts/test-sens-ide-ir-trigger.py
      - name: Установити FPC, Lazarus IDEIntf/GTK2 та Xvfb
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth binutils git
          fpc -iV
          lazbuild --version
      - name: Отримати pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Виконати реальну IDEIntf/LCL форму, native ELF і негативи
        run: |
          set -euo pipefail
          bash -n scripts/test-sens-ide-compile.sh
          timeout 1600s bash scripts/test-sens-ide-compile.sh
      - name: Межі доказу
        run: echo 'Фізичне read-only WideIR дерево перевіреного compiler slice; не загальний SENS compiler/IDE debugger, без виміру енергії'
