# G6.73: нативний ЦИКЛ НАВАНТАЖЕННЯ з точного фізичного D12.
# Один допущений D12 `.sens` стає машинним циклом x86-64; код виходу
# звіряється з незалежним оракулом (ланцюжок AddNumericPhysical).
# Це не повний компілятор і не енергетичний бенчмарк.
name: Компілятор · нативний цикл D12

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    name: FPC 3.2.2 — реальний запуск циклу D12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      # fp-compiler: лишається КЕШОВАНИМ FPC workflow у FPC-BUDGET;
      # позначка запобігає зникненню нічних тестів зі статистики.
      - name: Кеш FPC 3.2.2 (спільний між nightly workflow)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Відновити Free Pascal (теплий кеш без apt, холодний apt)
        run: bash ./scripts/fpc-restore.sh
      - name: Нативний цикл і звірка з оракулом
        run: bash ./scripts/test-d12loop.sh
