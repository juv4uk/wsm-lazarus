name: Core1 — фізичний індекс точних D7 визначень
on:
  pull_request:
    paths:
      - 'src/wsm.core1index.pas'
      - 'src/senscore1indeks.lpr'
      - 'scripts/test-core1-indeks.sh'
      - '.github/workflows/core1-indeks.yml'
      - 'external/sens'
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core1-d7-index:
    name: FPC — 96 pinned Core1 визначень за exact D7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити FPC
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Перевірити pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Побудувати та перевірити фізичний Core1 індекс
        run: bash ./scripts/test-core1-indeks.sh
