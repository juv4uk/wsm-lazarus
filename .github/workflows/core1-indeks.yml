name: Core1 — фізичний індекс точних D7 визначень
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core1-d7-index:
    name: FPC — 96 pinned Core1 визначень за exact D7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити FPC (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Перевірити pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Побудувати та перевірити фізичний Core1 індекс
        run: bash ./scripts/test-core1-indeks.sh
