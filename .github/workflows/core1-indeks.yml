name: Core1 — фізичний індекс точних D7 визначень
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core1-d7-index:
    name: FPC — 96 pinned Core1 визначень за exact D7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити FPC
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Перевірити pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Побудувати та перевірити фізичний Core1 індекс
        run: bash ./scripts/test-core1-indeks.sh
