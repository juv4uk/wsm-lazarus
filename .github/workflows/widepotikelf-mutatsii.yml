# G6.179: легкий FPC-only мутаційний CI; жодного push/schedule/Rust/Zig.
name: Компілятор — фізичні мутації T5M і цілісний ELF64
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fizychni-mutatsii:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати точний GitHub SHA
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Використати встановлений FPC або встановити мінімальний компілятор
        run: |
          set -euo pipefail
          if ! command -v fpc >/dev/null; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler
          fi
          fpc -iV
          command -v readelf
          command -v python3
      - name: Завантажити лише pinned SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Перевірити синтаксис тестової механіки
        run: |
          bash -n scripts/test-widepotikelf-mutatsii.sh
          python3 -m py_compile scripts/test-widepotikelf-mutatsii.py
      - name: Checked FPC, 16 фізичних виконань ELF64 і 259 мутацій
        run: timeout 480s bash scripts/test-widepotikelf-mutatsii.sh
      - name: Зафіксувати межі виконаного доказу
        run: |
          echo 'G6.179: реальна FPC компіляція, 16 позитивних фізичних ELF64, 259 deterministic mutation cases, recoverable fail-closed і native execution для прийнятих.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це структурно-машинний invariant, не незалежний семантичний SENS REPL oracle; RAPL/джоулі не виміряні.' >> "$GITHUB_STEP_SUMMARY"
