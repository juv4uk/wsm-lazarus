# G3.11: тільки механічний host lexical-frame, не нові SENS закони.
name: Лексичні середовища — точний індекс FPC

on:
  pull_request:
    paths:
      - 'src/wsm.envframe.pas'
      - 'scripts/test-envframe.pas'
      - 'scripts/test-envframe-index.sh'
      - '.github/workflows/envframe-index.yml'
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tochni-kliuchi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal 3.2.x
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати та перевірити точний лексичний індекс
        run: bash ./scripts/test-envframe-index.sh
