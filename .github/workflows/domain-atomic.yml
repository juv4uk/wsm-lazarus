# G2.21 — атомарне завантаження фізичних pinned доменних проєкцій.
name: Точні доменні таблиці — атомарний допуск
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal 3.2.2 (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Отримати точно закріплені джерела SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити атомарні D1–D10 і негативи
        run: bash ./scripts/test-domain-atomic.sh
