# G3.45: real native Core1 execution using existing wsm.gc.
name: Перший Core1 — GC-керований фізичний результат
on:
  pull_request:
    paths:
      - 'src/wsm.core1gcresult.pas'
      - 'scripts/test-core1-gcresult.pas'
      - 'scripts/test-core1-gcresult.sh'
      - '.github/workflows/core1-gcresult.yml'
      - 'src/wsm.core1first.pas'
      - 'src/wsm.gcclosure.pas'
      - 'src/wsm.gc.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.core1gcresult.pas'
      - 'scripts/test-core1-gcresult.pas'
      - 'scripts/test-core1-gcresult.sh'
      - '.github/workflows/core1-gcresult.yml'
      - 'src/wsm.core1first.pas'
      - 'src/wsm.gcclosure.pas'
      - 'src/wsm.gc.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  result-root:
    name: FPC 3.2.2 · фізичний Core1 · GC · upstream SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати вихідний код Free Pascal/Lazarus
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити компілятор FPC і Python
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git python3
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний виконавець SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Виконати фізичний Core1, GC та SENS-оракул
        run: bash scripts/test-core1-gcresult.sh
