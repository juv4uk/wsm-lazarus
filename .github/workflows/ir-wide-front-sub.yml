# G6.115: сьомий exact фізичний профіль у спільному WideIR компіляторі.
name: Компілятор — сім фізичних профілів WideIR і справжній D5 SUB
on:
  pull_request:
    paths:
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.irwidesub.pas'
      - 'scripts/test-irwidefront-sub.pas'
      - 'scripts/test-irwidefront-sub.sh'
      - '.github/workflows/ir-wide-front-sub.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.irwidesub.pas'
      - 'scripts/test-irwidefront-sub.pas'
      - 'scripts/test-irwidefront-sub.sh'
      - '.github/workflows/ir-wide-front-sub.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  seven-profiles:
    name: Checked FPC → 12 SUB ELF → 6 старих профілів → pinned SENS oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати точний PR-head
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS 12.0
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC 3.2.x, binutils і git
        run: |
          set -euo pipefail
          timeout 360s sudo apt-get update
          timeout 360s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Фізичні ELF64 SUB, 24 негативи й регресія 6 профілів
        run: timeout 1200s bash scripts/test-irwidefront-sub.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS CLI точного pinned коміту
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 1800s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
      - name: Повторити ELF і всі українські форми проти SENS oracle
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 1200s bash scripts/test-irwidefront-sub.sh
      - name: Межа перевіреного результату
        run: |
          echo '7 exact-width pinned machine profiles; 12 SUB + 21 ADD/MUL + 16 старих форм.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Реальний x86-64 ELF64, 4 D24, 18 механічних і 6 CLI негативів; незалежний SENS oracle.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Це не загальний compiler/Core1/GC, джоулі та RAPL не виміряні.' >> "$GITHUB_STEP_SUMMARY"
