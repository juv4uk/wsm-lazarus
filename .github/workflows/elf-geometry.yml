# G6.33 — спільна незалежна геометрія фізичного машинного ELF64.
name: Нативний ELF64 — структурний допуск і негативні свідки
on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mashynna-heometriia:
    name: FPC 3.2.2 — ELF64 геометрія, 36 підмін, Linux T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC і binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler git binutils
          fpc -iV
      - name: Синхронізувати ратифікований pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити геометрію та виконати справжні ELF
        run: bash ./scripts/test-elfgeometry.sh
