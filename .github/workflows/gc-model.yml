name: Нативний SENS — модельна безпека GC перед Core1

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  gc-model:
    name: Справжній FPC — 9600 модельних операцій GC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          timeout 240s sudo apt-get update
          command -v fpc >/dev/null || timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Синхронізувати pinned SENS 12.0
        run: timeout 240s ./scripts/sync-authority.sh
      - name: Зібрати FPC і порівняти GC з незалежною моделлю
        run: timeout 240s bash ./scripts/test-gc-model.sh
