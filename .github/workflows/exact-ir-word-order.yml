# G6.24: міжвузловий порядок фізичних слів у приватному IR.
name: ExactIR — порядок фізичних T5M слів

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tochnyi-poryadok:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити справжній Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити pinned SENS
        run: ./scripts/sync-authority.sh
      - name: FPC та heaptrc — exact фізичні координати IR
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-pin.sh
          mkdir -p build/m0.2/exactir-order-units build/m0.2/bin
          fpc -B -Mobjfpc -gh -Cr -Co -Ci -gl \
            -Fu"$PWD/src" \
            -FU"$PWD/build/m0.2/exactir-order-units" \
            -FE"$PWD/build/m0.2/bin" -otest-exactir-order \
            "$PWD/scripts/test-exactirguard.pas"
          ./build/m0.2/bin/test-exactir-order 2>&1 | tee build/m0.2/exactir-order-heap.log
          grep -q 'ТОЧНЕ-IR-СТОРОЖ-ГАРАЗД' build/m0.2/exactir-order-heap.log
          grep -q '0 unfreed memory blocks' build/m0.2/exactir-order-heap.log
          if grep -E '[1-9][0-9]* unfreed memory blocks' build/m0.2/exactir-order-heap.log; then
            echo 'Витік пам\x27яті під час перевірки IR' >&2
            exit 1
          fi
