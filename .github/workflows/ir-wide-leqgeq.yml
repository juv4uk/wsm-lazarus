# G6.156 — виклична D4:0100(D5:11010/11011) до справжніх x86-64 SETLE/SETGE.
name: Компілятор — D4/D5 композиція до SETLE/SETGE з незалежним оракулом
on:
  pull_request:
    paths:
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.irwideleqgeq.pas'
      - 'scripts/test-irwideleqgeq.pas'
      - 'scripts/test-irwideleqgeq.sh'
      - '.github/workflows/ir-wide-leqgeq.yml'
      - 'external/sens'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Отримати робочий SENS Lazarus
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS Contract 12.0
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Установити FPC та інструменти машини
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Матеріалізувати pinned доменні закони
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig REPL SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Справжні машинні ELF64 та негативи
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-irwideleqgeq.sh
          timeout 900s bash scripts/test-irwideleqgeq.sh
      - name: Межа доказу
        run: |
          echo 'Вузька виклична композиція D4:0100(D5:11010/11011), signed D12, T5M D1. D6 LEQ/GEQ залишаються невикличними. Це не загальний Core1/Core4.'
          echo 'Джоулі та загальна енергоефективність не вимірювалися.'
