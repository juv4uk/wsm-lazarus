# G3.50 — фізичні координати відхилених Core1 D7-голів, не мовний закон.
name: Core1 — фізична адреса відмови D7
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-head:
    name: FPC — exact D7-голова та фізичні адреси
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити FPC 3.2 (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати точне pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Реальний runtime, відмови, фізична геометрія та регресія
        run: bash scripts/test-core1-head-spans.sh
