# G3.50 — фізичні координати відхилених Core1 D7-голів, не мовний закон.
name: Core1 — фізична адреса відмови D7
on:
  pull_request:
    paths:
      - 'src/wsm.core1dispatch.pas'
      - 'scripts/test-core1-head-spans.pas'
      - 'scripts/test-core1-head-spans.sh'
      - '.github/workflows/core1-head-spans.yml'
      - 'src/wsm.physloc.pas'
      - 'external/sens'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-head:
    name: FPC — exact D7-голова та фізичні адреси
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC 3.2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Матеріалізувати точне pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Реальний runtime, відмови, фізична геометрія та регресія
        run: bash scripts/test-core1-head-spans.sh
