# Справжня Lazarus/LCL тотожність D1/D7 — незалежна фізична звірка SENS.
name: Lazarus — виконана фізична тотожність D7
on:
  pull_request:
    paths:
      - 'gui/sens-d7-totozhnist.lpr'
      - 'gui/sens-d7-totozhnist.lpi'
      - 'scripts/test-lcl-d7-totozhnist.sh'
      - '.github/workflows/lcl-d7-totozhnist.yml'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.proektsii.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'gui/sens-d7-totozhnist.lpr'
      - 'gui/sens-d7-totozhnist.lpi'
      - 'scripts/test-lcl-d7-totozhnist.sh'
      - '.github/workflows/lcl-d7-totozhnist.yml'
      - 'src/wsm.nativeeval.pas'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.proektsii.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  d7-lcl-execution:
    name: Реальний Lazarus GTK2 і pinned SENS — двійкова D7 тотожність
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати код нативної системи Lazarus
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний SENS 12.0
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Установити FPC, Lazarus GTK2, Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відновити pinned SENS і його шість проєкцій
        run: ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS Rust/Zig
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Зібрати Lazarus і перевірити фізичну D7 тотожність
        run: bash scripts/test-lcl-d7-totozhnist.sh
