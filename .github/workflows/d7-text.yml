# G1.22 — pinned D7 v2 → UTF-8 українська ук/укр ↔ точний T5M.
name: Д7 — українська двійкова проєкція без колізій
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-physical-d7:
    name: FPC — 128 D7 координат, 190 проєкцій, T5M і негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити FPC 3.2.2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Перевірити реальний UTF-8 ↔ D7 ↔ T5M та CLI
        run: bash ./scripts/test-d7text.sh
