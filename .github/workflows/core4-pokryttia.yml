# G4.43/G4.46: структурний укр та повний фізичний T5M/D2 перепис pinned Core4.
name: Core4 — повний фізичний перепис і завантаження
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pokryttia:
    name: Справжній FPC, усі фізичні D2 корені та негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Відновити точний pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити структуру та реальне Core4 виконання
        run: bash ./scripts/test-core4-pokryttia.sh
  lazarus-core4:
    name: Справжній Lazarus GTK2/Xvfb над фізичним Core4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal та Lazarus
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відновити pinned SENS
        run: bash ./scripts/sync-authority.sh
      - name: Реально зібрати й перевірити Core4 у LCL
        run: bash ./scripts/test-lcl-core4-koreni.sh
