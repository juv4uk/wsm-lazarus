# G4.43: лише структурний перепис pinned Core4 і РЕАЛЬНО завантажені bindings.
name: Core4 — доказовий перепис завантажених визначень
on:
  pull_request:
    paths:
      - 'src/senscore4pokryttia.lpr'
      - 'scripts/test-core4-pokryttia.sh'
      - '.github/workflows/core4-pokryttia.yml'
      - 'src/wsm.core4runtime.pas'
      - 'src/wsm.core4manifest.pas'
      - 'src/wsm.core4source.pas'
      - 'src/wsm.source.pas'
      - 'external/sens'
      - 'refs/**'
  push:
    branches: [main]
    paths:
      - 'src/senscore4pokryttia.lpr'
      - 'scripts/test-core4-pokryttia.sh'
      - '.github/workflows/core4-pokryttia.yml'
      - 'src/wsm.core4runtime.pas'
      - 'src/wsm.core4manifest.pas'
      - 'src/wsm.core4source.pas'
      - 'src/wsm.source.pas'
      - 'external/sens'
      - 'refs/**'
permissions:
  contents: read
jobs:
  pokryttia:
    name: Справжній FPC, фізичний Core4, негативний перепис
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Відновити точний pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити структуру та реальне Core4 виконання
        run: bash ./scripts/test-core4-pokryttia.sh
