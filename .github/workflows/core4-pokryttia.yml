# G4.43/G4.46: структурний укр та повний фізичний T5M/D2 перепис pinned Core4.
name: Core4 — повний фізичний перепис і завантаження
on:
  pull_request:
    paths:
      - 'src/senscore4pokryttia.lpr'
      - 'scripts/test-core4-pokryttia.sh'
      - '.github/workflows/core4-pokryttia.yml'
      - 'src/wsm.core4runtime.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.core4manifest.pas'
      - 'src/wsm.core4source.pas'
      - 'src/wsm.source.pas'
      - 'external/sens'
      - 'refs/**'
  push:
    branches: [main]
    paths:
      - 'src/senscore4pokryttia.lpr'
      - 'scripts/test-core4-pokryttia.sh'
      - '.github/workflows/core4-pokryttia.yml'
      - 'src/wsm.core4runtime.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'src/wsm.core4manifest.pas'
      - 'src/wsm.core4source.pas'
      - 'src/wsm.source.pas'
      - 'external/sens'
      - 'refs/**'
permissions:
  contents: read
jobs:
  pokryttia:
    name: Справжній FPC, усі фізичні D2 корені та негативи
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Відновити точний pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити структуру та реальне Core4 виконання
        run: bash ./scripts/test-core4-pokryttia.sh
