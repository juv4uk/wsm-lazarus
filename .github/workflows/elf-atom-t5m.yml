# G6.27 — реальний Linux x86-64 D3:010 → один канонічний T5M байт.
name: Машинний атом D3 — фізичний результат T5M
on:
  pull_request:
    paths:
      - 'src/wsm.elfatomt5m.pas'
      - 'scripts/test-elfatomt5m.pas'
      - 'scripts/test-elfatomt5m.sh'
      - '.github/workflows/elf-atom-t5m.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfatomt5m.pas'
      - 'scripts/test-elfatomt5m.pas'
      - 'scripts/test-elfatomt5m.sh'
      - '.github/workflows/elf-atom-t5m.yml'
permissions:
  contents: read
jobs:
  machine-atom-t5m:
    name: FPC → 10 ELF64 D3:010 → фізичний T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal і binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Синхронізувати pinned мовні джерела SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати FPC та виконати 10 справжніх Linux ELF
        run: bash ./scripts/test-elfatomt5m.sh
