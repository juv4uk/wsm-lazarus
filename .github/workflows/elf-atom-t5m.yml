# G6.27 — реальний Linux x86-64 D3:010 → один канонічний T5M байт.
name: Машинний атом D3 — фізичний результат T5M
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine-atom-t5m:
    name: FPC → 10 ELF64 D3:010 → фізичний T5M
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрати точний код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      # fp-compiler: обліковується чинним FPC-BUDGET як кешований nightly,
      # а не як зниклий тест після заміни безумовного apt-get.
      - name: Відновити FPC 3.2.2 зі спільного кешу
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити FPC лише за холодного кешу
        run: timeout 600s bash ./scripts/fpc-restore.sh
      - name: Перевірити FPC 3.2.2 та машинні інструменти
        run: |
          set -euo pipefail
          if ! command -v readelf >/dev/null 2>&1 || ! command -v objdump >/dev/null 2>&1; then
            timeout 240s sudo apt-get update
            timeout 240s sudo apt-get install -y --no-install-recommends binutils
          fi
          test "$(fpc -iV)" = "3.2.2"
      - name: Синхронізувати pinned мовні джерела SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати FPC та виконати 10 справжніх Linux ELF
        run: bash ./scripts/test-elfatomt5m.sh
