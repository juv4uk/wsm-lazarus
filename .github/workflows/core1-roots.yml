# Core1.2 — уже наявний GC + лексичні кадри, без нового SENS закону.
name: Core1 — GC-корені лексичних замикань
on:
  pull_request:
    paths:
      - 'src/wsm.core1roots.pas'
      - 'scripts/test-core1-roots.pas'
      - 'scripts/test-core1-roots.sh'
      - '.github/workflows/core1-roots.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.core1roots.pas'
      - 'scripts/test-core1-roots.pas'
      - 'scripts/test-core1-roots.sh'
      - '.github/workflows/core1-roots.yml'
permissions:
  contents: read
jobs:
  lexical-gc:
    name: Справжній FPC GC і Lazarus GTK2/Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Завантажити точний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити FPC та Lazarus
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git python3 lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth
          fpc -iV
          lazbuild --version
      - name: Відновити закріплений SENS
        run: timeout 120s bash ./scripts/sync-authority.sh
      - name: Перевірити лексичні корені реальним FPC
        run: timeout 270s bash ./scripts/test-core1-roots.sh
      - name: Перевірити наявний справжній Lazarus GC інспектор
        run: timeout 240s bash ./scripts/test-lcl-gc-timeline.sh
