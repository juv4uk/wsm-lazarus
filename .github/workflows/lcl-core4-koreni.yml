# G4.35 — реальний GTK2/LCL огляд СКЛАДЕНИХ результатів pinned Core4.
name: Lazarus — справжні складені фізичні корені Core4
on:
  pull_request:
    paths:
      - 'gui/core4-koreni-okno.lpr'
      - 'gui/core4-koreni-okno.lpi'
      - 'scripts/test-lcl-core4-koreni.sh'
      - '.github/workflows/lcl-core4-koreni.yml'
      - 'src/wsm.core4multiroot.pas'
      - 'src/wsm.core4runtime.pas'
      - 'scripts/test-core4multiroot.pas'
      - 'external/sens'
      - 'refs/**'
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  koreni:
    name: Реальний FPC і Lazarus GTK2/Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати джерела
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal та Lazarus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fp-compiler lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git
          fpc -iV
          lazbuild --version
      - name: Відновити pinned SENS
        run: bash ./scripts/sync-authority.sh
      - name: Перевірити реальний Core4 й LCL
        run: bash ./scripts/test-lcl-core4-koreni.sh
