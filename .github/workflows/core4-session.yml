# G5.16: незалежний FPC доказ постійного виконуваного Core4-сеансу.
name: core4-session
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-session-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати нативні джерела без руху pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Встановити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Матеріалізувати точний SENS authority
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати постійний Core4-сеанс з негативними тестами
        run: bash ./scripts/test-core4session.sh
