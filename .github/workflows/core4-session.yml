# G5.16: незалежний FPC доказ постійного виконуваного Core4-сеансу.
name: core4-session
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-session-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати нативні джерела без руху pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          fpc -iV
      - name: Матеріалізувати точний SENS authority
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати постійний Core4-сеанс з негативними тестами
        run: bash ./scripts/test-core4session.sh
