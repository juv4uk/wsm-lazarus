# G5.16: незалежний FPC доказ постійного виконуваного Core4-сеансу.
name: core4-session
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core4-session-fpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати нативні джерела без руху pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш .deb FPC між прогонами
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-deb
          key: fpc-deb-${{ runner.os }}-3.2.2-v1
          restore-keys: |
            fpc-deb-${{ runner.os }}-3.2.2-
      - name: Встановити Free Pascal
        run: |
          sudo apt-get update
          sudo cp ~/.cache/fpc-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler git
          mkdir -p ~/.cache/fpc-deb
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/fpc-deb/ 2>/dev/null || true
          fpc -iV
      - name: Матеріалізувати точний SENS authority
        run: ./scripts/sync-authority.sh
      - name: Зібрати та виконати постійний Core4-сеанс з негативними тестами
        run: bash ./scripts/test-core4session.sh
