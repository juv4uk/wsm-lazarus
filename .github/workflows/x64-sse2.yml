# G6.111 — суто host-ISA SSE2; не створює семантики SENS.
name: Компілятор — SSE2 XMM0–XMM15, 1024 машинні еталони
on:
  pull_request:
    paths:
      - 'src/wsm.x64sse2.pas'
      - 'scripts/test-x64sse2.pas'
      - 'scripts/test-x64sse2.sh'
      - '.github/workflows/x64-sse2.yml'
      - 'src/wsm.x64code.pas'
      - 'src/wsm.elfgeometry.pas'
      - 'external/sens'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-sse2:
    name: Checked FPC → GNU as 1024 → машинні SSE2 ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Перевірюваний коміт
        uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити FPC, GNU assembler та ELF інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler binutils git
          fpc -iV
      - name: Виконати FPC, 1024 GNU еталони й два справжні SSE2 ELF
        run: timeout 850s bash scripts/test-x64sse2.sh
      - name: Межі доказу
        run: |
          echo 'SSE2 кодер — host ISA; це не новий виконуваний закон SENS.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Машинні тести не вимірюють джоулі й не доводять семантичний паритет.' >> "$GITHUB_STEP_SUMMARY"
