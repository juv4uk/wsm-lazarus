# Покриття Core1: скільки визначень укр-проєкції реально є у фізичному .sens.
name: Core1 · покриття фізичних визначень

on:
  pull_request:
    paths:
      - '.github/workflows/core1-pokryttia.yml'
      - 'scripts/pokryttia-core1.sh'
      - 'external/sens'
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pokryttia:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Покриття Core1
        run: bash ./scripts/pokryttia-core1.sh

      # Списки поверхонь і імен зберігаються навіть при ЧЕРВОНОМУ прогоні —
      # саме тому, що лог може бути недоступним, а питання «чому не збігаються»
      # має закриватись фактом, а не повторним прогоном.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core1-pokryttia
          path: build/core1pok/*.txt
          if-no-files-found: warn
