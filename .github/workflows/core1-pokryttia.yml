# Покриття Core1: скільки визначень укр-проєкції реально є у фізичному .sens.
name: Core1 · покриття фізичних визначень

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pokryttia:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - name: Покриття Core1
        run: bash ./scripts/pokryttia-core1.sh

      # Списки поверхонь і імен зберігаються навіть при ЧЕРВОНОМУ прогоні —
      # саме тому, що лог може бути недоступним, а питання «чому не збігаються»
      # має закриватись фактом, а не повторним прогоном.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core1-pokryttia
          path: build/core1pok/*.txt
          if-no-files-found: warn
