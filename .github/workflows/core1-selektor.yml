# Core1.6: фізичне виконання ДРУГОГО й ТРЕТЬОГО pinned визначення Core1.
# Тіло замикання допускається лише як композиція ратифікованих селекторів:
# D3:011 «решта» виконує TBinaryExecutor, D4:1001 «друге» і D5:10011 «третє»
# виконує TCore4Runtime; композиція CADR(CDR x) — незалежний оракул тесту.
# Це НЕ повний Core1, не арифметика D12+, не GC і не REPL.
name: Core1 · фізичний селектор (друге й третє визначення)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selektor:
    name: FPC 3.2.2 та pinned Core1 — друге й третє визначення
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Кеш готового FPC (спільний, без apt на теплому кеші)
        uses: actions/cache@v4
        with:
          path: ~/.cache/fpc-root
          key: fpc-root-${{ runner.os }}-24.04-3.2.2-v1
          restore-keys: |
            fpc-root-${{ runner.os }}-24.04-3.2.2-
      - name: Установити Free Pascal (fp-compiler зі спільного кешу, apt лише за холодного кешу)
        run: bash ./scripts/fpc-restore.sh
      - name: Синхронізувати pinned SENS
        run: |
          set -euo pipefail
          ./scripts/sync-authority.sh
      - name: Фізичне виконання другого й третього визначення Core1
        run: bash ./scripts/test-core1-selektor.sh
