# G6.177 — FPC-only pinned T5M+ELF64 LRU перевірка, без важких push.
name: Компілятор — двомісний LRU кеш фізичних ELF64
on:
  schedule:
    - cron: '1 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvomisnyi-kesh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lru-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати точний SHA вихідних файлів
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Встановити Free Pascal і Python без важких додатків
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y --no-install-recommends fp-compiler fp-units-fcl git python3
          fpc -iV

      - name: Перевірити два кеші, LRU, негативи та виконання ELF64
        run: |
          set -euo pipefail
          bash -n scripts/test-wide-sesiia-kesh2.sh
          python3 -m py_compile scripts/test-wide-sesiia-kesh2.py
          timeout 580s bash scripts/test-wide-sesiia-kesh2.sh

      - name: Зафіксувати точну межу доказу
        run: |
          echo 'G6.177: один FPC процес, 64 host-кадри, 60 hits та 2 misses з 2-entry LRU проти 0 hits у cache-1 для A/B; побайтовий ELF, два машинні PIE, негативи та LRU eviction.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Без нового закону SENS, незалежного oracle чи виміру джоулів. Не запускати важкі Rust/Zig на push: цей workflow PR/manual-only.' >> "$GITHUB_STEP_SUMMARY"
