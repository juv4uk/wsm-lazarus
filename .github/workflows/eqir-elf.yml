# G6.53 — справжній фізичний D3:101 ExactIR → ELF64 і незалежний SENS.
name: Зниження точного D3 IR у виконуваний ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.eqir.pas'
      - 'scripts/test-eqir.pas'
      - 'scripts/test-eqir.sh'
      - '.github/workflows/eqir-elf.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.eqir.pas'
      - 'scripts/test-eqir.pas'
      - 'scripts/test-eqir.sh'
      - '.github/workflows/eqir-elf.yml'
permissions:
  contents: read
jobs:
  tochnyi-d3-ir-elf:
    name: FPC checked, ELF64, 16 відмов і незалежний SENS REPL
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Завантажити Free Pascal/Lazarus
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Завантажити незалежний SENS Contract 12
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC та машинні інструменти
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl git binutils
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Виконати IR-ELF, відмови та фізичний SENS oracle
        run: bash ./scripts/test-eqir.sh
