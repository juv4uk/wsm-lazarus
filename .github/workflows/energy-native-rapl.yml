# Механіка FPC RAPL: фізичні джоулі на GitHub runner не припускаються.
name: SENS — нативні лічильники енергії RAPL
on:
  pull_request:
    paths:
      - '.github/workflows/energy-native-rapl.yml'
      - 'scripts/energy/sensrapl.lpr'
      - 'scripts/energy/test-sensrapl.sh'
      - 'docs/energy-native-rapl.uk.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/energy-native-rapl.yml'
      - 'scripts/energy/sensrapl.lpr'
      - 'scripts/energy/test-sensrapl.sh'
      - 'docs/energy-native-rapl.uk.md'
permissions:
  contents: read
jobs:
  native-rapl:
    name: Реальний FPC і негативні RAPL-свідки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler
          fpc -iV
      - name: Зібрати й перевірити RAPL
        run: bash ./scripts/energy/test-sensrapl.sh
