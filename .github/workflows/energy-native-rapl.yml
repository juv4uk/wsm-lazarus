# Механіка FPC RAPL: фізичні джоулі на GitHub runner не припускаються.
name: SENS — нативні лічильники енергії RAPL
on:
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rapl:
    name: Реальний FPC і негативні RAPL-свідки
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати вихідний код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update
          command -v fpc >/dev/null || sudo apt-get install -y --no-install-recommends fp-compiler
          fpc -iV
      - name: Зібрати й перевірити RAPL
        run: bash ./scripts/energy/test-sensrapl.sh
