# G6.141 — ПРАВОВКЛАДЕНІ фізичні D5, а не існуючий лівий ланцюг.
name: SENS — праві дерева D5 у справжньому машинному ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.irarithpravy.pas'
      - 'src/sensarithpravyelf.lpr'
      - 'scripts/test-irarithpravy.pas'
      - 'scripts/test-irarithpravy.sh'
      - '.github/workflows/ir-arith-pravy.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irarithpravy.pas'
      - 'src/sensarithpravyelf.lpr'
      - 'scripts/test-irarithpravy.pas'
      - 'scripts/test-irarithpravy.sh'
      - '.github/workflows/ir-arith-pravy.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    name: checked FPC, 36 реальних ELF, 16 негативів
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити реальний FPC і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Підготувати точний SENS Contract12
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Виконати 36 машинних програм та фізичні негативи
        run: |
          bash -n scripts/test-irarithpravy.sh
          timeout 600s bash scripts/test-irarithpravy.sh
  oracle:
    name: 36 самостійних незалежних pinned SENS REPL відповідей
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Справжній FPC, machine tools
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
      - name: Синхронізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1800s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Реальні 36 SENS форми проти 36 native ELF
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: timeout 800s bash scripts/test-irarithpravy.sh
