# G6 — без окремого backend: фізичний stdin → pinned WideIR → ELF64 stdout.
name: SENS — фізичний потоковий WideIR до виконуваного ELF64
on:
  pull_request:
    paths:
      - 'src/senswidefrontpotik.lpr'
      - 'scripts/test-irwidefront-potik.sh'
      - '.github/workflows/ir-wide-front-potik.yml'
      - 'src/wsm.irwidefront.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/senswidefrontpotik.lpr'
      - 'scripts/test-irwidefront-potik.sh'
      - '.github/workflows/ir-wide-front-potik.yml'
      - 'src/wsm.irwidefront.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    name: FPC checked, 16 фізичних ELF64, 23 відмови, fragmented pipe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Встановити FPC і перевірку ELF64
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git python3
          fpc -iV
      - name: Підготувати pinned SENS Contract 12.0
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Скомпілювати потік і перевірити машинне виконання
        run: timeout 420s bash ./scripts/test-irwidefront-potik.sh
  oracle:
    name: Незалежний pinned SENS REPL на тих самих 16 фізичних ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC та інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git python3
      - name: Відновити pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned Rust/Zig SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити 16 native ELF із незалежним SENS REPL
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 420s bash ./scripts/test-irwidefront-potik.sh
      - name: Не приписувати непроведеного вимірювання джоулів
        run: echo 'ENERGY_NOT_MEASURED'
