# G6.85: перший повторно використовуваний native D1 stdin kernel.
name: Динамічний фізичний D1 — машинний ELF64 та pinned SENS
on:
  pull_request:
    paths:
      - 'src/wsm.elfd1potik.pas'
      - 'src/sensd1potikelf.lpr'
      - 'scripts/test-elfd1potik.pas'
      - 'scripts/test-elfd1potik.sh'
      - '.github/workflows/elf-d1potik.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfd1potik.pas'
      - 'src/sensd1potikelf.lpr'
      - 'scripts/test-elfd1potik.pas'
      - 'scripts/test-elfd1potik.sh'
      - '.github/workflows/elf-d1potik.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  dynamichnyi-w1:
    name: FPC, один x86-64 ELF, 4 динамічні W1 пари, незалежний SENS
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Прочитати точний Git коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити реальні FPC 3.2.2 та binutils
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git python3
          fpc -iV
      - name: Матеріалізувати тільки pinned source SENS 12.0
        run: timeout 180s ./scripts/sync-authority.sh
      - name: Зібрати ELF та реально виконати 4 входи 3 рази і негативи
        run: timeout 500s bash scripts/test-elfd1potik.sh
      - name: Завантажити незалежний SENS точного pin
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned Rust/Zig SENS oracle
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 2700s bash -c 'cd sens-oracle && cargo build --locked --release -p sens-cli --bin sens'
          test -x sens-oracle/target/release/sens
      - name: Довести чотири динамічні результати через незалежний SENS REPL
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/release/sens
        run: timeout 2100s bash scripts/test-elfd1potik.sh
      - name: Зафіксувати межу машинного доказу
        run: echo 'Один host ABI kernel із фізичними runtime W1, не повний compiler та ENERGY_NOT_MEASURED'
