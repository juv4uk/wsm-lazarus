name: SENS — машинна матриця D12 додавання та множення
on:
  pull_request:
    paths:
      - 'scripts/test-d12-elf-matrytsia.pas'
      - 'scripts/test-d12-elf-matrytsia.sh'
      - '.github/workflows/d12-elf-matrytsia.yml'
      - 'src/wsm.elfd12add.pas'
      - 'src/wsm.elfd12mul.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'scripts/test-d12-elf-matrytsia.pas'
      - 'scripts/test-d12-elf-matrytsia.sh'
      - '.github/workflows/d12-elf-matrytsia.yml'
      - 'src/wsm.elfd12add.pas'
      - 'src/wsm.elfd12mul.pas'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mashynna-matrytsia:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Справжній Free Pascal і binutils
        run: |
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils
      - name: Матеріалізувати pinned SENS 12.0
        run: timeout 240s ./scripts/sync-authority.sh
      - name: Побудувати і виконати 36 фізичних D12 пар у ELF
        run: timeout 900s bash scripts/test-d12-elf-matrytsia.sh
  nezalezhnyi-orakul:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Справжній Free Pascal і binutils
        run: |
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils
      - name: Матеріалізувати pinned SENS 12.0
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS
        run: |
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити усі машинні значення з REPL SENS
        run: |
          SENS_ORACLE_BIN="$PWD/sens-oracle/target/debug/sens" \
            timeout 900s bash scripts/test-d12-elf-matrytsia.sh
