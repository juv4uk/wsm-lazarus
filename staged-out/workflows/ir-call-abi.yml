# G6.69 — нативні CALL/RET за pinned SENS, не мова McCarthy.
name: Нативний SENS — перший CALL/RET ABI над точною D3 рівністю
on:
  pull_request:
    paths:
      - 'src/wsm.ircallabi.pas'
      - 'src/sensabielf.lpr'
      - 'scripts/test-ircallabi.sh'
      - '.github/workflows/ir-call-abi.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.ircallabi.pas'
      - 'src/sensabielf.lpr'
      - 'scripts/test-ircallabi.sh'
      - '.github/workflows/ir-call-abi.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native-call-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Отримати точний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати pinned незалежний SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal, Lazarus та машинні інструменти
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git python3 lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth
          fpc -iV
          lazbuild --version
      - name: Матеріалізувати точний SENS Contract 12
        run: timeout 150s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 600s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
          test -x sens-oracle/target/debug/sens
      - name: Справжній x86-64 CALL/RET і точний незалежний SENS oracle
        run: timeout 300s bash scripts/test-ircallabi.sh
      - name: Не вимикати попередні compiler/ELF перевірки
        run: timeout 300s bash scripts/test-sensmashyna.sh
      - name: Lazarus/LCL — справжній графічний ELF інспектор
        run: timeout 300s bash scripts/test-lcl-elf-inspector.sh
      - name: Межа стенда енергоефективності
        run: echo 'ЕНЕРГІЯ-НЕ-ВИМІРЯНА на CI; native CALL/RET parity != фізичні джоулі.'
