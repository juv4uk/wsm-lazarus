# G6.93 — 1..5 вкладених D6:001110 у одному нативному ELF.
name: Компілятор — вкладені фізичні D6 додавання у машинний ELF
on:
  pull_request:
    paths:
      - 'src/wsm.irnestedstep.pas'
      - 'src/sensnestedstepelf.lpr'
      - 'scripts/test-irnestedstep.pas'
      - 'scripts/test-irnestedstep.sh'
      - '.github/workflows/ir-nested-step.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irnestedstep.pas'
      - 'src/sensnestedstepelf.lpr'
      - 'scripts/test-irnestedstep.pas'
      - 'scripts/test-irnestedstep.sh'
      - '.github/workflows/ir-nested-step.yml'
      - 'external/sens'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-nested-steps:
    name: П'ять глибин фізичного машинного коду
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати FPC джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити справжній Free Pascal
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
          fpc -iV
      - name: Матеріалізувати pinned Contract12
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: FPC + виконання ELF + pinned SENS oracle
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-irnestedstep.sh
          timeout 600s bash scripts/test-irnestedstep.sh
      - name: Енергія не вимірювалася
        run: echo 'ENERGY_NOT_MEASURED; only native correctness'
