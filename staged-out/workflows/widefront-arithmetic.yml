# G6.131 — фізичні D5 програми через існуючий спільний native WideIR.
name: Компілятор — спільні D5 арифметичні ELF і незалежний SENS
on:
  pull_request:
    paths:
      - 'scripts/test-widefront-arithmetic.pas'
      - 'scripts/test-widefront-arithmetic.sh'
      - '.github/workflows/widefront-arithmetic.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'scripts/test-widefront-arithmetic.pas'
      - 'scripts/test-widefront-arithmetic.sh'
      - '.github/workflows/widefront-arithmetic.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  machine:
    name: Справжній checked FPC, 12 ELF64, 12 повторів і 9 відмов
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Установити Free Pascal і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Матеріалізувати точний SENS Contract 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Справжня збірка і фізичне виконання
        run: timeout 600s bash scripts/test-widefront-arithmetic.sh
  independent-sens:
    name: Незалежний pinned SENS REPL, 12 українських викликів і machine parity
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Установити FPC і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Фізична машина проти українського SENS oracle
        run: |
          set -euo pipefail
          export SENS_ORACLE_BIN="$GITHUB_WORKSPACE/sens-oracle/target/debug/sens"
          export REQUIRE_SENS_ORACLE=1
          timeout 600s bash scripts/test-widefront-arithmetic.sh
      - name: Чесна межа енергетичних доказів
        run: echo 'Енергію не виміряно; отримано фізичну коректність, не джоулі.' >> "$GITHUB_STEP_SUMMARY"
  existing-fpc-gate:
    name: Чинний загальний headless FPC gate, без послаблень
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Установити Free Pascal
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl git
          fpc -iV
      - name: Матеріалізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Усі чинні headless перевірки
        run: timeout 900s bash scripts/test.sh