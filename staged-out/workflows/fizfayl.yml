# G5.63: реальне файлове виконання точних D3 із фізичного .sens.
name: Фізичний багатоформовий файл SENS
on:
  pull_request:
    paths:
      - 'src/sensfizfayl.lpr'
      - 'scripts/test-fizfayl.py'
      - 'scripts/test-fizfayl.sh'
      - '.github/workflows/fizfayl.yml'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/sensfizfayl.lpr'
      - 'scripts/test-fizfayl.py'
      - 'scripts/test-fizfayl.sh'
      - '.github/workflows/fizfayl.yml'
      - 'src/wsm.binaryexec.pas'
      - 'src/wsm.d2source.pas'
      - 'src/wsm.t5m.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  fizychnyi-fail:
    name: FPC 3.2.x — справжній фізичний файловий D3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Установити FPC і Python
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler python3 git
          fpc -iV
      - name: Отримати закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й виконати фізичні позитивні та негативні тести
        run: bash scripts/test-fizfayl.sh
      - name: Перевірити чинний D3 differential gate
        run: bash scripts/test-binaryexec.sh
