# G6.144 — лише host stdin → verified pinned D5 WideIR → машинний ELF stdout.
# Нових SENS законів, backend або готових оцінок енергії тут немає.
name: Компілятор — фізичний потік 100 вкладених D5 у ELF64 stdout
on:
  pull_request:
    paths:
      - 'src/sensarithchainpotik.lpr'
      - 'scripts/test-irarithchain-potik.sh'
      - '.github/workflows/ir-arithchain-potik.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/sensarithchainpotik.lpr'
      - 'scripts/test-irarithchain-potik.sh'
      - '.github/workflows/ir-arithchain-potik.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  fizychnyi-potik:
    name: Реальний FPC/ELF64 та незалежний pinned SENS oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Отримати точно позначені джерела
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Окремий незалежний SENS Contract12
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити справжній FPC та машинні інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler fp-units-fcl binutils git python3
          fpc -iV
      - name: Матеріалізувати pinned фізичний SENS
        run: timeout 240s ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1200s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Виконати фізичний stdin → ELF64 stdout на 71 машині
        run: |
          set -euo pipefail
          bash -n scripts/test-irarithchain-potik.sh
          timeout 900s bash scripts/test-irarithchain-potik.sh
      - name: Незалежно підтвердити ті самі 71 фізичний результат SENS REPL
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: |
          set -euo pipefail
          bash -n scripts/test-irarithchain.sh
          timeout 900s bash scripts/test-irarithchain.sh
      - name: Зберегти чесну межу свідка
        run: |
          echo 'Перевірено фізичні stdin→ELF64 stdout, 71 незалежних машинних свідків та 71 pinned SENS oracle.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Немає довільного SENS compiler, нових семантичних законів або виміряних джоулів.' >> "$GITHUB_STEP_SUMMARY"
