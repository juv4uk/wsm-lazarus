name: Пряме зниження перевіреного ExactIR-селектора
on:
  pull_request:
    paths:
      - 'src/wsm.irlowerselector.pas'
      - 'scripts/test-ir-lowered-selector.pas'
      - 'scripts/test-ir-lowered-selector.sh'
      - '.github/workflows/ir-lowered-selector.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irlowerselector.pas'
      - 'scripts/test-ir-lowered-selector.pas'
      - 'scripts/test-ir-lowered-selector.sh'
      - '.github/workflows/ir-lowered-selector.yml'
permissions:
  contents: read
jobs:
  direct-exactir-selector:
    name: FPC, ELF64 та pinned SENS на тих самих фізичних байтах
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати точний стан Lazarus
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal та ELF інструменти
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl git binutils
          fpc -iV
      - name: Синхронізувати точний authority submodule
        run: ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати upstream SENS CLI за pinned SHA
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Зібрати та звірити прямий ExactIR lowering із ELF і SENS
        run: bash ./scripts/test-ir-lowered-selector.sh
