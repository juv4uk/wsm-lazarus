# G6.105: only pinned binary D6 min/max nested programs.
name: Компілятор SENS — вкладені D6 екстремуми у WideIR
on:
  pull_request:
    paths:
      - 'src/wsm.irmixedextrema.pas'
      - 'src/sensmixedextremaelf.lpr'
      - 'scripts/test-irmixedextrema.pas'
      - 'scripts/test-irmixedextrema.sh'
      - '.github/workflows/ir-mixed-extrema.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irmixedextrema.pas'
      - 'src/sensmixedextremaelf.lpr'
      - 'scripts/test-irmixedextrema.pas'
      - 'scripts/test-irmixedextrema.sh'
      - '.github/workflows/ir-mixed-extrema.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Підготувати checked FPC і машинний дизасемблер
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git python3
          fpc -iV
      - name: Матеріалізувати canonical pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Побудувати й виконати 16 ELF та 21 відмову
        run: timeout 300s bash scripts/test-irmixedextrema.sh
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Підготувати checked FPC
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git python3
      - name: Синхронізувати ратифіковану драбину
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Перевірити 16 реальних машинних результатів
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 300s bash scripts/test-irmixedextrema.sh
      - name: Відмежувати невиміряну енергію
        run: echo 'ENERGY_NOT_MEASURED, narrow D6 signed nested min/max only'
