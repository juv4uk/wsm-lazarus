# G6.91 — verified WideIR D5:11010(W12,W12) to existing native ELF.
name: SENS — фізична D5 менше? через широкий IR до машинного ELF64
on:
  pull_request:
    paths:
      - 'src/wsm.irwideless.pas'
      - 'src/senswidemenelf.lpr'
      - 'scripts/test-irwideless.pas'
      - 'scripts/test-irwideless.sh'
      - '.github/workflows/ir-wide-less.yml'
      - 'src/wsm.wideir.pas'
      - 'src/wsm.wideirguard.pas'
      - 'src/wsm.elfd12less.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irwideless.pas'
      - 'src/senswidemenelf.lpr'
      - 'scripts/test-irwideless.pas'
      - 'scripts/test-irwideless.sh'
      - '.github/workflows/ir-wide-less.yml'
      - 'src/wsm.wideir.pas'
      - 'src/wsm.wideirguard.pas'
      - 'src/wsm.elfd12less.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Встановити реальний Free Pascal 3.2.x та дизасемблер
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Матеріалізувати ратифікований pinned SENS
        run: timeout 240s bash ./scripts/sync-authority.sh
      - name: Зібрати та виконати 18 канонічних D5 програм і 21 негатив
        run: timeout 300s bash ./scripts/test-irwideless.sh
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC, Git і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 240s sudo apt-get install -y fp-compiler binutils git
      - name: Підключити точний pinned Contract 12.0
        run: timeout 240s bash ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig REPL SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити машину з 18 незалежними українськими викликами «менше?»
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 300s bash ./scripts/test-irwideless.sh
      - name: Відокремити неперевірену енергію
        run: echo 'ENERGY_NOT_MEASURED — only verified machine and SENS parity'
