# G6.101 physical D6 min/max; do not change semantics or shared CI.
name: Компілятор SENS — фізичні екстремуми D6 через WideIR
on:
  pull_request:
    paths:
      - 'src/wsm.irwideextrema.pas'
      - 'src/senswideextremaelf.lpr'
      - 'scripts/test-irwideextrema.pas'
      - 'scripts/test-irwideextrema.sh'
      - '.github/workflows/ir-wide-extrema.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irwideextrema.pas'
      - 'src/senswideextremaelf.lpr'
      - 'scripts/test-irwideextrema.pas'
      - 'scripts/test-irwideextrema.sh'
      - '.github/workflows/ir-wide-extrema.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Підготувати FPC та x86 дизасемблер
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git python3
          fpc -iV
      - name: Матеріалізувати pinned SENS authority
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Запустити 32 фізичні ELF64 і негативні перевірки
        run: timeout 300s bash scripts/test-irwideextrema.sh
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити справжній FPC
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git python3
      - name: Матеріалізувати pinned SENS authority
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити всі 32 реальні native результати з SENS
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 300s bash scripts/test-irwideextrema.sh
      - name: Не підміняти вимірювання енергії
        run: echo 'ENERGY_NOT_MEASURED — narrow physical D6 min/max compiler only'
