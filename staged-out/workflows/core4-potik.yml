# G4.48 — bounded raw stdin/stdout над чинним pinned Core4 evaluator.
name: Core4 — фізичний потік та Lazarus
on:
  pull_request:
    paths:
      - 'src/senscore4potik.lpr'
      - 'scripts/test-core4potik.sh'
      - '.github/workflows/core4-potik.yml'
      - 'external/sens'
      - 'refs/**'
  push:
    branches: [main]
    paths:
      - 'src/senscore4potik.lpr'
      - 'scripts/test-core4potik.sh'
      - '.github/workflows/core4-potik.yml'
      - 'external/sens'
      - 'refs/**'
permissions:
  contents: read
jobs:
  fizychnyi-potik:
    name: Реальні FPC Core4 1/3/64, pinned T5M, негативи, Lazarus GTK2/Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Взяти точний git SHA
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Встановити Free Pascal і Lazarus
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler git python3 lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth
          fpc -iV
          lazbuild --version
      - name: Відновити pinned закони SENS
        run: bash ./scripts/sync-authority.sh
      - name: Виконати реальні фізичні Core4 форми без host-кадру
        run: timeout 240s bash ./scripts/test-core4potik.sh
      - name: Перевірити справжню Lazarus/LCL оболонку тих самих Core4 коренів
        run: timeout 300s bash ./scripts/test-lcl-core4-koreni.sh
