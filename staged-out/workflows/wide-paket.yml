# G6.130 — пакетна компіляція фізичних .sens одним FPC-процесом.
# Ні нових семантичних законів, ні копії Core1/Core4.
name: SENS — пакет із 16 перевірених нативних ELF64
on:
  pull_request:
    paths:
      - 'src/senswidepaketelf.lpr'
      - 'scripts/test-wide-paket.sh'
      - '.github/workflows/wide-paket.yml'
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/senswidepaketelf.lpr'
      - 'scripts/test-wide-paket.sh'
      - '.github/workflows/wide-paket.yml'
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    name: Checked FPC, 16 справжніх ELF, 11 негативів
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити справжній Free Pascal та машинні інструменти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler git binutils
          fpc -iV
      - name: Взяти точний мовний авторитет SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Побудувати і виконати всі машинні ELF64 та негативи
        run: timeout 650s bash scripts/test-wide-paket.sh
      - name: Межа доказу
        run: |
          echo '16 canonical .sens форм → 16 native ELF64 у спільному FPC-процесі; фізичні T5M результати і 11 негативів.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Не доведено: довільний SENS код, REPL, Core1/Core4 parity чи джоулі.' >> "$GITHUB_STEP_SUMMARY"
  oracle:
    name: Незалежний pinned SENS REPL, 16/16
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Free Pascal та утиліти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler git binutils
      - name: Точний pinned authority
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Незалежний Rust/Zig SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Зіставити 16 справжніх ELF64 з independent SENS oracle
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 800s bash scripts/test-wide-paket.sh
