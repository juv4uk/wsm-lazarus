# G6.125 — pinned SENS, реальні x86-64 IMUL×2 → ADD ELF64.
name: Компілятор — два фізичні D5 добутки та одна машинна сума
on:
  pull_request:
    paths:
      - 'src/wsm.irtwomuladd.pas'
      - 'src/senstwomuladdelf.lpr'
      - 'scripts/test-irtwomuladd.pas'
      - 'scripts/test-irtwomuladd.sh'
      - '.github/workflows/ir-two-mul-add.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.irtwomuladd.pas'
      - 'src/senstwomuladdelf.lpr'
      - 'scripts/test-irtwomuladd.pas'
      - 'scripts/test-irtwomuladd.sh'
      - '.github/workflows/ir-two-mul-add.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  two-products:
    name: Checked FPC → 14 ELF64 → pinned SENS binary oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Отримати точний коміт
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Взяти незалежний pinned SENS Contract 12
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Справжній FPC 3.2.x та binutils
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Реальні ELF64 і всі негативні випадки без оракула
        run: timeout 600s bash scripts/test-irtwomuladd.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS CLI
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          timeout 1200s bash -c 'cd sens-oracle && cargo build --locked -p sens-cli --bin sens'
      - name: Оракул на ТИХ САМИХ фізичних .sens файлах
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 900s bash scripts/test-irtwomuladd.sh
      - name: Межа доказу
        run: |
          echo '14 nested exact D5 programs → 14 machine ELF (2 IMUL + ADD).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Host-only explicit D12 промежуточні добутки; D24 фінальна сума.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Не загальний compiler; джоулі/RAPL не виміряні.' >> "$GITHUB_STEP_SUMMARY"
