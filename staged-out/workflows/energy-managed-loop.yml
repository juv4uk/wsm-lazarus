name: Managed runtime D12 profile

on:
  push:
    paths:
      - 'evidence/energy-managed-loop-20261029/**'
      - 'evidence/energy-native-d12-loop-20261029/**'
      - 'src/**'
      - '.github/workflows/energy-managed-loop.yml'
  pull_request:
    paths:
      - 'evidence/energy-managed-loop-20261029/**'
      - 'evidence/energy-native-d12-loop-20261029/**'
      - 'src/**'
      - '.github/workflows/energy-managed-loop.yml'

jobs:
  build-and-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Install Free Pascal and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler python3
      - name: Compile managed runtimes and native SENS witness
        run: timeout 900s bash evidence/energy-managed-loop-20261029/build.sh
      - name: Runtime, negative, protocol, and physical parity checks
        run: |
          timeout 180s python3 evidence/energy-managed-loop-20261029/test_measure.py
          timeout 180s python3 evidence/energy-managed-loop-20261029/measure.py --check-only --warmup 20 --batch-reps 10 --cold-batch-reps 2
