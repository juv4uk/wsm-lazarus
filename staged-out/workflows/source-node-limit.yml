name: Український структурний reader — обмеження вузлів

on:
  pull_request:
    paths:
      - 'src/wsm.source.pas'
      - 'scripts/test-source.pas'
      - '.github/workflows/source-node-limit.yml'
  push:
    branches: [main]
    paths:
      - 'src/wsm.source.pas'
      - 'scripts/test-source.pas'
      - '.github/workflows/source-node-limit.yml'

permissions:
  contents: read

jobs:
  vuzly-ukr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Отримати код
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Встановити Free Pascal 3.2.x
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-compiler git
          fpc -iV
      - name: Завантажити закріплений SENS
        run: ./scripts/sync-authority.sh
      - name: Зібрати й перевірити AST, негативи і витоки
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m0.2/source-node-units build/m0.2/bin
          fpc -B -Mobjfpc -gh -Cr -Co -Ci -gl \
            -Fu"$PWD/src" -FU"$PWD/build/m0.2/source-node-units" \
            -FE"$PWD/build/m0.2/bin" -otest-source-node \
            "$PWD/scripts/test-source.pas"
          ./build/m0.2/bin/test-source-node 2>&1 | tee build/m0.2/source-node-heap.log
          if grep -E '[1-9][0-9]* unfreed memory blocks' build/m0.2/source-node-heap.log; then
            echo "Помилка: знайдені незвільнені AST-блоки" >&2
            exit 1
          fi
