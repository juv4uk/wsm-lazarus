# G3.43: справжній Free Pascal + Lazarus GTK2, pinned Core1 та SENS-оракул.
name: Lazarus — виконуване перше замикання Core1
on:
  pull_request:
    paths:
      - 'gui/sens-core1-pershe-okno.lpr'
      - 'gui/sens-core1-pershe-okno.lpi'
      - 'scripts/test-lcl-core1-pershe.sh'
      - '.github/workflows/lcl-core1-pershe.yml'
      - 'src/wsm.core1first.pas'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'gui/sens-core1-pershe-okno.lpr'
      - 'gui/sens-core1-pershe-okno.lpi'
      - 'scripts/test-lcl-core1-pershe.sh'
      - '.github/workflows/lcl-core1-pershe.yml'
      - 'src/wsm.core1first.pas'
      - 'src/wsm.core4runtime.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  pershe-grafichne-zamykannia:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Отримати нативний код
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Отримати незалежний pinned SENS
        uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити Free Pascal та Lazarus GTK2/Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler fp-units-fcl lcl-gtk2-3.0 lcl-utils-3.0 lazarus-src-3.0 xvfb xauth git python3
          fpc -iV
          lazbuild --version
      - name: Матеріалізувати pinned contract SENS
        run: ./scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати справжній незалежний SENS-оракул
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Виконати фізичні Core1 форми і графічні перевірки
        run: bash scripts/test-lcl-core1-pershe.sh
