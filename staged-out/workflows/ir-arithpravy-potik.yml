# G6.146 — фізичний stdin для ВЖЕ перевіреного правовкладеного
# D5 WideIR; один EOF-bound T5M -> байтово однаковий ELF64 stdout.
name: SENS — правий фізичний D5 потік у виконуваний ELF64
on:
  pull_request:
    paths:
      - 'src/sensarithpravypotik.lpr'
      - 'scripts/test-irarithpravy-potik.sh'
      - '.github/workflows/ir-arithpravy-potik.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/sensarithpravypotik.lpr'
      - 'scripts/test-irarithpravy-potik.sh'
      - '.github/workflows/ir-arithpravy-potik.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    name: Фізичний stdin, checked FPC і 36 ELF з негативами
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Встановити справжній Free Pascal та утиліти
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler fp-units-fcl binutils git python3
          fpc -iV
      - name: Матеріалізувати pinned Contract 12
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Зібрати FPC, порівняти 36 машин і виконати негативи
        run: |
          bash -n scripts/test-irarithpravy-potik.sh
          timeout 700s bash scripts/test-irarithpravy-potik.sh
  oracle:
    name: 36 pinned Rust/Zig SENS-оракулів для того самого компілятора
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити справжні FPC і binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler fp-units-fcl binutils git
      - name: Синхронізувати фізичну authority
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 1800s cargo build --locked -p sens-cli --bin sens)
          test -x sens-oracle/target/debug/sens
      - name: Перевірити семантичні результати тих самих 36 форм
        env:
          SENS_ORACLE_BIN: ./sens-oracle/target/debug/sens
        run: timeout 850s bash scripts/test-irarithpravy.sh
