name: Компілятор SENS — повторно використовувані фізичні D12 екстремуми
on:
  pull_request:
    paths:
      - 'src/wsm.elfd12extremapotik.pas'
      - 'src/wsm.x64frameio.pas'
      - 'src/sensd12extremapotikelf.lpr'
      - 'scripts/test-elfd12extremapotik-fixtures.pas'
      - 'scripts/test-elfd12extremapotik.sh'
      - '.github/workflows/elf-d12-extrema-stream.yml'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/wsm.elfd12extremapotik.pas'
      - 'src/sensd12extremapotikelf.lpr'
      - 'scripts/test-elfd12extremapotik-fixtures.pas'
      - 'scripts/test-elfd12extremapotik.sh'
      - '.github/workflows/elf-d12-extrema-stream.yml'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - name: Встановити FPC та binutils
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git python3
          fpc -iV
      - name: Синхронізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Виконати dynamic D12, короткі read та негативні випадки
        run: timeout 300s bash scripts/test-elfd12extremapotik.sh
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC
        run: |
          set -euo pipefail
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git python3
      - name: Синхронізувати pinned SENS
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний pinned SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Звірити 36 результатів, дроблений stdin і EOF
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 300s bash scripts/test-elfd12extremapotik.sh
      - name: Енергія не виміряна
        run: echo 'ENERGY_NOT_MEASURED — two narrow dynamic D12 host kernels'
