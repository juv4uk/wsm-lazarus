# G6.134 — атомарний каталог ELF64 без нового закону SENS.
name: SENS — атомарний каталог 16 нативних ELF64
on:
  pull_request:
    paths:
      - 'src/senswideatompaketelf.lpr'
      - 'scripts/test-wide-atom-paket.sh'
      - '.github/workflows/wide-atom-paket.yml'
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
  push:
    branches: [main]
    paths:
      - 'src/senswideatompaketelf.lpr'
      - 'scripts/test-wide-atom-paket.sh'
      - '.github/workflows/wide-atom-paket.yml'
      - 'src/wsm.irwidefront.pas'
      - 'src/wsm.elfpublish.pas'
      - 'external/sens'
permissions:
  contents: read
jobs:
  native:
    name: FPC checked, 16 ELF, 11 відмов і двопроцесна гонка
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - name: Справжній Free Pascal та машинні засоби
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git
          fpc -iV
      - name: Перевірити pinned SENS 12.0
        run: timeout 240s bash scripts/sync-authority.sh
      - name: Зібрати, виконати та довести атомарність каталогу
        run: timeout 650s bash scripts/test-wide-atom-paket.sh
      - name: Межа підтвердження
        run: |
          echo '16 canonical .sens → 16 native ELF64, all-or-none directory visibility, no-replace renameat2, race 1/2.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Не загальний компілятор SENS; не системний образ; енергію не виміряно.' >> "$GITHUB_STEP_SUMMARY"
  oracle:
    name: Незалежний SENS 12.0 і 16 реальних x86-64 ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {submodules: false, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 1f1bf676eeac605e065035d9dd2adaae807f1788
          path: sens-oracle
          persist-credentials: false
      - name: Встановити FPC та binutils
        run: |
          set -euo pipefail
          timeout 240s sudo apt-get update
          timeout 300s sudo apt-get install -y fp-compiler binutils git
      - name: Точний мовний авторитет
        run: timeout 240s bash scripts/sync-authority.sh
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./sens-oracle/.github/actions/install-zig
      - name: Зібрати незалежний Rust/Zig SENS REPL
        run: |
          set -euo pipefail
          test "$(git -C sens-oracle rev-parse HEAD)" = 1f1bf676eeac605e065035d9dd2adaae807f1788
          (cd sens-oracle && timeout 2100s cargo build --locked -p sens-cli --bin sens)
      - name: Зіставити всі 16 SENS викликів із native ELF64
        env:
          SENS_ORACLE_BIN: ${{ github.workspace }}/sens-oracle/target/debug/sens
        run: timeout 800s bash scripts/test-wide-atom-paket.sh
